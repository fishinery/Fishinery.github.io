<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>🎣 Рыбалка RPG v7.1</title>
<style>
:root{--bg:#080c16;--panel:#131a2c;--panel2:#1c2540;--line:#2c3860;--txt:#e0e8f8;--dim:#7a88ac;--gold:#ffc94a;--acc:#4aa8ff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;}
body{
  background:radial-gradient(circle at 50% -10%,#1a2340,#050810 65%);
  color:var(--txt);font-family:'Courier New',monospace;
  display:flex;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  touch-action:manipulation;
}
.wrap{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;gap:4px;padding:4px;overflow-y:auto;overflow-x:hidden;}

header{display:flex;align-items:center;gap:3px;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:4px 6px;box-shadow:0 3px 0 #00000066;flex-shrink:0;flex-wrap:nowrap;}
.badge{background:var(--panel2);border:2px solid var(--line);border-radius:5px;padding:1px 5px;font-weight:bold;font-size:10px;white-space:nowrap;flex-shrink:0;}
.badge b{color:var(--acc);}
#nameTag{color:var(--gold);font-size:10px;max-width:55px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.xpwrap{flex:1;position:relative;height:14px;background:#050810;border:2px solid var(--line);border-radius:5px;overflow:hidden;min-width:30px;}
.xpfill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,#2f8f4a,#5ddc6a);transition:width .35s;}
.xptxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:bold;text-shadow:0 1px 2px #000;}
.gold{color:var(--gold);}
.weather-badge{font-size:12px;}
#modeBtn{background:rgba(74,168,255,0.25);border:2px solid var(--acc);border-radius:5px;padding:1px 5px;color:#fff;font-size:10px;font-weight:bold;cursor:pointer;font-family:inherit;flex-shrink:0;}
#saveBtn{background:rgba(93,220,106,0.2);border:2px solid #5ddc6a;border-radius:5px;padding:1px 5px;color:#5ddc6a;font-size:10px;font-weight:bold;cursor:pointer;font-family:inherit;flex-shrink:0;}

/* === КАНВАС — надёжный aspect-ratio через padding === */
.stage{
  position:relative;
  width:min(100%, calc(55vh * 16 / 9));
  margin:0 auto;
  flex-shrink:0;
  border:3px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 4px 0 #00000066,inset 0 0 20px #00000066;
  background:#000;
}
.stage::before{content:'';display:block;padding-top:56.25%;}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}

#viewBtn{position:absolute;top:4px;right:4px;width:38px;height:28px;background:rgba(74,168,255,0.4);border:2px solid rgba(74,168,255,0.85);border-radius:6px;color:#fff;font-size:11px;font-weight:bold;cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000;font-family:inherit;padding:0;}
#viewBtn.hidden{display:none;}

.dpad{position:absolute;bottom:4px;left:4px;width:96px;height:96px;pointer-events:none;z-index:10;}
.dpad.hidden{display:none;}
.dbtn{position:absolute;width:30px;height:30px;background:rgba(74,168,255,0.4);border:2px solid rgba(74,168,255,0.8);border-radius:6px;color:#fff;font-size:13px;font-weight:bold;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000;-webkit-user-select:none;user-select:none;padding:0;margin:0;font-family:inherit;}
.dbtn.pressed{background:rgba(74,168,255,0.85);transform:scale(0.92);}
.d-up{top:0;left:33px;}.d-down{top:66px;left:33px;}.d-left{top:33px;left:0;}.d-right{top:33px;left:66px;}

#action{width:100%;padding:12px;font-family:inherit;font-size:13px;font-weight:bold;letter-spacing:1px;color:#0b0f1a;cursor:pointer;border:none;border-radius:10px;background:linear-gradient(180deg,#7fe08a,#3fae52);box-shadow:0 4px 0 #1d6b2c;transition:transform .08s,box-shadow .08s,background .15s;touch-action:none;min-height:46px;flex-shrink:0;}
#action:active{transform:translateY(3px);box-shadow:0 1px 0 #1d6b2c;}
#action.wait{background:linear-gradient(180deg,#5a6888,#39445c);box-shadow:0 4px 0 #222a3a;color:#c8d2e8;}
#action.hot{background:linear-gradient(180deg,#ffd45e,#e09a1a);box-shadow:0 4px 0 #8a5c0a;animation:pulse .35s infinite alternate;}
#action.pull{background:linear-gradient(180deg,#7fb0ff,#3a6fd8);box-shadow:0 4px 0 #1e3f80;color:#fff;}
#action.locked{background:linear-gradient(180deg,#7a4040,#3a2020);color:#c8a0a0;}
@keyframes pulse{from{filter:brightness(1);}to{filter:brightness(1.35);}}

.tabs{display:flex;gap:3px;flex-shrink:0;}
.tab{flex:1;padding:5px 2px;font-family:inherit;font-size:8px;font-weight:bold;color:var(--dim);background:var(--panel);border:2px solid var(--line);border-radius:6px;cursor:pointer;transition:.15s;text-transform:uppercase;}
.tab.active{background:var(--acc);color:#050810;border-color:var(--acc);}

.panelarea{flex:1;overflow-y:auto;min-height:60px;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:5px;}
.panelarea::-webkit-scrollbar{width:5px;}
.panelarea::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

.item{display:flex;justify-content:space-between;align-items:center;gap:5px;padding:5px 7px;margin-bottom:3px;border-radius:6px;font-size:10px;background:var(--panel2);border:1px solid transparent;cursor:pointer;transition:.15s;min-height:28px;}
.item:hover{border-color:var(--line);}
.item.sel{border-color:var(--acc);background:#1f3054;box-shadow:0 0 8px #4aa8ff44;}
.item.locked{opacity:.4;cursor:not-allowed;}
.item.owned{background:#1c3a26;border-color:#2f7a45;cursor:default;}
.item .sub{font-size:8px;color:var(--dim);display:block;margin-top:1px;}
.item .price{color:var(--gold);font-weight:bold;font-size:9px;white-space:nowrap;text-align:right;}
.item.rar0{color:#9aa4b0}.item.rar1{color:#5ddc6a}.item.rar2{color:#4aa8ff}
.item.rar3{color:#b06bff}.item.rar4{color:#ffb020}.item.rar5{color:#ff3b6b}.item.rar6{color:#ff0066}

.shopbtn{width:100%;padding:6px;margin-top:3px;font-family:inherit;font-size:9px;font-weight:bold;cursor:pointer;border:2px solid #7a5a1a;border-radius:6px;background:#3a2c10;color:var(--gold);transition:.15s;}
.shopbtn:hover{background:#4d3a15;}.shopbtn:disabled{opacity:.3;cursor:not-allowed;}

.custom-row{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;}
.custom-opt{padding:4px 7px;background:var(--panel2);border:2px solid var(--line);border-radius:6px;cursor:pointer;font-size:9px;font-weight:bold;color:var(--txt);transition:.15s;display:flex;align-items:center;gap:4px;}
.custom-opt.active{background:var(--acc);color:#050810;border-color:var(--acc);}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid #00000055;}
.custom-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:6px 0 3px;border-bottom:1px solid var(--line);padding-bottom:2px;}
#nameInput{width:100%;padding:7px;font-family:inherit;font-size:11px;background:#050810;border:2px solid var(--line);border-radius:6px;color:var(--txt);margin-bottom:5px;}
#resetBtn{width:100%;padding:6px;margin-top:8px;font-family:inherit;font-size:9px;font-weight:bold;cursor:pointer;border:2px solid #8a2020;border-radius:6px;background:#3a0a0a;color:#e05050;}

#log{background:#050810;border:2px solid var(--line);border-radius:8px;padding:4px 6px;font-size:8px;height:42px;overflow-y:auto;line-height:1.4;flex-shrink:0;}
#log::-webkit-scrollbar{width:4px;}#log::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}

#toasts{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:100%;max-width:340px;padding:0 10px;}
.toast{background:rgba(20,28,50,0.98);border:2px solid var(--acc);border-radius:8px;padding:6px 10px;font-size:10px;font-weight:bold;box-shadow:0 4px 12px #00000099;animation:toastIn .35s cubic-bezier(.3,1.4,.6,1),toastOut .35s 2.4s forwards;text-align:center;}
.toast.gold{border-color:var(--gold);color:var(--gold);}
.toast.success{border-color:#5ddc6a;color:#5ddc6a;}
.toast.danger{border-color:#e05050;color:#e05050;}
@keyframes toastIn{from{opacity:0;transform:translateY(-15px) scale(.9);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px);}}

.floattext{position:absolute;pointer-events:none;font-weight:bold;font-size:10px;animation:floatUp 1.2s ease-out forwards;text-shadow:2px 2px 0 #000;transform:translate(-50%,-50%);}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,-50%);}100%{opacity:0;transform:translate(-50%,-120%);}}

#err{position:fixed;bottom:0;left:0;right:0;background:#8a2020;color:#fff;padding:8px;font-size:10px;z-index:9999;font-family:monospace;display:none;}

/* На коротких экранах уменьшаем лог */
@media (max-height:500px){
  #log{height:28px;}
  .panelarea{min-height:40px;}
  header{padding:2px 4px;}
  .badge{font-size:9px;padding:0 4px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">Ур.<b id="lvl">1</b></div>
    <div id="nameTag">Рыбак</div>
    <div class="xpwrap"><div class="xpfill" id="xpfill"></div><div class="xptxt" id="xptxt">0/40</div></div>
    <div class="badge gold">🪙<b id="gold">0</b></div>
    <div class="badge weather-badge" id="weather">☀️</div>
    <button id="saveBtn" title="Сохранить">💾</button>
    <button id="modeBtn">🌍</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="scene"></canvas>
    <button id="viewBtn" title="Вид (V)">👁️</button>
    <div class="dpad" id="dpad">
      <button class="dbtn d-up" data-dir="up">▲</button>
      <button class="dbtn d-left" data-dir="left">◀</button>
      <button class="dbtn d-right" data-dir="right">▶</button>
      <button class="dbtn d-down" data-dir="down">▼</button>
    </div>
  </div>
  <button id="action">🎣 Забросить</button>
  <div class="tabs">
    <button class="tab active" data-tab="map">🗺️ Мир</button>
    <button class="tab" data-tab="gear">🎣 Снасти</button>
    <button class="tab" data-tab="journal">📖 Дневник</button>
    <button class="tab" data-tab="ach">🏆 Награды</button>
    <button class="tab" data-tab="hero">🎨 Герой</button>
  </div>
  <div class="panelarea" id="panel"></div>
  <div id="log"></div>
</div>
<div id="toasts"></div>
<div id="err"></div>

<script>
window.addEventListener('error', e=>{
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = '⚠️ ' + e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno;
});

try {

/* ==================== АУДИО ==================== */
const A = (()=>{
  let ctx=null;
  const init=()=>{ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(ctx&&ctx.state==='suspended')ctx.resume(); };
  const tone=(f,d,type='sine',v=0.1)=>{
    if(!ctx)return;
    const o=ctx.createOscillator(),g2=ctx.createGain();
    o.type=type;o.frequency.value=f;o.connect(g2);g2.connect(ctx.destination);
    const t=ctx.currentTime;
    g2.gain.setValueAtTime(v,t);g2.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.start(t);o.stop(t+d);
  };
  return {
    init,
    splash(){ if(!ctx)return; const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.35),ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=1;const g2=ctx.createGain();g2.gain.value=0.18;s.connect(f).connect(g2).connect(ctx.destination);s.start(); },
    bite(){ tone(880,0.15,'square',0.18);setTimeout(()=>tone(1300,0.12,'square',0.15),80);setTimeout(()=>tone(1600,0.12,'square',0.13),160); },
    cast(){ tone(180,0.18,'sine',0.12);setTimeout(()=>tone(140,0.2,'sine',0.08),90); },
    catchIt(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.13),i*70)); },
    fail(){ tone(220,0.25,'sawtooth',0.08); },
    coin(){ tone(1200,0.07,'sine',0.09);setTimeout(()=>tone(1600,0.07,'sine',0.09),50); },
    levelup(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.28,'triangle',0.15),i*95)); },
    reel(){ tone(380+Math.random()*250,0.04,'sine',0.025); },
    dart(){ tone(300,0.12,'sawtooth',0.08); },
    snap(){ tone(200,0.3,'sawtooth',0.15);setTimeout(()=>tone(150,0.4,'sawtooth',0.12),80); },
    step(){ tone(120+Math.random()*40,0.05,'sine',0.02); },
    switch(){ tone(600,0.08,'triangle',0.12);setTimeout(()=>tone(900,0.1,'triangle',0.1),70); },
    save(){ tone(1400,0.05,'sine',0.08);setTimeout(()=>tone(1800,0.05,'sine',0.06),60); },
  };
})();
const vibrate=(p)=>{ if(navigator.vibrate) try{navigator.vibrate(p);}catch(e){} };

/* ==================== ДАННЫЕ ==================== */
const RARITY = [
  {n:'Обычная',c:'#9aa4b0'},{n:'Необычная',c:'#5ddc6a'},{n:'Редкая',c:'#4aa8ff'},
  {n:'Эпическая',c:'#b06bff'},{n:'Легендарная',c:'#ffb020'},{n:'Мифическая',c:'#ff3b6b'},{n:'Божественная',c:'#ff0066'},
];

const FISH = {
  plotva:{n:'Плотва',r:0,w:42,v:4,x:3,str:1,time:['day'],weather:['clear','rain','cloudy'],c:{body:'#b9c4cf',belly:'#e8eef4',fin:'#7d8b9a'}},
  karas:{n:'Карась',r:0,w:36,v:7,x:5,str:1.2,time:['day','dawn','dusk'],weather:['any'],c:{body:'#c8a24a',belly:'#e8cd82',fin:'#96762c'}},
  boot:{n:'Старый сапог',r:0,w:9,v:1,x:1,str:0.5,time:['both'],weather:['any'],trash:true,c:{body:'#5a4632',belly:'#6f5940',fin:'#3d2f21'}},
  okun:{n:'Окунь',r:1,w:20,v:16,x:11,str:1.6,time:['dawn','dusk'],weather:['clear','cloudy'],c:{body:'#4e8c5a',belly:'#c9d98a',fin:'#2f5c39'}},
  lin:{n:'Линь',r:1,w:14,v:24,x:15,str:1.8,time:['night'],weather:['any'],c:{body:'#6b7a3a',belly:'#a3b25e',fin:'#4a5626'}},

  shuka:{n:'Щука',r:2,w:6,v:58,x:32,str:2.8,time:['dawn'],weather:['rain','storm','cloudy'],c:{body:'#5f7a4a',belly:'#c6da9e',fin:'#3c4f2e'}},

  krasota:{n:'Рыба-красота',r:5,w:0.08,v:1500,x:600,str:4,time:['dawn'],weather:['clear'],c:{body:'#ff6b9d',belly:'#ffd0e0',fin:'#cc3a6a'}},

  zhereh:{n:'Жерех',r:1,w:16,v:35,x:22,str:2.2,time:['day'],weather:['clear'],c:{body:'#c0c8d0',belly:'#e8eef4',fin:'#8a929a'}},
  som:{n:'Сом',r:3,w:3,v:220,x:110,str:4,time:['night'],weather:['rain','storm'],c:{body:'#5a5148',belly:'#8e8272',fin:'#3a332c'}},
  osetr:{n:'Осётр',r:4,w:0.6,v:700,x:260,str:4.5,time:['both'],weather:['storm'],c:{body:'#8a7a5c',belly:'#c2b48e',fin:'#5c4f38'}},
  zhemchug:{n:'Жемчужная рыба',r:5,w:0.1,v:2000,x:800,str:5,time:['night'],weather:['clear'],c:{body:'#e8f0ff',belly:'#ffffff',fin:'#a8b8d0'}},
  lesch:{n:'Лещ',r:0,w:32,v:20,x:12,str:1.6,time:['day','dawn'],weather:['any'],c:{body:'#c0a878',belly:'#e6d4a8',fin:'#8a7548'}},
  karp:{n:'Карп',r:1,w:22,v:50,x:28,str:2.2,time:['day'],weather:['clear','cloudy'],c:{body:'#d4a03c',belly:'#f0cc7a',fin:'#a07420'}},
  ugor:{n:'Угорь',r:2,w:9,v:130,x:70,str:3,time:['night'],weather:['rain','storm'],c:{body:'#3e4a3a',belly:'#657a5c',fin:'#26302a'}},
  plotva2:{n:'Крупная плотва',r:0,w:26,v:25,x:15,str:1.5,time:['day'],weather:['any'],c:{body:'#b0bcc8',belly:'#dce4ec',fin:'#758390'}},
  somgig:{n:'Сом-гигант',r:3,w:3.5,v:380,x:180,str:5,time:['night'],weather:['any'],c:{body:'#4a4238',belly:'#7d7362',fin:'#2c2620'}},
  korol:{n:'Королевский карп',r:4,w:0.5,v:1200,x:420,str:5,time:['dawn','dusk'],weather:['clear'],c:{body:'#e8c84a',belly:'#fff3b0',fin:'#b08a1a'}},
  zerkalny:{n:'Зеркальный карп',r:5,w:0.08,v:3000,x:1200,str:6,time:['dusk'],weather:['clear'],c:{body:'#c8dcff',belly:'#f0f8ff',fin:'#7a9ab0'}},
  kamysh:{n:'Камышовка',r:0,w:36,v:14,x:10,str:1.3,time:['day','dawn'],weather:['any'],c:{body:'#8a9a6a',belly:'#c8d8a8',fin:'#5a6a3a'}},
  frog:{n:'Лягушка',r:0,w:28,v:11,x:8,str:1.1,time:['night'],weather:['rain','storm'],c:{body:'#5a8a3a',belly:'#a8c878',fin:'#2f5a1a'}},
  vzduh:{n:'Рыба-пузырь',r:1,w:18,v:28,x:20,str:1.8,time:['dusk','night'],weather:['any'],c:{body:'#a8c0a0',belly:'#e0ecd8',fin:'#7a9070'}},
  zmeegolov:{n:'Змееголов',r:2,w:8,v:100,x:58,str:3,time:['night'],weather:['rain','storm'],c:{body:'#4a5a3a',belly:'#7a8a5a',fin:'#2a3a1a'}},
  bolotnik:{n:'Болотник',r:3,w:3,v:280,x:130,str:4,time:['night'],weather:['rain'],c:{body:'#3a4a2a',belly:'#5a6a3a',fin:'#1a2a0a'}},
  chudovishe:{n:'Болотное чудище',r:5,w:0.07,v:3500,x:1400,str:6.5,time:['night'],weather:['storm'],c:{body:'#2a3a1a',belly:'#4a5a2a',fin:'#0a1a00'}},

let map = [];

/* Seeded RNG — карта всегда одна и та же */
let _seed = 42;
function sRand(){ _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }
function resetSeed(){ _seed = 42; }

function isWater(t){ return t===T.POND||t===T.RIVER||t===T.LAKE||t===T.SWAMP||t===T.SEA||t===T.ICE||t===T.ABYSS||t===T.LAVA; }
function isLethalWater(t){ return t===T.LAVA || t===T.ABYSS; }
function isWalkable(t){ return t===T.GRASS||t===T.PATH||t===T.TALL_GRASS||t===T.FLOWER||t===T.BEACH||t===T.PATH_STONE||t===T.SWAMP_GRASS||t===T.BRIDGE; }
function waterToZone(t){ return {[T.POND]:0,[T.RIVER]:1,[T.LAKE]:2,[T.SWAMP]:3,[T.SEA]:4,[T.ICE]:5,[T.ABYSS]:6,[T.LAVA]:7}[t]; }

function generateBlobWater(cx, cy, rx, ry, tile, noise){
  noise = noise || 0.35;
  for(let y=Math.floor(cy-ry-2); y<=cy+ry+2; y++){
    for(let x=Math.floor(cx-rx-2); x<=cx+rx+2; x++){
      if(x<1||x>=MAP_W-1||y<1||y>=MAP_H-1) continue;
      const nx = (x-cx)/rx, ny = (y-cy)/ry;
      const d = Math.sqrt(nx*nx + ny*ny);
      const ang = Math.atan2(ny,nx);
      const wobble = 1 + Math.sin(ang*3 + cx*0.7)*noise + Math.sin(ang*5 + cy*0.5)*noise*0.6 + Math.sin(ang*7)*noise*0.3;
      if(d < wobble) map[y][x] = tile;
    }
  }
}
function generateRiver(x0, y0, x1, y1, width, tile){
  const steps = Math.max(Math.abs(x1-x0), Math.abs(y1-y0)) * 2;
  for(let i=0;i<=steps;i++){
    const t = i/steps;
    const px = x0 + (x1-x0)*t;
    const py = y0 + (y1-y0)*t;
    const wobble = Math.sin(t*Math.PI*4)*1.8;
    const wx = px + Math.cos(Math.PI/2)*wobble;
    const wy = py + Math.sin(Math.PI/2)*wobble;
    for(let dy=-width; dy<=width; dy++){
      for(let dx=-width; dx<=width; dx++){
        if(dx*dx + dy*dy > width*width) continue;
        const tx = Math.round(wx+dx), ty = Math.round(wy+dy);
        if(tx<1||tx>=MAP_W-1||ty<1||ty>=MAP_H-1) continue;
        map[ty][tx] = tile;
      }
    }
  }
}

function genWorld(){
  resetSeed();
  map = [];
  for(let y=0;y<MAP_H;y++){
    map[y]=[];
    for(let x=0;x<MAP_W;x++) map[y][x] = T.GRASS;
  }
  generateBlobWater(7, 7, 5, 4, T.POND, 0.4);
  generateBlobWater(17, 5, 5, 3.5, T.ICE, 0.3);
  generateBlobWater(33, 7, 7, 5, T.LAKE, 0.35);
  generateBlobWater(6, 26, 5, 4, T.SWAMP, 0.6);
  generateBlobWater(38, 22, 7, 6, T.SEA, 0.25);
  generateBlobWater(38, 30, 4, 3, T.ABYSS, 0.4);
  generateBlobWater(20, 27, 5, 4, T.LAVA, 0.4);
  generateRiver(2, 17, 42, 17, 1, T.RIVER);

  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      if(!isWater(map[y][x])) continue;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const ny=y+dy, nx=x+dx;
        if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W) continue;
        if(map[ny][nx] !== T.GRASS) continue;
        if(sRand() < 0.6){
          if(map[y][x]===T.POND||map[y][x]===T.LAKE||map[y][x]===T.SEA) map[ny][nx] = T.SHALLOW;
        }
      }
    }
  }
  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      if(map[y][x] !== T.GRASS) continue;
      let nearSeaOrLake = false;
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
        const ny=y+dy, nx=x+dx;
        if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W) continue;
        if(map[ny][nx]===T.SEA || map[ny][nx]===T.LAKE){ nearSeaOrLake = true; break; }
      }
      if(nearSeaOrLake && sRand() < 0.7) map[y][x] = T.BEACH;
    }
  }
  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      if(map[y][x] !== T.GRASS) continue;
      let nearSwamp = false;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const ny=y+dy, nx=x+dx;
        if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W) continue;
        if(map[ny][nx]===T.SWAMP){ nearSwamp = true; break; }
      }
      if(nearSwamp && sRand() < 0.7) map[y][x] = T.SWAMP_GRASS;
    }
  }

  const houses = [
    {x:14, y:11, w:3, h:2}, {x:18, y:11, w:3, h:2}, {x:22, y:11, w:4, h:2},
    {x:27, y:11, w:3, h:2}, {x:14, y:21, w:3, h:2}, {x:18, y:21, w:3, h:2},
  ];
  houses.forEach(h => {
    for(let y=h.y; y<h.y+h.h; y++) for(let x=h.x; x<h.x+h.w; x++) map[y][x] = T.HOUSE;
    for(let x=h.x; x<h.x+h.w; x++) map[h.y][x] = T.HOUSE_ROOF;
    const doorX = h.x + Math.floor(h.w/2);
    map[h.y+h.h-1][doorX] = T.DOOR;
    if(h.w >= 3){ map[h.y+1][h.x] = T.WINDOW; map[h.y+1][h.x+h.w-1] = T.WINDOW; }
  });
  for(let y=13;y<=20;y++){ map[y][15] = T.PATH_STONE; map[y][19] = T.PATH_STONE; }
  for(let x=12;x<=30;x++){ map[14][x] = T.PATH; map[20][x] = T.PATH; }
  for(let x=10;x<=32;x++) map[17][x] = T.PATH_STONE;
  map[17][20] = T.WELL;
  map[16][18] = T.BENCH; map[16][22] = T.BENCH;
  map[15][13] = T.LAMP; map[15][29] = T.LAMP;
  map[19][13] = T.LAMP; map[19][29] = T.LAMP;
  map[14][11] = T.SIGN; map[14][25] = T.MAILBOX; map[22][24] = T.CAMPFIRE;
  for(let x=11;x<=33;x++){
    if(map[13][x] !== T.PATH && map[13][x] !== T.PATH_STONE && sRand() < 0.4) map[13][x] = T.FENCE;
    if(map[21][x] !== T.PATH && map[21][x] !== T.PATH_STONE && sRand() < 0.4) map[21][x] = T.FENCE;
  }
  for(let y=0;y<MAP_H;y++) if(isWalkable(map[y][20])) map[y][20] = T.PATH;
  for(let x=0;x<MAP_W;x++) if(isWalkable(map[17][x])) map[17][x] = T.PATH;

  const connectors = [
    [20,17,7,7],[20,17,17,5],[20,17,33,7],[20,17,6,26],
    [20,17,38,22],[20,17,20,27],[20,17,38,30],
  ];
  connectors.forEach(c => {
    const [x0,y0,x1,y1] = c;
    const steps = Math.max(Math.abs(x1-x0), Math.abs(y1-y0)) * 2;
    for(let i=0;i<=steps;i++){
      const t = i/steps;
      const px = Math.round(x0 + (x1-x0)*t);
      const py = Math.round(y0 + (y1-y0)*t);
      if(px<0||px>=MAP_W||py<0||py>=MAP_H) continue;
      const cur = map[py][px];
      if(cur === T.GRASS || cur === T.TALL_GRASS || cur === T.FLOWER || cur === T.BUSH) map[py][px] = T.PATH;
    }
  });
  for(let x=19;x<=21;x++){
    map[16][x] = T.BRIDGE; map[17][x] = T.BRIDGE; map[18][x] = T.BRIDGE;
  }

  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      if(map[y][x] !== T.GRASS) continue;
      let nearWater = false, nearPath = false, nearBuilding = false;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const ny=y+dy, nx=x+dx;
        if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W) continue;
        const t = map[ny][nx];
        if(isWater(t) || t===T.SHALLOW || t===T.BEACH) nearWater = true;
        if(t===T.PATH || t===T.PATH_STONE) nearPath = true;
        if(t===T.HOUSE || t===T.HOUSE_ROOF || t===T.DOOR || t===T.WINDOW) nearBuilding = true;
      }
      if(nearWater || nearPath || nearBuilding) continue;
      const r = sRand();
      if(r < 0.05) map[y][x] = T.TREE;
      else if(r < 0.10) map[y][x] = T.TALL_GRASS;
      else if(r < 0.15) map[y][x] = T.FLOWER;
      else if(r < 0.18) map[y][x] = T.BUSH;
      else if(r < 0.19) map[y][x] = T.ROCK;
      else if(r < 0.205) map[y][x] = T.STUMP;
    }
  }

  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      if(map[y][x] !== T.GRASS && map[y][x] !== T.BEACH && map[y][x] !== T.SWAMP_GRASS) continue;
      let nearSea=false,nearIce=false,nearSwamp=false,nearLava=false;
      let nearPond=false,nearLake=false,nearAbyss=false;
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
        const ny=y+dy, nx=x+dx;
        if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W) continue;
        const tt = map[ny][nx];
        if(tt===T.SEA) nearSea = true;
        else if(tt===T.ICE) nearIce = true;
        else if(tt===T.SWAMP) nearSwamp = true;
        else if(tt===T.LAVA) nearLava = true;
        else if(tt===T.POND) nearPond = true;
        else if(tt===T.LAKE) nearLake = true;
        else if(tt===T.ABYSS) nearAbyss = true;
      }
      const r = sRand();
      if(nearSea && r < 0.22){ map[y][x] = T.PALM; continue; }
      if(nearIce && r < 0.20){ map[y][x] = sRand()<0.7 ? T.PINE : T.SNOW_PILE; continue; }
      if(nearSwamp && r < 0.22){ map[y][x] = sRand()<0.6 ? T.DEAD_TREE : T.MUSHROOM; continue; }
      if(nearLava && r < 0.25){ map[y][x] = T.LAVA_ROCK; continue; }
      if(nearPond && r < 0.15){ map[y][x] = sRand()<0.5 ? T.REED : T.LILY; continue; }
      if(nearLake && r < 0.12){ map[y][x] = sRand()<0.5 ? T.REED : T.LILY; continue; }
      if(nearAbyss && r < 0.15){ map[y][x] = T.CRYSTAL; continue; }
    }
  }

  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      if(map[y][x] !== T.GRASS) continue;
      let nearWater = false;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const ny=y+dy, nx=x+dx;
        if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W) continue;
        if(isWater(map[ny][nx]) || map[ny][nx]===T.BEACH || map[ny][nx]===T.SHALLOW) nearWater = true;
      }
      if(nearWater && sRand() < 0.1) map[y][x] = T.REED;
    }
  }

  for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
    const sy = 11+dy, sx = 7+dx;
    if(sy>=0 && sy<MAP_H && sx>=0 && sx<MAP_W) map[sy][sx] = T.PATH;
  }
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) map[17+dy][20+dx] = T.PATH_STONE;
}

function findSafeSpawn(){
  const candidates = [[7,11],[7,12],[8,11],[6,11],[7,10],[5,12],[9,10],[7,13],[8,13],[6,13]];
  for(const [x,y] of candidates){
    if(x>=0 && x<MAP_W && y>=0 && y<MAP_H && isWalkable(map[y][x])){
      return {x: x*TILE+TILE/2, y: y*TILE+TILE/2};
    }
  }
  for(const [x,y] of [[20,17],[20,16],[20,18],[19,17],[21,17]]){
    if(x>=0 && x<MAP_W && y>=0 && y<MAP_H && isWalkable(map[y][x])){
      return {x: x*TILE+TILE/2, y: y*TILE+TILE/2};
    }
  }
  for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){
    if(isWalkable(map[y][x])) return {x: x*TILE+TILE/2, y: y*TILE+TILE/2};
  }
  return {x: W/2, y: H/2};
}

function findNearestWalkable(wx, wy){
  const tx = Math.floor(wx/TILE), ty = Math.floor(wy/TILE);
  for(let r=1;r<15;r++){
    for(let dy=-r;dy<=r;dy++){
      for(let dx=-r;dx<=r;dx++){
        if(Math.max(Math.abs(dx),Math.abs(dy)) !== r) continue;
        const nx=tx+dx, ny=ty+dy;
        if(nx>=0 && nx<MAP_W && ny>=0 && ny<MAP_H && isWalkable(map[ny][nx])){
          return {x: nx*TILE+TILE/2, y: ny*TILE+TILE/2};
        }
      }
    }
  }
  return null;
}

function load(){
  if(!storageOk) return;

  let raw = null, sourceKey = null;
  try { 
    raw = localStorage.getItem(KEY); 
    if(raw) sourceKey = KEY;
  } catch(e){}
  if(!raw){
    for(const k of OLD_KEYS){
      try {
        const old = localStorage.getItem(k);
        if(old){ raw = old; sourceKey = k; break; }
      } catch(e){}
    }
  }
  if(!raw) return;

  let d;
  try { d = JSON.parse(raw); } catch(e){ console.error('Parse error:', e); return; }
  if(!d || typeof d !== 'object') return;

  try {
    P.level = Math.max(1, Math.min(999, Number(d.level) || 1));
    P.xp = Math.max(0, Number(d.xp) || 0);
    P.gold = Math.max(0, Number(d.gold) || 0);
    P.rod = Math.max(0, Math.min(RODS.length-1, Number(d.rod) || 0));
    P.zone = Math.max(0, Math.min(ZONES.length-1, Number(d.zone) || 0));
    P.inv = (d.inv && typeof d.inv === 'object' && !Array.isArray(d.inv)) ? d.inv : {};
    P.journal = (d.journal && typeof d.journal === 'object' && !Array.isArray(d.journal)) ? d.journal : {};
    P.achievements = (d.achievements && typeof d.achievements === 'object' && !Array.isArray(d.achievements)) ? d.achievements : {};
    P.visited = (d.visited && typeof d.visited === 'object' && !Array.isArray(d.visited)) ? d.visited : {};
    P.bait = (d.bait && typeof d.bait === 'object') ? {
      worm:Number(d.bait.worm)||0, shiny:Number(d.bait.shiny)||0,
      magic:Number(d.bait.magic)||0, legend:Number(d.bait.legend)||0
    } : {worm:0,shiny:0,magic:0,legend:0};
    P.activeBait = BAITS.find(b => b.id === d.activeBait) ? d.activeBait : 'worm';
    P.catches = Math.max(0, Number(d.catches) || 0);
    P.foundRare = Math.max(0, Number(d.foundRare) || 0);
    P.foundLegend = Math.max(0, Number(d.foundLegend) || 0);
    P.foundMythic = Math.max(0, Number(d.foundMythic) || 0);
    P.foundDivine = Math.max(0, Number(d.foundDivine) || 0);
    P.day = Math.max(1, Number(d.day) || 1);
    P.dayTime = Math.max(0, Math.min(1, Number(d.dayTime) || 0.3));
    P.weather = WEATHERS[d.weather] ? d.weather : 'clear';
    P.view = (d.view === 'top' || d.view === 'side') ? d.view : 'top';
    P.mode = (d.mode === 'world' || d.mode === 'classic') ? d.mode : 'world';
    P.boat = (d.boat && typeof d.boat === 'object') ? {owned: !!d.boat.owned} : {owned:false};

    if(d.custom && typeof d.custom === 'object'){
      P.custom = {
        name: String(d.custom.name || 'Рыбак').slice(0, 14) || 'Рыбак',
        skin: Math.max(0, Math.min(SKINS.length-1, Number(d.custom.skin) || 0)),
        shirt: Math.max(0, Math.min(SHIRTS.length-1, Number(d.custom.shirt) || 0)),
        hat: Math.max(0, Math.min(HATS.length-1, Number(d.custom.hat) || 0)),
        sweater: Math.max(0, Math.min(SWEATERS.length-1, Number(d.custom.sweater) || 0)),
      };
    }

    let px = Number(d.px), py = Number(d.py);
    if(isFinite(px) && isFinite(py)){
      const tx = Math.floor(px/TILE), ty = Math.floor(py/TILE);
      if(tx>=0 && tx<MAP_W && ty>=0 && ty<MAP_H){
        const tile = map[ty][tx];
        const waterOk = isWater(tile) && P.boat.owned && !isLethalWater(tile);
        if(isWalkable(tile) || waterOk){
          player.x = px; player.y = py;
        } else {
          // Позиция стала невалидной — ищем ближайшую проходимую
          const safe = findNearestWalkable(px, py);
          if(safe){ player.x = safe.x; player.y = safe.y; }
        }
      }
    }

    // Удаляем старые ключи после успешной миграции
    if(sourceKey && sourceKey !== KEY){
      try { 
        save(); 
        localStorage.removeItem(sourceKey);
        console.log('Migrated from', sourceKey);
      } catch(e){}
    }
  } catch(e){
    console.error('Load error:', e);
  }
}

function pxEllipse(cx,cy,rx,ry,color){
  g.fillStyle = color;
  for(let yy=-ry;yy<=ry;yy++){
    const k = yy/ry;
    const w = Math.floor(rx*Math.sqrt(Math.max(0,1-k*k)));
    g.fillRect(Math.round(cx-w), Math.round(cy+yy), w*2+1, 1);
  }
}
function pixelLine(x0,y0,x1,y1,color,sag){
  g.fillStyle = color;
  const dx = x1-x0, dy = y1-y0;
  const steps = Math.max(2, Math.ceil(Math.hypot(dx,dy)));
  for(let i=0;i<=steps;i++){
    const p = i/steps;
    const s = Math.sin(p*Math.PI)*(sag||0);
    g.fillRect(Math.round(x0+dx*p), Math.round(y0+dy*p+s), 1, 1);
  }
}
function drawFishSprite(cx,cy,s,col,flip){
  g.save();
  g.translate(Math.round(cx),Math.round(cy));
  g.scale(flip?-s:s, s);
  g.fillStyle = col.fin;
  for(let xx=0;xx<4;xx++){ const h = 2+xx; g.fillRect(5+xx,-Math.floor(h/2),1,h); }
  pxEllipse(0,0,6,3,col.body);
  pxEllipse(-1,1,4,2,col.belly);
  g.fillStyle = col.fin;
  g.fillRect(-2,-4,4,1); g.fillRect(-1,-5,3,1);
  g.fillRect(-1,4,3,1); g.fillRect(1,5,2,1);
  g.fillStyle = '#0a0a12'; g.fillRect(-4,-1,1,1);
  g.fillStyle = '#ffffff'; g.fillRect(-4,-2,1,1);
  g.restore();
}

function collides(wx,wy){
  const hw=5,hh=4;
  const corners=[[wx-hw,wy-hh],[wx+hw,wy-hh],[wx-hw,wy+hh],[wx+hw,wy+hh]];
  for(const [cx,cy] of corners){
    const tx=Math.floor(cx/TILE), ty=Math.floor(cy/TILE);
    if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H) return true;
    const tile = map[ty][tx];
    if(isLethalWater(tile)) return true;
    if(isWater(tile)){
      if(!P.boat.owned) return true;
      continue;
    }
    if(!isWalkable(tile)) return true;
  }
  return false;
}

        const tx=px+dx, ty=py+dy;
        if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H) continue;
        if(isWater(map[ty][tx])) return {x:tx,y:ty,zone:waterToZone(map[ty][tx]),dx,dy,dist:r};

function drawTileTop(tile,sx,sy){
  const col = TILE_COLORS[tile];
  if(!col) return;
  g.fillStyle = col.a; g.fillRect(sx, sy, TILE, TILE);
  const t = S.time;
  if(tile === T.GRASS || tile === T.TALL_GRASS || tile === T.FLOWER){
    if(tile === T.TALL_GRASS){
      g.fillStyle = col.b;
      for(let i=0;i<4;i++){ g.fillRect(sx + 3 + i*3, sy + 10 + Math.sin(t*1.5 + i)*1, 1, 4); }
    } else if(tile === T.FLOWER){
      g.fillStyle = col.b; g.fillRect(sx+4, sy+11, 1, 2); g.fillRect(sx+10, sy+8, 1, 2);
      g.fillStyle = '#ff6b9d'; g.fillRect(sx+10, sy+10, 2, 2);
      g.fillStyle = '#ffe066'; g.fillRect(sx+3, sy+9, 2, 2);
      g.fillStyle = '#ffffff'; g.fillRect(sx+7, sy+12, 1, 1);
    } else {
      g.fillStyle = col.b;
      for(let i=0;i<3;i++){
        const fx = ((sx*7+sy*13+i*31) % 12) + sx + 2;
        const fy = ((sx*11+sy*17+i*23) % 12) + sy + 2;
        g.fillRect(fx, fy, 1, 2);
      }
    }
  } else if(tile === T.PATH || tile === T.PATH_STONE){
    g.fillStyle = col.b;
    if(tile === T.PATH_STONE){

function drawTileSide(tile,sx,sy){
  const col = TILE_COLORS[tile];
  if(!col) return;
  if(isWater(tile)){
    g.fillStyle = col.a; g.fillRect(sx, sy, TILE, TILE);
    const wave = Math.sin(S.time*2 + sx*0.15)*2;
    g.fillStyle = col.b;
    g.fillRect(sx+2+wave, sy+4, 4, 1); g.fillRect(sx+8-wave, sy+10, 4, 1);
    return;
  }
  if(tile === T.TREE || tile === T.PALM || tile === T.PINE || tile === T.DEAD_TREE){
    g.fillStyle = '#4a3019'; g.fillRect(sx+6, sy+8, 4, 8);
    const c = TILE_COLORS[tile];
    pxEllipse(sx+8, sy+4, 7, 5, c.b || c.a);
    pxEllipse(sx+8, sy+3, 5, 4, c.a);
    return;
  }
  if(tile === T.HOUSE || tile === T.HOUSE_ROOF){
    g.fillStyle = '#c8b090'; g.fillRect(sx, sy+4, TILE, TILE-4);
    g.fillStyle = '#a84a3a';
    for(let i=0;i<8;i++) g.fillRect(sx+i, sy+i, TILE-i*2, 1);
    g.fillStyle = '#883a2a'; g.fillRect(sx+2, sy+10, TILE-4, 1);
    return;
  }
  if(tile === T.DOOR){
    g.fillStyle = '#c8b090'; g.fillRect(sx, sy, TILE, TILE);
    g.fillStyle = '#6a3a1a'; g.fillRect(sx+3, sy+2, 10, 14);
    return;
  }
  if(tile === T.WINDOW){
    g.fillStyle = '#c8b090'; g.fillRect(sx, sy, TILE, TILE);
    g.fillStyle = '#a8d8f0'; g.fillRect(sx+3, sy+3, 10, 8);
    return;
  }
  g.fillStyle = col.a; g.fillRect(sx, sy, TILE, TILE);
  if(tile === T.GRASS || tile === T.TALL_GRASS || tile === T.FLOWER){
    g.fillStyle = col.b;
    for(let i=0;i<3;i++){
      const fx = ((sx*7+sy*13+i*31) % 12) + sx + 2;
      const fy = ((sx*11+sy*17+i*23) % 12) + sy + 2;
      g.fillRect(fx, fy, 1, 2);
    }
  }
}

function drawWorld(){
  const cx0 = Math.max(0, Math.floor(cam.x/TILE));
  const cy0 = Math.max(0, Math.floor(cam.y/TILE));
  const cx1 = Math.min(MAP_W-1, Math.ceil((cam.x+W)/TILE));
  const cy1 = Math.min(MAP_H-1, Math.ceil((cam.y+H)/TILE));
  for(let ty=cy0; ty<=cy1; ty++){
    for(let tx=cx0; tx<=cx1; tx++){
      const sx = tx*TILE - Math.round(cam.x);
      const sy = ty*TILE - Math.round(cam.y);
      if(P.view === 'top') drawTileTop(map[ty][tx], sx, sy);
      else drawTileSide(map[ty][tx], sx, sy);
    }
  }
}

function drawWaterHint(){
  if(S.phase !== 'explore' || P.mode !== 'world') return;
  const nw = findNearbyWater();
  if(!nw) return;
  const sx = nw.x*TILE - cam.x;
  const sy = nw.y*TILE - cam.y;
  const pulse = Math.sin(S.time*3)*0.3 + 0.7;
  g.globalAlpha = pulse * 0.6;
  g.strokeStyle = '#5ddc6a'; g.lineWidth = 2;
  g.strokeRect(sx-1, sy-1, TILE+2, TILE+2);
  g.globalAlpha = 1;
}

function drawBoat(wx,wy){
  if(!P.boat.owned || !isPlayerOnWater()) return;
  const sx = Math.round(wx - cam.x), sy = Math.round(wy - cam.y);
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(sx-9, sy+7, 18, 3);
  g.fillStyle = '#6a4a2a'; g.fillRect(sx-9, sy-2, 18, 6);
  g.fillStyle = '#8a6a3a'; g.fillRect(sx-8, sy-3, 16, 2);
  g.fillStyle = '#5a3a1a'; g.fillRect(sx-9, sy+3, 18, 2);
  g.fillStyle = '#4a2a1a';
  g.fillRect(sx-10, sy-1, 2, 4);
  g.fillRect(sx+8, sy-1, 2, 4);
  g.fillStyle = '#c8a870'; g.fillRect(sx+10, sy-4, 6, 1);
  g.fillStyle = '#8a6a3a'; g.fillRect(sx+14, sy-4, 2, 1);
}

function drawPlayerTop(wx,wy){
  const sx = Math.round(wx - cam.x), sy = Math.round(wy - cam.y);
  const cu = P.custom||{skin:1,shirt:0,hat:1,sweater:0};
  const sk = SKINS[cu.skin]||SKINS[1];
  const sh = SHIRTS[cu.shirt]||SHIRTS[0];
  const hat = HATS[cu.hat]||HATS[0];
  const sw = SWEATERS[cu.sweater||0] || SWEATERS[0];
  if(!isPlayerOnWater()){
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(sx-4, sy+6, 9, 3);
  }
  const walkOff = player.moving ? Math.sin(player.anim)*1.5 : 0;
  g.fillStyle = '#2b3550';
  g.fillRect(sx-2, sy+4+walkOff, 3, 4); g.fillRect(sx+1, sy+4-walkOff, 3, 4);
  const bodyColor = sw.c || sh.c;
  const bodyShade = sw.s || sh.s;
  g.fillStyle = bodyColor; g.fillRect(sx-4, sy-1, 9, 6);
  g.fillStyle = bodyShade; g.fillRect(sx-4, sy-1, 9, 1);
  if(sw.stripe){ g.fillStyle = bodyShade; g.fillRect(sx-4, sy+1, 9, 1); g.fillRect(sx-4, sy+3, 9, 1); }
  else if(sw.pattern === 'nordic'){ g.fillStyle = bodyShade; g.fillRect(sx-3, sy, 1, 1); g.fillRect(sx+2, sy, 1, 1); g.fillRect(sx-1, sy+2, 3, 1); }
  else if(sw.pattern === 'tree'){ g.fillStyle = bodyShade; for(let i=0;i<3;i++) g.fillRect(sx-3+i*3, sy+1, 1, 1); for(let i=0;i<2;i++) g.fillRect(sx-2+i*3, sy+3, 1, 1); }
  else if(sw.pattern === 'hearts'){ g.fillStyle = bodyShade; g.fillRect(sx-2, sy+1, 1, 1); g.fillRect(sx+1, sy+1, 1, 1); g.fillRect(sx-1, sy+2, 3, 1); }
  else if(sw.pattern === 'snow'){ g.fillStyle = '#ffffff'; g.fillRect(sx-1, sy+1, 1, 1); g.fillRect(sx+2, sy+3, 1, 1); }
  else if(sw.pattern === 'fire'){ g.fillStyle = bodyShade; g.fillRect(sx-3, sy+2, 2, 1); g.fillRect(sx+2, sy+1, 2, 1); g.fillRect(sx-1, sy+3, 2, 1); }
  else if(sw.pattern === 'night'){ g.fillStyle = '#ffffff'; g.fillRect(sx-2, sy+1, 1, 1); g.fillRect(sx+3, sy+2, 1, 1); g.fillRect(sx, sy+3, 1, 1); }
  g.fillStyle = sk.c;
  if(player.dir === 'left') g.fillRect(sx-6, sy+1, 2, 3);
  else if(player.dir === 'right') g.fillRect(sx+5, sy+1, 2, 3);
  else { g.fillRect(sx-5, sy+1, 2, 2); g.fillRect(sx+5, sy+1, 2, 2); }
  g.fillStyle = sk.c; g.fillRect(sx-3, sy-6, 7, 5);
  g.fillStyle = sk.s; g.fillRect(sx-3, sy-2, 7, 1);
  g.fillStyle = '#1a1f30';
  if(player.dir === 'down'){ g.fillRect(sx-2, sy-4, 1, 1); g.fillRect(sx+2, sy-4, 1, 1); }
  else if(player.dir === 'left') g.fillRect(sx-2, sy-4, 1, 1);
  else if(player.dir === 'right') g.fillRect(sx+2, sy-4, 1, 1);
  if(hat.id === 'cap'){ g.fillStyle = hat.c; g.fillRect(sx-4, sy-8, 9, 2); g.fillStyle = hat.s; g.fillRect(sx-4, sy-7, 9, 1); }
  else if(hat.id === 'beanie'){ g.fillStyle = hat.c; g.fillRect(sx-3, sy-9, 7, 3); g.fillStyle = hat.s; g.fillRect(sx-3, sy-8, 7, 1); g.fillStyle = '#ffffff'; g.fillRect(sx-1, sy-10, 2, 1); }
  else if(hat.id === 'straw'){ g.fillStyle = hat.c; g.fillRect(sx-6, sy-8, 13, 2); g.fillRect(sx-2, sy-10, 5, 2); g.fillStyle = hat.s; g.fillRect(sx-6, sy-7, 13, 1); }
  else if(hat.id === 'crown'){ g.fillStyle = hat.c; g.fillRect(sx-3, sy-9, 7, 3); g.fillRect(sx-3, sy-11, 1, 2); g.fillRect(sx, sy-11, 1, 2); g.fillRect(sx+3, sy-11, 1, 2); g.fillStyle = '#ff0066'; g.fillRect(sx-1, sy-8, 1, 1); }
  else if(hat.id === 'phones'){ g.fillStyle = hat.c; g.fillRect(sx-5, sy-6, 1, 3); g.fillRect(sx+5, sy-6, 1, 3); g.fillRect(sx-4, sy-7, 9, 1); g.fillStyle = hat.s; g.fillRect(sx-5, sy-5, 1, 1); g.fillRect(sx+5, sy-5, 1, 1); }
}

function drawPlayerSide(wx,wy){
  const sx = Math.round(wx - cam.x), sy = Math.round(wy - cam.y);
  const cu = P.custom||{skin:1,shirt:0,hat:1,sweater:0};
  const sk = SKINS[cu.skin]||SKINS[1];
  const sh = SHIRTS[cu.shirt]||SHIRTS[0];
  const hat = HATS[cu.hat]||HATS[0];
  const sw = SWEATERS[cu.sweater||0] || SWEATERS[0];
  const bodyColor = sw.c || sh.c;
  const bodyShade = sw.s || sh.s;
  if(!isPlayerOnWater()){
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(sx-5, sy+8, 11, 3);
  }
  const walkOff = player.moving ? Math.sin(player.anim)*2 : 0;
  const flip = player.dir === 'left';
  g.save(); g.translate(sx, sy); if(flip) g.scale(-1,1);
  g.fillStyle = '#2b3550'; g.fillRect(-3, 5+walkOff, 3, 5); g.fillRect(1, 5-walkOff, 3, 5);

function drawFishingLineWorld(){

  const tip = P.view === 'top'
    ? (()=>{ const off = {up:{x:0,y:-14},down:{x:8,y:8},left:{x:-14,y:-4},right:{x:14,y:-4}}; const o = off[player.dir]||off.down; return {x:player.x+o.x, y:player.y+o.y}; })()
    : {x: player.x + (player.dir==='left'?-12:12), y: player.y - 12};
  const bx = S.bobberWorld.x - cam.x, by = S.bobberWorld.y - cam.y;
  const tx = tip.x - cam.x, ty = tip.y - cam.y;
  const sag = S.phase==='hooked' ? 0 : (S.phase==='bite' ? 3 : 6);
  g.fillStyle = '#c8d8e8';
  const dx = bx-tx, dy = by-ty;
  const steps = Math.max(2, Math.ceil(Math.hypot(dx,dy)));
  for(let i=0;i<=steps;i++){
    const p = i/steps; const s = Math.sin(p*Math.PI)*sag;
    g.fillRect(Math.round(tx+dx*p), Math.round(ty+dy*p+s), 1, 1);
  }
  const bwx = Math.round(bx), bwy = Math.round(by);
  g.fillStyle = '#e04040'; g.fillRect(bwx-2, bwy-2, 4, 2);
  g.fillStyle = '#ffffff'; g.fillRect(bwx-2, bwy, 4, 2);

  }
}

      const fw = Math.round(bw*S.power);
      const grad = S.power>0.75?'#5ddc6a':S.power>0.4?'#ffc94a':'#e06040';
      g.fillStyle = grad; g.fillRect(bx, by, fw, bh);
      g.fillStyle = '#ffffff'; g.fillRect(bx + bw*0.8, by-4, 1, bh+8);
      g.fillStyle = '#e8eef8'; g.font = 'bold 7px monospace'; g.textAlign='center';
      g.fillText('СИЛА БРОСКА', W/2, by-6);
    }
    drawWorldOverlay();
  }
  g.setTransform(1,0,0,1,0,0);
}

function startFishing(){
  if(P.mode === 'classic'){
    if(ZONES[P.zone].lvl > P.level){
      showToast(`🔒 Нужен уровень ${ZONES[P.zone].lvl}`, 'danger');
      return false;
    }
    S.currentZone = P.zone;
    P.visited[P.zone] = true;
    S.classicBobberX = 150;
    S.classicBobberY = 120;
    S.targetWater = {zone: P.zone};
    S.phase = 'charging';
    S.power = 0; S.powerDir = 1;
    return true;
  }
  const nw = findNearbyWater();
  if(!nw) return false;
  const z = ZONES[nw.zone];
  if(z.lvl > P.level){ showToast(`🔒 Нужен уровень ${z.lvl}`, 'danger'); return false; }
  if(Math.abs(nw.dx) > Math.abs(nw.dy)) player.dir = nw.dx < 0 ? 'left' : 'right';
  else player.dir = nw.dy < 0 ? 'up' : 'down';
  S.targetWater = nw;
  S.currentZone = nw.zone;
  P.zone = nw.zone;
  P.visited[nw.zone] = true;
  S.bobberWorld = {x: nw.x*TILE + TILE/2, y: nw.y*TILE + TILE/2};
  S.phase = 'charging'; S.power = 0; S.powerDir = 1;
  return true;
}
function doCast(){
  if(P.activeBait !== 'worm'){
    P.bait[P.activeBait]--;
    if(P.bait[P.activeBait] <= 0) P.activeBait = 'worm';
  }
  S.phase = 'casting'; S.t = 0; S.castT = 0;
  A.cast(); updateUI(); save();
}
function startWaiting(){
  S.phase = 'waiting'; S.t = 0;
  const wmod = P.weather==='storm'?0.75:P.weather==='rain'?0.9:1.0;
  S.waitTime = rnd(0.6, 1.8) * rod().speed * wmod;
  S.biteWin = 2.5;
  S.biteT = 0;
}
function triggerBite(){
  S.phase = 'bite'; S.t = 0; S.biteT = 0;
  A.bite(); vibrate([40, 30, 40, 30, 40]);
  S.shake = 3;
  updateBtn();
}
function rollFish(){
  const z = ZONES[S.currentZone] || ZONES[0];
  const luck = rod().luck + (P.level-1)*0.015 + S.power*0.4 + (isPlayerOnWater() ? 0.1 : 0);
  const baitMult = activeBait().mult;
  const weatherMult = P.weather==='storm'?1.4:P.weather==='rain'?1.2:1.0;
  const items = z.pool.map(id => {
    const f = FISH[id];
    let w = f.w;
    if(f.r>0) w *= Math.pow(baitMult, f.r);
    w *= Math.pow(1+luck, f.r);
    if(f.r>=3) w *= weatherMult;
    if(f.time.includes('day') && isNight()) w *= 0.15;
    if(f.time.includes('night') && !isNight()) w *= 0.15;
    if(f.time.includes('dawn') && Math.abs(P.dayTime-0.25)>0.08) w *= 0.3;
    if(f.time.includes('dusk') && Math.abs(P.dayTime-0.75)>0.08) w *= 0.3;
    if(f.weather && !f.weather.includes('any') && !f.weather.includes(P.weather)) w *= 0.2;
    return {id,f,w};
  });
  let total = items.reduce((s,i)=>s+i.w, 0);
  let r = Math.random()*total;
  for(const it of items){ r -= it.w; if(r<=0) return it.f; }
  return items[0].f;
}
function hookFish(){
  S.curFish = rollFish();
  S.success = false;
  S.tension = 20; S.progress = 0; S.holding = false;
  S.nextDart = rnd(1.5, 2.5); S.dartFlash = 0;
  S.phase = 'hooked';
  A.cast();
  updateBtn();
}
function catchFish(){
  S.success = true;
  const f = S.curFish;
  P.catches++;
  P.inv[f.n] = (P.inv[f.n]||0)+1;
  const isNew = !P.journal[f.n];
  P.journal[f.n] = (P.journal[f.n]||0)+1;
  if(f.r===2) P.foundRare++;
  if(f.r===4) P.foundLegend++;
  if(f.r===5) P.foundMythic++;
  if(f.r===6) P.foundDivine++;
  addXP(f.x);
  const rar = RARITY[f.r];
  addLog(`✅ ${f.n} (+${f.x} xp)`, rar.c);
  if(isNew) showToast(`🆕 ${f.n}!`, 'gold');
  const wx = P.mode === 'world' ? S.bobberWorld.x : 150;
  const wy = P.mode === 'world' ? S.bobberWorld.y : 120;
  spawnSplash(wx, wy, 22);
  if(P.mode === 'world') addFloatText(wx, wy-20, `+${f.x} XP`, '#5ddc6a');
  A.catchIt(); vibrate([50,30,100]);
  S.shake = 6;
  checkAchievements();
  save();
  S.phase = 'result'; S.t = 0;
  updateUI();
}
function snapLine(){
  S.success = false;
  A.snap(); vibrate([100,50,100,50,150]);
  addLog('💥 Леска порвалась!', '#e05050');
  showToast('💥 Порвалась!', 'danger');
  S.phase = 'result'; S.t = 0;
  updateUI();
}
function spawnSplash(wx,wy,count){
  count = count||14;
  for(let i=0;i<count;i++){
    S.particles.push({
      x: wx, y: wy, vx: rnd(-70,70), vy: rnd(-90,-25),
      life: rnd(0.5,1.0), t: 0,
      c: Math.random()<0.55?'#a8e4ff':'#ffffff',
      size: Math.random()<0.3?2:1,
    });
  }
}
function addXP(amount){
  P.xp += amount;
  let need = xpNeed(P.level);
  let leveled = false;
  while(P.xp >= need){ P.xp -= need; P.level++; leveled = true; need = xpNeed(P.level); }
  if(leveled){
    A.levelup(); vibrate([100,50,100,50,200]);
    addLog(`⭐ УРОВЕНЬ ${P.level}!`, '#ffc94a');
    showToast(`⭐ Уровень ${P.level}!`, 'gold');
    ZONES.forEach(z => { if(z.lvl === P.level) addLog(`🗺️ Открыта: ${z.n}!`, '#4aa8ff'); });
  }
}
function checkAchievements(){
  ACHIEVEMENTS.forEach(a => {
    if(!P.achievements[a.id] && a.check(P)){
      P.achievements[a.id] = Date.now();
      showToast(`🏆 ${a.n}!`, 'gold');
      addLog(`🏆 ${a.n}`, '#ffc94a');
      A.coin();
    }
  });
}

let stepSoundT = 0;
function update(dt){
  S.time += dt;
  S.t += dt;
  P.dayTime += dt/180;
  if(P.dayTime >= 1){
    P.dayTime -= 1; P.day++;
    if(Math.random() < 0.4){
      const roll = Math.random();
      let nw = 'clear';
      if(roll<0.15) nw='storm';
      else if(roll<0.4) nw='rain';
      else if(roll<0.65) nw='cloudy';
      if(nw !== P.weather){ P.weather = nw; addLog(`${WEATHERS[nw].icon} ${WEATHERS[nw].name}`, '#7a88ac'); }
    }
  }
  if(P.weather==='storm' && Math.random()<0.008){
    S.lightning = 0.9; setTimeout(()=>{ S.lightning = 0; },120);
  }
  if(S.lightning > 0) S.lightning -= dt*8;
  if(S.shake > 0) S.shake = Math.max(0, S.shake - dt*22);
  if(S.dartFlash > 0) S.dartFlash = Math.max(0, S.dartFlash - dt*3);
  for(let i=S.particles.length-1;i>=0;i--){
    const p = S.particles[i];
    p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 180*dt;
    if(p.t >= p.life) S.particles.splice(i,1);
  }
  if(S.phase === 'explore' && P.mode === 'world'){
    let dx=0, dy=0;
    if(dirs.left) dx -= 1;
    if(dirs.right) dx += 1;
    if(dirs.up) dy -= 1;
    if(dirs.down) dy += 1;
    if(dx !== 0 || dy !== 0){
      const len = Math.hypot(dx,dy); dx /= len; dy /= len;
      const onWater = isPlayerOnWater();
      const spd = player.speed * dt * (onWater ? 0.65 : 1);
      const nx = player.x + dx*spd;
      const ny = player.y + dy*spd;
      if(!collides(nx, player.y)) player.x = nx;
      if(!collides(player.x, ny)) player.y = ny;
      if(Math.abs(dx) > Math.abs(dy)) player.dir = dx<0?'left':'right';
      else player.dir = dy<0?'up':'down';
      player.moving = true;
      player.anim += dt*10;
      stepSoundT += dt;
      if(stepSoundT > 0.3){ A.step(); stepSoundT = 0; }
    } else player.moving = false;
  } else {
    player.moving = false;
  }
  switch(S.phase){
    case 'charging':
      S.power += S.powerDir * dt / 1.15;
      if(S.power >= 1){ S.power = 1; S.powerDir = -1; }
      if(S.power <= 0){ S.power = 0; S.powerDir = 1; }
      break;
    case 'casting':
      S.castT += dt / 0.25;
      if(S.castT >= 1){
        startWaiting();
        if(P.mode === 'world') spawnSplash(S.bobberWorld.x, S.bobberWorld.y, 8);
        A.splash();
        updateBtn();
      }
      break;
    case 'waiting':
      if(S.t >= S.waitTime) triggerBite();
      break;
    case 'bite':
      S.biteT += dt;
      if(S.biteT >= S.biteWin){
        S.biteT = 0;
        S.biteWin = 2.0;
        S.waitTime = rnd(0.4, 1.0);
        A.fail();
        S.phase = 'waiting'; S.t = 0;
        updateBtn();
      }
      break;
    case 'hooked': {
      const f = S.curFish;
      const strength = f.str * rod().str;
      if(S.holding){
        S.progress += 25*dt;
        S.tension += (2 + S.progress*0.05)*strength*dt;
        if(Math.random() < 0.15) A.reel();
      } else {
        S.progress -= 3*dt;
        S.tension -= 30*dt;
      }
      S.tension = clamp(S.tension, 0, 100);
      S.progress = clamp(S.progress, 0, 100);
      if(S.t > S.nextDart){
        const dartChance = 1 - (S.progress/100)*0.5;
        if(Math.random() < dartChance * 0.7){
          S.tension += 15 + Math.random()*20*strength;
          S.dartFlash = 0.8;
          A.dart(); vibrate(40);
        }
        S.nextDart = S.t + rnd(1.2, 2.4);
      }
      if(S.progress >= 100) catchFish();
      else if(S.tension >= 100) snapLine();
      break;
    }
    case 'result':
      if(S.t >= 2.4){
        S.phase = 'explore'; S.curFish = null; S.holding = false; S.targetWater = null;
        updateBtn();
      }
      break;
  }
  if(P.mode === 'world') updateCamera();
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

  sorted.forEach(name=>{
    const f = FISH[name];
    const cnt = P.journal[name]||0;
    if(cnt===0) return;
    const div = document.createElement('div');
    div.className = 'item rar'+f.r;
    div.style.cursor = 'default';
    div.innerHTML = `<span>${f.n}<span class="sub">${RARITY[f.r].n} · ${f.v}🪙</span></span><span class="price">×${cnt}</span>`;
    panel.appendChild(div);
  });
}
function renderAchievements(){
  const earned = Object.values(P.achievements).filter(Boolean).length;
  const h = document.createElement('div');
  h.style.cssText = 'color:#7a88ac;font-size:9px;padding:3px 6px;';
  h.textContent = `НАГРАДЫ ${earned} / ${ACHIEVEMENTS.length}`;
  panel.appendChild(h);
  ACHIEVEMENTS.forEach(a=>{
    const done = !!P.achievements[a.id];
    const div = document.createElement('div');
    div.className = 'item' + (done?' owned':'');
    div.style.cursor = 'default';
    div.innerHTML = `<span>${done?'🏆':'🔒'} ${a.n}<span class="sub">${a.desc}</span></span><span class="price">${done?'✓':'—'}</span>`;
    panel.appendChild(div);
  });
}
function renderHero(){
  if(!P.custom) P.custom = {name:'Рыбак',skin:1,shirt:0,hat:1,sweater:0};
  const l0 = document.createElement('div'); l0.className = 'custom-label'; l0.textContent = 'Имя'; panel.appendChild(l0);
  const inp = document.createElement('input');
  inp.id = 'nameInput'; inp.maxLength = 14;
  inp.value = P.custom.name || 'Рыбак';
  let nameSaveT = null;
  inp.oninput = ()=>{ 
    P.custom.name = (inp.value||'Рыбак').slice(0,14); 
    document.getElementById('nameTag').textContent = P.custom.name; 
    clearTimeout(nameSaveT);
    nameSaveT = setTimeout(()=>save(), 400);
  };
  inp.onblur = ()=>{ save(); };
  panel.appendChild(inp);
  const l1 = document.createElement('div'); l1.className = 'custom-label'; l1.textContent = 'Кожа'; panel.appendChild(l1);
  const r1 = document.createElement('div'); r1.className = 'custom-row';
  SKINS.forEach((s,i)=>{
    const o = document.createElement('div');
    o.className = 'custom-opt' + (P.custom.skin===i?' active':'');
    o.innerHTML = `<span class="swatch" style="background:${s.c}"></span>${s.n}`;
    o.onclick = ()=>{ P.custom.skin=i; save(); renderPanel(); };
    r1.appendChild(o);
  });
  panel.appendChild(r1);
  const l2 = document.createElement('div'); l2.className = 'custom-label'; l2.textContent = 'Рубашка'; panel.appendChild(l2);
  const r2 = document.createElement('div'); r2.className = 'custom-row';
  SHIRTS.forEach((s,i)=>{
    const o = document.createElement('div');
    o.className = 'custom-opt' + (P.custom.shirt===i?' active':'');
    o.innerHTML = `<span class="swatch" style="background:${s.c}"></span>${s.n}`;
    o.onclick = ()=>{ P.custom.shirt=i; save(); renderPanel(); };
    r2.appendChild(o);
  });
  panel.appendChild(r2);
  const l3 = document.createElement('div'); l3.className = 'custom-label'; l3.textContent = 'Головной убор'; panel.appendChild(l3);
  const r3 = document.createElement('div'); r3.className = 'custom-row';
  HATS.forEach((h,i)=>{
    const o = document.createElement('div');
    o.className = 'custom-opt' + (P.custom.hat===i?' active':'');
    o.textContent = h.n;
    o.onclick = ()=>{ P.custom.hat=i; save(); renderPanel(); };
    r3.appendChild(o);
  });
  panel.appendChild(r3);
  const l4 = document.createElement('div'); l4.className = 'custom-label'; l4.textContent = 'Свитер'; panel.appendChild(l4);
  const r4 = document.createElement('div'); r4.className = 'custom-row';
  SWEATERS.forEach((s,i)=>{
    const o = document.createElement('div');
    o.className = 'custom-opt' + (P.custom.sweater===i?' active':'');
    if(s.c) o.innerHTML = `<span class="swatch" style="background:${s.c}"></span>${s.n}`;
    else o.textContent = s.n;
    o.onclick = ()=>{ P.custom.sweater=i; save(); renderPanel(); };
    r4.appendChild(o);
  });
  panel.appendChild(r4);
  const l5 = document.createElement('div'); l5.className = 'custom-label'; l5.textContent = 'Инвентарь'; panel.appendChild(l5);
  let total = 0, cnt = 0;
  Object.entries(P.inv).forEach(([name, c])=>{
    const f = Object.values(FISH).find(x=>x.n===name);
    if(f){ total += f.v*c; cnt += c; }
  });
  const sb = document.createElement('button');
  sb.className = 'shopbtn';
  sb.style.borderColor = '#2a7a4a'; sb.style.background = '#0a2a1a'; sb.style.color = '#5ddc6a';
  sb.textContent = total>0 ? `💰 ПРОДАТЬ (${cnt} · ${total.toLocaleString('ru-RU')}🪙)` : 'Пусто';
  sb.disabled = total<=0;
  sb.onclick = ()=>{
    if(total<=0) return;
    P.gold += total; P.inv = {};
    A.coin(); save(); updateUI();
    addLog(`💰 +${total.toLocaleString('ru-RU')}🪙`, '#ffc94a');
    vibrate(30);
  };
  panel.appendChild(sb);
  const rb = document.createElement('button');
  rb.id = 'resetBtn';
  rb.textContent = '⚠️ СБРОС';
  rb.onclick = ()=>{ 
    if(confirm('Сбросить прогресс?')){ 
      try {
        localStorage.removeItem(KEY); 
        for(const k of OLD_KEYS){ localStorage.removeItem(k); }
      } catch(e){}
      location.reload(); 
    } 
  };
  panel.appendChild(rb);
}

function updateHUD(){
  document.getElementById('lvl').textContent = P.level;
  document.getElementById('gold').textContent = P.gold.toLocaleString('ru-RU');
  document.getElementById('nameTag').textContent = (P.custom && P.custom.name) || 'Рыбак';
  const need = xpNeed(P.level);
  const pct = Math.min(100, (P.xp/need)*100);
  document.getElementById('xpfill').style.width = pct + '%';
  document.getElementById('xptxt').textContent = `${P.xp}/${need}`;
  const w = WEATHERS[P.weather] || WEATHERS.clear;
  document.getElementById('weather').textContent = w.icon;
  document.getElementById('weather').title = w.name;
  document.getElementById('modeBtn').textContent = P.mode === 'world' ? '🌍' : '🎣';
  document.getElementById('viewBtn').classList.toggle('hidden', P.mode !== 'world');
  document.getElementById('dpad').classList.toggle('hidden', P.mode !== 'world');
}
function updateUI(){
  updateHUD();
  renderPanel();
}

load();
updateCamera();
updateBtn();
updateUI();
addLog('🎣 Рыбалка RPG v7.1', '#4aa8ff');
if(!storageOk){
  addLog('⚠️ Сохранение недоступно!', '#e05050');
  showToast('⚠️ Приватный режим — сохранение недоступно', 'danger');
} else {
  addLog('💾 Автосохранение включено', '#5ddc6a');
}
addLog('🌍/🎣 — режим, 💾 — сохранить', '#7a88ac');

setInterval(save, 15000);
window.addEventListener('beforeunload', save);
requestAnimationFrame(loop);

} catch(err){
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = '💥 ' + err.message + ' | ' + (err.stack||'').split('\n')[0];
  console.error(err);
}
</script>
