<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>🎣 Рыбалка RPG v7.4</title>
<style>
:root{--panel:#10403a;--panel2:#186158;--line:#2ea88a;--lt:#4dd8b8;--txt:#d8f8f0;--dim:#6a9a90;--gold:#ffd45e;--acc:#20b2aa;--acc2:#4dd0e1;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;}
body{background:radial-gradient(circle at 50% -10%,#144a42,#0a2622 40%,#061612);color:var(--txt);font-family:'Comic Sans MS','Comic Sans','Chalkboard SE',cursive;display:flex;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:manipulation;}
.wrap{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;gap:4px;padding:4px;overflow-y:auto;}
header{display:flex;align-items:center;gap:4px;background:linear-gradient(135deg,#186158,#10403a);border:2px solid var(--line);border-radius:10px;padding:5px 7px;box-shadow:0 3px 0 #0006,0 0 15px #2ea88a33;flex-shrink:0;flex-wrap:nowrap;}
.badge{background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:bold;font-size:11px;white-space:nowrap;}
.badge b{color:var(--acc2);}
#nameTag{color:var(--gold);font-size:11px;max-width:55px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.xpwrap{flex:1;position:relative;height:14px;background:#041410;border:2px solid var(--line);border-radius:6px;overflow:hidden;min-width:30px;}
.xpfill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,#0e8a5a,#4dd8a0,#0e8a5a);background-size:200% 100%;transition:width .4s;animation:xps 2s linear infinite;}
@keyframes xps{0%{background-position:0%}100%{background-position:200%}}
.xptxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:bold;text-shadow:0 1px 2px #000;}
.gold{color:var(--gold);}
#saveBtn,#modeBtn{border:2px solid var(--line);border-radius:6px;padding:1px 6px;color:#fff;font-size:10px;font-weight:bold;cursor:pointer;font-family:inherit;flex-shrink:0;background:linear-gradient(180deg,#20b2aa,#0e8a5a);}
#saveBtn{background:linear-gradient(180deg,#4dd8a0,#0e8a5a);}
#saveBtn:hover,#modeBtn:hover{filter:brightness(1.2);}
.stage{position:relative;width:min(100%,calc(55vh*16/9));margin:0 auto;flex-shrink:0;border:3px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 4px 0 #0006,0 0 25px #2ea88a44;background:#000;}
.stage::before{content:'';display:block;padding-top:56.25%;}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;image-rendering:pixelated;}
#viewBtn{position:absolute;top:4px;right:4px;width:38px;height:28px;background:linear-gradient(180deg,#4dd0e1,#20b2aa);border:2px solid var(--lt);border-radius:8px;color:#fff;font-size:12px;font-weight:bold;cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0;}
.dpad{position:absolute;bottom:4px;left:4px;width:96px;height:96px;pointer-events:none;z-index:10;}
.dpad.hidden{display:none;}
.dbtn{position:absolute;width:30px;height:30px;background:rgba(77,208,225,0.5);border:2px solid var(--lt);border-radius:8px;color:#fff;font-size:13px;font-weight:bold;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0;margin:0;font-family:inherit;user-select:none;}
.dbtn.pressed{background:rgba(77,208,225,0.9);transform:scale(0.9);}
.d-up{top:0;left:33px;}.d-down{top:66px;left:33px;}.d-left{top:33px;left:0;}.d-right{top:33px;left:66px;}
#action{width:100%;padding:12px;font-family:inherit;font-size:14px;font-weight:bold;color:#041410;cursor:pointer;border:none;border-radius:12px;background:linear-gradient(180deg,#4dd8a0,#0e8a5a);box-shadow:0 5px 0 #054735,0 0 20px #4dd8a066;touch-action:none;min-height:48px;flex-shrink:0;}
#action:active{transform:translateY(3px);box-shadow:0 2px 0 #054735;}
#action.wait{background:linear-gradient(180deg,#5a8888,#3a5c5c);color:#d8f8f0;box-shadow:0 5px 0 #1a2c2c;}
#action.hot{background:linear-gradient(180deg,#ffd45e,#e09a1a);box-shadow:0 5px 0 #8a5c0a,0 0 25px #ffd45e88;animation:pulseHot .35s infinite alternate;}
#action.pull{background:linear-gradient(180deg,#4dd0e1,#20b2aa);color:#041410;box-shadow:0 5px 0 #0e5a5c,0 0 20px #4dd0e188;}
#action.locked{background:linear-gradient(180deg,#5a3030,#3a2020);color:#d8a0a0;}
@keyframes pulseHot{from{filter:brightness(1);}to{filter:brightness(1.3);}}
.tabs{display:flex;gap:3px;flex-shrink:0;}
.tab{flex:1;padding:6px 2px;font-family:inherit;font-size:9px;font-weight:bold;color:var(--dim);background:linear-gradient(180deg,#186158,#10403a);border:2px solid var(--line);border-radius:8px;cursor:pointer;text-transform:uppercase;transition:.2s;}
.tab.active{background:linear-gradient(180deg,#4dd0e1,#20b2aa);color:#041410;border-color:var(--lt);box-shadow:0 0 15px #4dd0e1aa;}
.panelarea{flex:1;overflow-y:auto;min-height:60px;background:linear-gradient(180deg,#10403a,#0a2622);border:2px solid var(--line);border-radius:10px;padding:6px;}
.panelarea::-webkit-scrollbar{width:5px;}.panelarea::-webkit-scrollbar-thumb{background:var(--acc);border-radius:3px;}
.item{display:flex;justify-content:space-between;align-items:center;gap:5px;padding:6px 8px;margin-bottom:3px;border-radius:8px;font-size:11px;background:linear-gradient(135deg,#186158,#10403a);border:2px solid transparent;cursor:pointer;min-height:28px;}
.item:hover{border-color:var(--lt);}
.item.sel{border-color:var(--lt);background:linear-gradient(135deg,#20b2aa,#186158);}
.item.locked{opacity:.4;cursor:not-allowed;}
.item.owned{background:linear-gradient(135deg,#0e8a5a,#0a5a3a);border-color:#4dd8a0;cursor:default;}
.item .sub{font-size:9px;color:var(--dim);display:block;margin-top:1px;}
.item .price{color:var(--gold);font-weight:bold;font-size:10px;white-space:nowrap;}
.item.rar0{color:#9aa4b0}.item.rar1{color:#5de0a2}.item.rar2{color:#5de0d2}
.item.rar3{color:#b06bff}.item.rar4{color:#ffd45e}.item.rar5{color:#ff3b6b}.item.rar6{color:#ff0066}
.shopbtn{width:100%;padding:7px;margin-top:3px;font-family:inherit;font-size:10px;font-weight:bold;cursor:pointer;border:2px solid var(--line);border-radius:8px;background:linear-gradient(180deg,#20b2aa,#0e8a5a);color:#041410;}
.shopbtn:disabled{opacity:.35;cursor:not-allowed;}
.custom-row{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;}
.custom-opt{padding:5px 8px;background:linear-gradient(135deg,#186158,#10403a);border:2px solid var(--line);border-radius:8px;cursor:pointer;font-size:10px;font-weight:bold;color:var(--txt);display:flex;align-items:center;gap:4px;}
.custom-opt.active{background:linear-gradient(135deg,#4dd0e1,#20b2aa);color:#041410;border-color:var(--lt);}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid #0005;}
.custom-label{font-size:10px;color:var(--acc2);text-transform:uppercase;letter-spacing:1px;margin:6px 0 3px;border-bottom:1px solid var(--line);padding-bottom:2px;}
#nameInput{width:100%;padding:7px;font-family:inherit;font-size:12px;background:#041410;border:2px solid var(--line);border-radius:8px;color:var(--txt);margin-bottom:5px;}
#nameInput:focus{outline:none;border-color:var(--lt);}
#resetBtn{width:100%;padding:7px;margin-top:8px;font-family:inherit;font-size:10px;font-weight:bold;cursor:pointer;border:2px solid #8a2020;border-radius:8px;background:#3a0a0a;color:#e05050;}
#log{background:#041410;border:2px solid var(--line);border-radius:10px;padding:5px 7px;font-size:9px;height:45px;overflow-y:auto;line-height:1.5;flex-shrink:0;}
#log::-webkit-scrollbar{width:4px;}#log::-webkit-scrollbar-thumb{background:var(--acc);border-radius:2px;}
#toasts{position:fixed;top:65px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:100%;max-width:320px;padding:0 10px;}
.toast{background:linear-gradient(135deg,#20b2aa,#0e8a5a);border:2px solid var(--lt);border-radius:10px;padding:8px 12px;font-size:11px;font-weight:bold;color:#041410;box-shadow:0 4px 15px #0009;animation:ti .4s cubic-bezier(.34,1.56,.64,1),to .4s 2.4s forwards;text-align:center;}
.toast.gold{background:linear-gradient(135deg,#ffd45e,#e09a1a);color:#041410;}
.toast.success{background:linear-gradient(135deg,#4dd8a0,#0e8a5a);}
.toast.danger{background:linear-gradient(135deg,#e05050,#8a2020);color:#fff;}
@keyframes ti{from{opacity:0;transform:translateY(-30px) scale(.6);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes to{to{opacity:0;transform:translateY(-15px) scale(.9);}}
.floattext{position:absolute;pointer-events:none;font-weight:bold;font-size:12px;animation:fu 1.3s ease-out forwards;text-shadow:2px 2px 0 #000,0 0 8px currentColor;transform:translate(-50%,-50%);font-family:'Comic Sans MS',cursive;}
@keyframes fu{0%{opacity:1;transform:translate(-50%,-50%) scale(.5);}30%{transform:translate(-50%,-50%) scale(1.3);}100%{opacity:0;transform:translate(-50%,-200%) scale(1);}}
#err{position:fixed;bottom:0;left:0;right:0;background:#8a2020;color:#fff;padding:8px;font-size:10px;z-index:9999;font-family:monospace;display:none;}
@media (max-height:520px){#log{height:28px;}.panelarea{min-height:40px;}}
</style>
</head>

  const el = document.getElementById('err');

const A=(()=>{let ctx=null;
  const init=()=>{if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended')ctx.resume()};
  const tone=(f,d,t='sine',v=0.1)=>{if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);const n=ctx.currentTime;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.001,n+d);o.start(n);o.stop(n+d)};
  return{init,
    splash(){if(!ctx)return;const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.35),ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=900;const g=ctx.createGain();g.gain.value=0.18;s.connect(f).connect(g).connect(ctx.destination);s.start()},
    bite(){tone(880,0.15,'square',0.18);setTimeout(()=>tone(1300,0.12,'square',0.15),80);setTimeout(()=>tone(1600,0.12,'square',0.13),160)},
    cast(){tone(180,0.18,'sine',0.12);setTimeout(()=>tone(140,0.2,'sine',0.08),90)},
    catchIt(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.13),i*70))},
    fail(){tone(220,0.25,'sawtooth',0.08)},
    coin(){tone(1200,0.07,'sine',0.09);setTimeout(()=>tone(1600,0.07,'sine',0.09),50)},
    levelup(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.28,'triangle',0.15),i*95))},
    reel(){tone(380+Math.random()*250,0.04,'sine',0.025)},
    dart(){tone(300,0.12,'sawtooth',0.08)},
    snap(){tone(200,0.3,'sawtooth',0.15);setTimeout(()=>tone(150,0.4,'sawtooth',0.12),80)},
    step(){tone(120+Math.random()*40,0.05,'sine',0.02)},
    switch(){tone(600,0.08,'triangle',0.12);setTimeout(()=>tone(900,0.1,'triangle',0.1),70)},
    save(){tone(1400,0.05,'sine',0.08);setTimeout(()=>tone(1800,0.05,'sine',0.06),60)},
  };
})();

let map=[],_seed=42;
const sRand=()=>{_seed=(_seed*1664525+1013904223)>>>0;return _seed/4294967296};
const resetSeed=()=>{_seed=42};

const isWater=t=>t===T.POND||t===T.RIVER||t===T.LAKE||t===T.SWAMP||t===T.SEA||t===T.ICE||t===T.ABYSS||t===T.LAVA;
const isLethalWater=t=>t===T.LAVA||t===T.ABYSS;
const isWalkable=t=>t===T.GRASS||t===T.PATH||t===T.TALL_GRASS||t===T.FLOWER||t===T.BEACH||t===T.PATH_STONE||t===T.SWAMP_GRASS||t===T.BRIDGE;

function blob(cx,cy,rx,ry,tile,noise=0.35){
  for(let y=Math.floor(cy-ry-2);y<=cy+ry+2;y++)for(let x=Math.floor(cx-rx-2);x<=cx+rx+2;x++){
    if(x<1||x>=MAP_W-1||y<1||y>=MAP_H-1)continue;
    const nx=(x-cx)/rx,ny=(y-cy)/ry,d=Math.sqrt(nx*nx+ny*ny),ang=Math.atan2(ny,nx);
    const wob=1+Math.sin(ang*3+cx*0.7)*noise+Math.sin(ang*5+cy*0.5)*noise*0.6+Math.sin(ang*7)*noise*0.3;
    if(d<wob)map[y][x]=tile;
  }
}
function river(x0,y0,x1,y1,w,tile){
  const steps=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2;
  for(let i=0;i<=steps;i++){
    const t=i/steps,px=x0+(x1-x0)*t,py=y0+(y1-y0)*t,wob=Math.sin(t*Math.PI*4)*1.8;
    const wx=px+Math.cos(Math.PI/2)*wob,wy=py+Math.sin(Math.PI/2)*wob;
    for(let dy=-w;dy<=w;dy++)for(let dx=-w;dx<=w;dx++){
      if(dx*dx+dy*dy>w*w)continue;
      const tx=Math.round(wx+dx),ty=Math.round(wy+dy);
      if(tx<1||tx>=MAP_W-1||ty<1||ty>=MAP_H-1)continue;
      map[ty][tx]=tile;
    }
  }
}

function genWorld(){
  resetSeed();
  map=[];
  for(let y=0;y<MAP_H;y++){map[y]=[];for(let x=0;x<MAP_W;x++)map[y][x]=T.GRASS}
  blob(7,7,5,4,T.POND,0.4);
  blob(17,5,5,3.5,T.ICE,0.3);
  blob(33,7,7,5,T.LAKE,0.35);
  blob(6,26,5,4,T.SWAMP,0.6);
  blob(38,22,7,6,T.SEA,0.25);
  blob(38,30,4,3,T.ABYSS,0.4);
  blob(20,27,5,4,T.LAVA,0.4);
  river(2,17,42,17,1,T.RIVER);

  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    if(!isWater(map[y][x]))continue;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const ny=y+dy,nx=x+dx;
      if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W)continue;
      if(map[ny][nx]!==T.GRASS)continue;
      if(sRand()<0.6&&(map[y][x]===T.POND||map[y][x]===T.LAKE||map[y][x]===T.SEA))map[ny][nx]=T.SHALLOW;
    }
  }
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    if(map[y][x]!==T.GRASS)continue;
    let near=false;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const ny=y+dy,nx=x+dx;
      if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W)continue;
      if(map[ny][nx]===T.SEA||map[ny][nx]===T.LAKE){near=true;break}
    }
    if(near&&sRand()<0.7)map[y][x]=T.BEACH;
  }
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    if(map[y][x]!==T.GRASS)continue;
    let near=false;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const ny=y+dy,nx=x+dx;
      if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W)continue;
      if(map[ny][nx]===T.SWAMP){near=true;break}
    }
    if(near&&sRand()<0.7)map[y][x]=T.SWAMP_GRASS;
  }

  // Город
  const houses=[{x:14,y:11,w:3,h:2},{x:18,y:11,w:3,h:2},{x:22,y:11,w:4,h:2},{x:27,y:11,w:3,h:2},{x:14,y:21,w:3,h:2},{x:18,y:21,w:3,h:2}];
  houses.forEach(h=>{
    for(let y=h.y;y<h.y+h.h;y++)for(let x=h.x;x<h.x+h.w;x++)map[y][x]=T.HOUSE;
    for(let x=h.x;x<h.x+h.w;x++)map[h.y][x]=T.HOUSE_ROOF;
    map[h.y+h.h-1][h.x+Math.floor(h.w/2)]=T.DOOR;
    if(h.w>=3){map[h.y+1][h.x]=T.WINDOW;map[h.y+1][h.x+h.w-1]=T.WINDOW}
  });
  for(let y=13;y<=20;y++){map[y][15]=T.PATH_STONE;map[y][19]=T.PATH_STONE}
  for(let x=12;x<=30;x++){map[14][x]=T.PATH;map[20][x]=T.PATH}
  for(let x=10;x<=32;x++)map[17][x]=T.PATH_STONE;
  map[17][20]=T.WELL;
  map[16][18]=T.BENCH;map[16][22]=T.BENCH;
  map[15][13]=T.LAMP;map[15][29]=T.LAMP;
  map[19][13]=T.LAMP;map[19][29]=T.LAMP;
  map[14][11]=T.SIGN;map[14][25]=T.MAILBOX;map[22][24]=T.CAMPFIRE;

  for(let y=0;y<MAP_H;y++)if(isWalkable(map[y][20]))map[y][20]=T.PATH;
  for(let x=0;x<MAP_W;x++)if(isWalkable(map[17][x]))map[17][x]=T.PATH;

  // Дорожки к воде
  const conns=[[20,17,7,7],[20,17,17,5],[20,17,33,7],[20,17,6,26],[20,17,38,22],[20,17,20,27],[20,17,38,30]];
  conns.forEach(c=>{
    const[x0,y0,x1,y1]=c,steps=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2;
    for(let i=0;i<=steps;i++){
      const t=i/steps,px=Math.round(x0+(x1-x0)*t),py=Math.round(y0+(y1-y0)*t);
      if(px<0||px>=MAP_W||py<0||py>=MAP_H)continue;
      const cur=map[py][px];
      if(cur===T.GRASS||cur===T.TALL_GRASS||cur===T.FLOWER||cur===T.BUSH)map[py][px]=T.PATH;
    }
  });
  for(let x=19;x<=21;x++){map[16][x]=T.BRIDGE;map[17][x]=T.BRIDGE;map[18][x]=T.BRIDGE}

  // Декор
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    if(map[y][x]!==T.GRASS)continue;
    let nW=false,nP=false,nB=false;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const ny=y+dy,nx=x+dx;
      if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W)continue;
      const t=map[ny][nx];
      if(isWater(t)||t===T.SHALLOW||t===T.BEACH)nW=true;
      if(t===T.PATH||t===T.PATH_STONE)nP=true;
      if(t===T.HOUSE||t===T.HOUSE_ROOF||t===T.DOOR||t===T.WINDOW)nB=true;
    }
    if(nW||nP||nB)continue;
    const r=sRand();
    if(r<0.05)map[y][x]=T.TREE;
    else if(r<0.10)map[y][x]=T.TALL_GRASS;
    else if(r<0.15)map[y][x]=T.FLOWER;
    else if(r<0.18)map[y][x]=T.BUSH;
    else if(r<0.19)map[y][x]=T.ROCK;
    else if(r<0.205)map[y][x]=T.STUMP;
  }
  // Биом-декор
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    if(map[y][x]!==T.GRASS&&map[y][x]!==T.BEACH&&map[y][x]!==T.SWAMP_GRASS)continue;
    let nS=false,nI=false,nSw=false,nL=false,nP=false,nLk=false,nA=false;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const ny=y+dy,nx=x+dx;
      if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W)continue;
      const tt=map[ny][nx];
      if(tt===T.SEA)nS=true;else if(tt===T.ICE)nI=true;
      else if(tt===T.SWAMP)nSw=true;else if(tt===T.LAVA)nL=true;
      else if(tt===T.POND)nP=true;else if(tt===T.LAKE)nLk=true;
      else if(tt===T.ABYSS)nA=true;
    }
    const r=sRand();
    if(nS&&r<0.22){map[y][x]=T.PALM;continue}
    if(nI&&r<0.20){map[y][x]=sRand()<0.7?T.PINE:T.SNOW_PILE;continue}
    if(nSw&&r<0.22){map[y][x]=sRand()<0.6?T.DEAD_TREE:T.MUSHROOM;continue}
    if(nL&&r<0.25){map[y][x]=T.LAVA_ROCK;continue}
    if(nP&&r<0.15){map[y][x]=sRand()<0.5?T.REED:T.LILY;continue}
    if(nLk&&r<0.12){map[y][x]=sRand()<0.5?T.REED:T.LILY;continue}
    if(nA&&r<0.15){map[y][x]=T.CRYSTAL;continue}
  }
  // Чистим спавн
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const sy=11+dy,sx=7+dx;
    if(sy>=0&&sy<MAP_H&&sx>=0&&sx<MAP_W)map[sy][sx]=T.PATH;
  }
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)map[17+dy][20+dx]=T.PATH_STONE;
}

function safeSpawn(){
  for(const[x,y]of[[7,11],[7,12],[8,11],[6,11],[7,10],[5,12],[9,10],[7,13],[8,13],[6,13],[20,17],[20,16],[20,18]]){
    if(x>=0&&x<MAP_W&&y>=0&&y<MAP_H&&isWalkable(map[y][x]))return{x:x*TILE+TILE/2,y:y*TILE+TILE/2};
  }
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++)if(isWalkable(map[y][x]))return{x:x*TILE+TILE/2,y:y*TILE+TILE/2};
  return{x:W/2,y:H/2};
}

function collides(wx,wy){
  const hw=5,hh=4;
  for(const[cx,cy]of[[wx-hw,wy-hh],[wx+hw,wy-hh],[wx-hw,wy+hh],[wx+hw,wy+hh]]){
    const tx=Math.floor(cx/TILE),ty=Math.floor(cy/TILE);
    if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H)return true;
    const tile=map[ty][tx];
    if(isLethalWater(tile))return true;
    if(isWater(tile)){if(!P.boat.owned)return true;continue}
    if(!isWalkable(tile))return true;
  }
  return false;
}

function findNearbyWater(){
  const px=Math.floor(player.x/TILE),py=Math.floor(player.y/TILE);
  for(let r=1;r<=4;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
    const tx=px+dx,ty=py+dy;
    if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H)continue;
    if(isWater(map[ty][tx]))return{x:tx,y:ty,zone:waterToZone(map[ty][tx]),dx,dy};
  }
  return null;
}

// ============ ПЕРСОНАЖ (с анимациями) ============
function drawPlayerTop(wx,wy){
  const sx=Math.round(wx-cam.x),sy=Math.round(wy-cam.y);
  const cu=P.custom||{skin:1,shirt:0,hat:1,sweater:0};
  const sk=SKINS[cu.skin]||SKINS[1];
  const sh=SHIRTS[cu.shirt]||SHIRTS[0];
  const hat=HATS[cu.hat]||HATS[0];
  const sw=SWEATERS[cu.sweater||0]||SWEATERS[0];
  const t=S.time,onWater=isPlayerOnWater();
  let bob=0;
  if(S.playerAnim==='idle')bob=Math.sin(t*2)*0.5;
  else if(S.playerAnim==='walk')bob=Math.sin(player.anim*2)*1;
  else if(S.playerAnim==='celebrate')bob=Math.abs(Math.sin(t*10))*2;
  else if(S.playerAnim==='jump')bob=-Math.abs(Math.sin(S.playerAnimT*8))*4;
  else if(S.playerAnim==='sad')bob=Math.sin(t*4)*0.7;
  else if(S.playerAnim==='cast')bob=Math.sin(t*6)*0.6;
  else if(S.playerAnim==='reel')bob=Math.sin(t*8)*1;

  if(!onWater){g.fillStyle='rgba(0,0,0,0.35)';g.fillRect(sx-4,sy+6,9,3)}

  const walkOff=player.moving&&S.playerAnim==='walk'?Math.sin(player.anim)*1.5:0;
  g.fillStyle='#2b3550';
  g.fillRect(sx-2,sy+4+walkOff+bob,3,4);
  g.fillRect(sx+1,sy+4-walkOff+bob,3,4);

  const bodyColor=sw.c||sh.c,bodyShade=sw.s||sh.s;
  g.fillStyle=bodyColor;g.fillRect(sx-4,sy-1+bob,9,6);
  g.fillStyle=bodyShade;g.fillRect(sx-4,sy-1+bob,9,1);
  if(sw.stripe){g.fillStyle=bodyShade;g.fillRect(sx-4,sy+1+bob,9,1);g.fillRect(sx-4,sy+3+bob,9,1)}
  else if(sw.pattern==='hearts'){g.fillStyle=bodyShade;g.fillRect(sx-2,sy+1+bob,1,1);g.fillRect(sx+1,sy+1+bob,1,1)}
  else if(sw.pattern==='snow'){g.fillStyle='#fff';g.fillRect(sx-1,sy+1+bob,1,1)}
  else if(sw.pattern==='fire'){g.fillStyle=bodyShade;g.fillRect(sx-3,sy+2+bob,2,1);g.fillRect(sx+2,sy+1+bob,2,1)}
  else if(sw.pattern==='night'){g.fillStyle='#fff';g.fillRect(sx-2,sy+1+bob,1,1);g.fillRect(sx+3,sy+2+bob,1,1)}

  // Руки с анимацией
  g.fillStyle=sk.c;
  if(S.playerAnim==='cast'){
    const ph=Math.sin(S.playerAnimT*8);
    if(ph>0)g.fillRect(sx+4,sy-3+bob,3,3);
    else g.fillRect(sx+5,sy+bob,2,3);
  }else if(S.playerAnim==='reel'){
    const ph=S.playerAnimT*10;
    g.fillRect(sx+5+Math.cos(ph)*2,sy+1+bob+Math.sin(ph)*2,2,2);
  }else if(S.playerAnim==='celebrate'){
    g.fillRect(sx-6,sy-3+bob,2,4);g.fillRect(sx+5,sy-3+bob,2,4);
  }else if(S.playerAnim==='sad'){
    g.fillRect(sx-5,sy+3+bob,2,3);g.fillRect(sx+4,sy+3+bob,2,3);
  }else if(player.dir==='left')g.fillRect(sx-6,sy+1+bob,2,3);
  else if(player.dir==='right')g.fillRect(sx+5,sy+1+bob,2,3);
  else{g.fillRect(sx-5,sy+1+bob,2,2);g.fillRect(sx+5,sy+1+bob,2,2)}

  // Голова
  g.fillStyle=sk.c;g.fillRect(sx-3,sy-6+bob,7,5);
  g.fillStyle=sk.s;g.fillRect(sx-3,sy-2+bob,7,1);

  // Глаза + моргание
  const blink=S.blinkT>0&&S.blinkT<0.15;
  if(!blink){
    g.fillStyle='#1a1f30';
    if(S.playerAnim==='celebrate'){g.fillRect(sx-2,sy-5+bob,1,1);g.fillRect(sx+2,sy-5+bob,1,1)}
    else if(S.playerAnim==='sad'){g.fillRect(sx-2,sy-3+bob,1,1);g.fillRect(sx+2,sy-3+bob,1,1)}
    else if(player.dir==='down'){g.fillRect(sx-2,sy-4+bob,1,1);g.fillRect(sx+2,sy-4+bob,1,1)}
    else if(player.dir==='left'){g.fillRect(sx-2,sy-4+bob,1,1)}
    else if(player.dir==='right'){g.fillRect(sx+2,sy-4+bob,1,1)}
  }

  // Рот
  if(S.playerAnim==='celebrate'){g.fillStyle='#a03030';g.fillRect(sx-1,sy-1+bob,3,1)}
  else if(S.playerAnim==='sad'){g.fillStyle='#a03030';g.fillRect(sx-1,sy-1+bob,3,1);g.fillStyle='#1a1f30';g.fillRect(sx-1,sy-2+bob,1,1);g.fillRect(sx+1,sy-2+bob,1,1)}

  // Шляпа
  if(hat.id==='cap'){g.fillStyle=hat.c;g.fillRect(sx-4,sy-8+bob,9,2);g.fillStyle=hat.s;g.fillRect(sx-4,sy-7+bob,9,1)}
  else if(hat.id==='beanie'){g.fillStyle=hat.c;g.fillRect(sx-3,sy-9+bob,7,3);g.fillStyle=hat.s;g.fillRect(sx-3,sy-8+bob,7,1);g.fillStyle='#fff';g.fillRect(sx-1,sy-10+bob,2,1)}
  else if(hat.id==='straw'){g.fillStyle=hat.c;g.fillRect(sx-6,sy-8+bob,13,2);g.fillRect(sx-2,sy-10+bob,5,2);g.fillStyle=hat.s;g.fillRect(sx-6,sy-7+bob,13,1)}
  else if(hat.id==='crown'){g.fillStyle=hat.c;g.fillRect(sx-3,sy-9+bob,7,3);g.fillRect(sx-3,sy-11+bob,1,2);g.fillRect(sx,sy-11+bob,1,2);g.fillRect(sx+3,sy-11+bob,1,2);g.fillStyle='#ff0066';g.fillRect(sx-1,sy-8+bob,1,1)}
  else if(hat.id==='phones'){g.fillStyle=hat.c;g.fillRect(sx-5,sy-6+bob,1,3);g.fillRect(sx+5,sy-6+bob,1,3);g.fillRect(sx-4,sy-7+bob,9,1);g.fillStyle=hat.s;g.fillRect(sx-5,sy-5+bob,1,1);g.fillRect(sx+5,sy-5+bob,1,1)}

  // Спецэффекты
  if(S.playerAnim==='celebrate'){
    for(let i=0;i<5;i++){
      const ang=t*3+i*Math.PI*2/5,dx=Math.cos(ang)*10,dy=Math.sin(ang)*8-8;
      g.fillStyle='#ffd45e';g.fillRect(sx+dx,sy+dy+bob,1,1);
    }
  }
  if(S.playerAnim==='jump'&&S.playerAnimT<0.5){
    g.fillStyle=`rgba(200,200,200,${1-S.playerAnimT*2})`;
    g.fillRect(sx-6,sy+8+bob,2,2);g.fillRect(sx+4,sy+8+bob,2,2);
  }
}

function drawPlayer(wx,wy){

function drawFishingLineWorld(){
  if(!S.targetWater||P.mode!=='world')return;
  const off={up:{x:0,y:-14},down:{x:8,y:8},left:{x:-14,y:-4},right:{x:14,y:-4}};
  const o=off[player.dir]||off.down;
  const tip={x:player.x+o.x,y:player.y+o.y};
  const bx=S.bobberWorld.x-cam.x,by=S.bobberWorld.y-cam.y;
  const tx=tip.x-cam.x,ty=tip.y-cam.y;
  const sag=S.phase==='hooked'?0:(S.phase==='bite'?3:6);
  g.fillStyle='#c8d8e8';
  const dx=bx-tx,dy=by-ty,steps=Math.max(2,Math.ceil(Math.hypot(dx,dy)));
  for(let i=0;i<=steps;i++){const p=i/steps,s=Math.sin(p*Math.PI)*sag;g.fillRect(Math.round(tx+dx*p),Math.round(ty+dy*p+s),1,1)}
  const bwx=Math.round(bx),bwy=Math.round(by);
  g.fillStyle='#e04040';g.fillRect(bwx-2,bwy-2,4,2);
  g.fillStyle='#fff';g.fillRect(bwx-2,bwy,4,2);
  g.fillStyle='#2a2a3a';g.fillRect(bwx-1,bwy-4,2,2);
  if(S.phase==='waiting'||S.phase==='bite'){
    const a=(Math.sin(S.time*3)+1)*0.5;
    g.globalAlpha=0.3*a;g.strokeStyle='#a8dcf0';g.lineWidth=1;
    g.beginPath();g.ellipse(bwx,bwy+2,7+Math.sin(S.time*3)*2,2.5,0,0,Math.PI*2);g.stroke();
    g.globalAlpha=1;
  }
}

function drawMinimap(){
  if(P.mode!=='world')return;
  const mmW=68,mmH=52,mmX=W-mmW-3,mmY=3;
  const sX=mmW/WORLD_W,sY=mmH/WORLD_H;
  g.fillStyle='rgba(5,10,20,0.85)';g.fillRect(mmX-1,mmY-1,mmW+2,mmH+2);
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
    const tile=map[ty][tx];let color;
    if(isWater(tile))color=TILE_COLORS[tile].a;
    else if(tile===T.TREE||tile===T.BUSH||tile===T.PINE||tile===T.PALM||tile===T.DEAD_TREE)color='#2a4a2a';
    else if(tile===T.PATH||tile===T.PATH_STONE)color='#a8a080';
    else if(tile===T.HOUSE||tile===T.HOUSE_ROOF)color='#c86a4a';
    else if(tile===T.BEACH)color='#d8c890';
    else color='#3a6a3a';
    g.fillStyle=color;
    g.fillRect(mmX+Math.floor(tx*TILE*sX),mmY+Math.floor(ty*TILE*sY),Math.max(1,Math.ceil(TILE*sX)),Math.max(1,Math.ceil(TILE*sY)));
  }
  const px=mmX+Math.floor(player.x*sX),py=mmY+Math.floor(player.y*sY);
  g.fillStyle='#ff3b3b';g.fillRect(px-1,py-1,3,3);
  g.strokeStyle='#fff';g.lineWidth=1;g.strokeRect(px-1.5,py-1.5,4,4);

function drawWorldOverlay(){
  if(S.phase==='explore'&&P.mode==='world'){
    const nw=findNearbyWater();
    if(nw){
      const z=ZONES[nw.zone],locked=z.lvl>P.level;
      let label=locked?`🔒 ${z.n} (ур.${z.lvl})`:`🎣 ${z.n}`;
      if(!locked&&isPlayerOnWater())label=`🛶 ${z.n}`;
      const sx=player.x-cam.x,sy=player.y-cam.y-22;
      g.font='bold 7px monospace';g.textAlign='center';
      const tw=g.measureText(label).width;
      g.fillStyle='rgba(5,10,20,0.85)';g.fillRect(sx-tw/2-3,sy-8,tw+6,11);
      g.fillStyle=locked?'#e05050':'#5ddc6a';
      g.fillText(label,sx,sy);
    }
  }
  if(isNight()){g.fillStyle='rgba(10,15,40,0.4)';g.fillRect(0,0,W,H)}
  if(P.weather==='rain'||P.weather==='storm'){
    const drops=P.weather==='storm'?60:30;
    g.fillStyle='rgba(180,210,240,0.5)';
    for(let i=0;i<drops;i++){
      const x=(i*37+S.time*380)%W,y=(i*53+S.time*480)%H;
      g.fillRect(Math.round(x),Math.round(y),1,3);
    }
  }
  if(S.lightning>0){g.globalAlpha=S.lightning*0.7;g.fillStyle='#e0e8ff';g.fillRect(0,0,W,H);g.globalAlpha=1}
  for(const p of S.particles){
    g.globalAlpha=Math.max(0,1-p.t/p.life);
    g.fillStyle=p.c;
    if(P.mode==='world')g.fillRect(Math.round(p.x-cam.x),Math.round(p.y-cam.y),p.size||1,p.size||1);
    else g.fillRect(Math.round(p.x),Math.round(p.y),p.size||1,p.size||1);
  }
  g.globalAlpha=1;
}

  g.fillStyle='rgba(255,255,255,0.22)';
  for(let i=0;i<3;i++){
    const cx=((T2*6+i*130)%400)-40,cy=20+i*13;
    g.fillRect(cx,cy,26,3);g.fillRect(cx+5,cy-3,16,3);g.fillRect(cx+9,cy-6,9,3);
  }
  // Холмы
  g.fillStyle=pal.hill2;
  for(let x=-20;x<W+40;x+=46){
    const h=22+Math.sin(x*0.21)*9;
    for(let i=0;i<h;i++){const w=Math.round((h-i)*0.9);g.fillRect(x-w,96-i,w*2,1)}
  }
  g.fillStyle=pal.hill;
  for(let x=20;x<W+40;x+=60){
    const h=14+Math.cos(x*0.17)*6;
    for(let i=0;i<h;i++){const w=Math.round((h-i)*0.85);g.fillRect(x-w,96-i,w*2,1)}
  }
  // Вода
  g.fillStyle=pal.water[0];g.fillRect(0,96,W,32);
  g.fillStyle=pal.water[1];g.fillRect(0,128,W,28);
  g.fillStyle=pal.water[2];g.fillRect(0,156,W,24);
  for(let row=0;row<9;row++){
    const yy=101+row*9;
    for(let x=0;x<W;x+=9){
      const off=Math.sin(T2*1.6+x*0.14+row*1.9)*2.2;
      g.fillStyle=row<3?'rgba(255,255,255,0.11)':'rgba(255,255,255,0.06)';
      g.fillRect(Math.round(x+off),yy,4,1);
    }
  }
  g.globalAlpha=0.14;g.fillStyle=pal.sun;
  for(let i=0;i<8;i++){const w=10-i*0.9;g.fillRect(258-w/2,100+i*7,w,2)}
  g.globalAlpha=1;

  // Пирс
  g.fillStyle='#4a3019';g.fillRect(6,117,3,22);g.fillRect(26,117,3,26);
  g.fillRect(46,117,3,24);g.fillRect(68,117,3,30);
  g.fillStyle='#7a5433';g.fillRect(0,112,80,5);
  g.fillStyle='#5c3e24';g.fillRect(0,117,80,3);

  // Рыбак — рисуем в screen-координатах (cam=0,0)
  const savedCamX=cam.x,savedCamY=cam.y;
  cam.x=0;cam.y=0;
  const savedDir=player.dir;
  const savedAnim=S.playerAnim;
  const savedAnimT=S.playerAnimT;
  // Принудительно направление вправо (лицом к воде)
  player.dir='right';
  // Анимация в зависимости от фазы
  if(S.phase==='charging'||S.phase==='casting'){S.playerAnim='cast';S.playerAnimT=S.time}
  else if(S.phase==='waiting'){S.playerAnim='idle';S.playerAnimT=S.time}
  else if(S.phase==='bite'){S.playerAnim='cast';S.playerAnimT=S.time}
  else if(S.phase==='hooked'){S.playerAnim='reel';S.playerAnimT=S.time}
  else if(S.phase==='result'&&S.success){S.playerAnim='celebrate';S.playerAnimT=S.time}
  else if(S.phase==='result'&&!S.success){S.playerAnim='sad';S.playerAnimT=S.time}
  else {S.playerAnim='idle';S.playerAnimT=S.time}
  // Рисуем рыбака на позиции (38, 100) в screen-coords
  drawPlayerTop(38, 100);
  // Восстанавливаем
  cam.x=savedCamX;cam.y=savedCamY;
  player.dir=savedDir;
  S.playerAnim=savedAnim;
  S.playerAnimT=savedAnimT;

  // Удочка и леска
  if(S.phase!=='explore'){
    drawClassicLine();
  }
}

function drawClassicLine(){
  const tipX=55,tipY=90;
  // Удилище
  pixelLine(45,100,tipX,tipY,'#8a6a3a',0);
  pixelLine(46,100,tipX,tipY,'#c8a05a',0);

  // Текущая позиция поплавка (с анимацией полёта)
  let bx=S.classicBobberX,by=S.classicBobberY;
  if(S.phase==='casting'){
    const p=clamp(S.castT,0,1);
    bx=tipX+(S.classicBobberX-tipX)*p;
    by=tipY+(S.classicBobberY-tipY)*p-Math.sin(p*Math.PI)*20;
  }else if(S.phase==='waiting'){
    by+=Math.sin(S.time*3)*2;
  }else if(S.phase==='bite'){
    by+=Math.sin(S.time*22)*2.5;
  }

  // Леска
  const sag=S.phase==='hooked'?0:(S.phase==='bite'?3:8);
  pixelLine(tipX,tipY,bx,by-4,'#c8d8e8',sag);

  // Поплавок
  g.fillStyle='#e04040';g.fillRect(bx-2,by-2,4,2);
  g.fillStyle='#fff';g.fillRect(bx-2,by,4,2);
  g.fillStyle='#2a2a3a';g.fillRect(bx-1,by-4,2,2);

  // Круги на воде
  if(S.phase==='waiting'||S.phase==='bite'){
    const a=(Math.sin(S.time*3)+1)*0.5;
    g.globalAlpha=0.3*a;g.strokeStyle='#a8dcf0';g.lineWidth=1;
    g.beginPath();g.ellipse(bx,by+2,7+Math.sin(S.time*3)*2,2.5,0,0,Math.PI*2);g.stroke();
    g.globalAlpha=1;
  }
}

// ============ RENDER ============
function render(){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  if(S.shake>0){
    const sx=(Math.random()-0.5)*S.shake,sy=(Math.random()-0.5)*S.shake;
    g.setTransform(1,0,0,1,Math.round(sx),Math.round(sy));
  }
  if(P.mode==='world'){
    drawWorld();
    drawWaterHint();
    drawPlayer(player.x,player.y);
    if(S.phase!=='explore')drawFishingLineWorld();
    drawWorldOverlay();
    if(S.phase==='hooked')drawHookUI();
    if(S.phase==='result')drawResultUI();
    if(S.phase==='charging')drawChargingBar();
    drawMinimap();
  }else{
    drawClassicScene();
    drawWorldOverlay();
    if(S.phase==='hooked')drawHookUI();
    if(S.phase==='result')drawResultUI();
    if(S.phase==='charging')drawChargingBar();
  }
  g.setTransform(1,0,0,1,0,0);
}

// ============ ЛОГИКА ============
function setPlayerAnim(name,duration=0){
  S.playerAnim=name;S.playerAnimT=0;
  if(duration>0){setTimeout(()=>{if(S.playerAnim===name)S.playerAnim='idle'},duration*1000)}
}

function startFishing(){
  if(P.mode==='classic'){
    if(ZONES[P.zone].lvl>P.level){showToast(`🔒 Нужен уровень ${ZONES[P.zone].lvl}`,'danger');return false}
    S.currentZone=P.zone;
    P.visited[P.zone]=true;
    S.classicBobberX=150;S.classicBobberY=120;
    S.targetWater={zone:P.zone};
    S.phase='charging';S.power=0;S.powerDir=1;
    return true;
  }
  const nw=findNearbyWater();
  if(!nw)return false;
  const z=ZONES[nw.zone];
  if(z.lvl>P.level){showToast(`🔒 Нужен уровень ${z.lvl}`,'danger');return false}
  if(Math.abs(nw.dx)>Math.abs(nw.dy))player.dir=nw.dx<0?'left':'right';
  else player.dir=nw.dy<0?'up':'down';
  S.targetWater=nw;S.currentZone=nw.zone;P.zone=nw.zone;P.visited[nw.zone]=true;
  S.bobberWorld={x:nw.x*TILE+TILE/2,y:nw.y*TILE+TILE/2};
  S.phase='charging';S.power=0;S.powerDir=1;
  setPlayerAnim('cast',1.0);
  return true;
}

function doCast(){
  if(P.activeBait!=='worm'){P.bait[P.activeBait]--;if(P.bait[P.activeBait]<=0)P.activeBait='worm'}
  S.phase='casting';S.t=0;S.castT=0;
  A.cast();updateUI();save();
}

function startWaiting(){
  S.phase='waiting';S.t=0;
  const wmod=P.weather==='storm'?0.75:P.weather==='rain'?0.9:1.0;
  S.waitTime=rnd(0.6,1.8)*rod().speed*wmod;
  S.biteWin=2.5;S.biteT=0;
  setPlayerAnim('idle');
}

function triggerBite(){
  S.phase='bite';S.t=0;S.biteT=0;
  A.bite();vibrate([40,30,40,30,40]);
  S.shake=3;updateBtn();
}

function hookFish(){
  // ⚡ Реакция = качество подсечки
  const reaction=S.biteT;
  let quality,label;
  if(reaction<0.25){quality=2.0;label='⚡ ИДЕАЛЬНАЯ подсечка!';P.perfectHooks++}
  else if(reaction<0.5){quality=1.5;label='✨ Отличная подсечка!'}
  else if(reaction<1.0){quality=1.0;label='👍 Хорошая подсечка'}
  else {quality=0.6;label='😐 Поздновато...'}
  S.hookQuality=quality;
  addLog(label,quality>=1.5?'#ffd45e':(quality>=1.0?'#5ddc6a':'#a0a0a0'));
  if(quality>=1.5)showToast(label,'gold');

  S.curFish=rollFish();
  S.success=false;
  S.tension=20;S.progress=0;S.holding=false;
  S.nextDart=rnd(1.5,2.5);S.dartFlash=0;
  S.phase='hooked';
  setPlayerAnim('reel',3);
  A.cast();updateBtn();
}

function rollFish(){
  const z=ZONES[S.currentZone]||ZONES[0];
  const baseLuck=rod().luck+(P.level-1)*0.015+S.power*0.4+(isPlayerOnWater()?0.1:0);
  const luck=baseLuck*S.hookQuality;
  const baitMult=activeBait().mult;
  const weatherMult=P.weather==='storm'?1.4:P.weather==='rain'?1.2:1.0;
  const items=z.pool.map(id=>{
    const f=FISH[id];
    let w=f.w;
    if(f.r>0){
      w*=Math.pow(baitMult,f.r);
      w*=Math.pow(1+luck,f.r*1.5);
    }else{
      // Обычные теряют вес при удаче
      w*=Math.max(0.3,1-luck*0.5);
    }
    if(f.r>=3)w*=weatherMult;
    if(f.time.includes('day')&&isNight())w*=0.15;
    if(f.time.includes('night')&&!isNight())w*=0.15;
    if(f.time.includes('dawn')&&Math.abs(P.dayTime-0.25)>0.08)w*=0.3;
    if(f.time.includes('dusk')&&Math.abs(P.dayTime-0.75)>0.08)w*=0.3;
    if(f.weather&&!f.weather.includes('any')&&!f.weather.includes(P.weather))w*=0.2;
    return{id,f,w};
  });
  let total=items.reduce((s,i)=>s+i.w,0),r=Math.random()*total;
  for(const it of items){r-=it.w;if(r<=0)return it.f}
  return items[0].f;
}

function catchFish(){
  S.success=true;
  const f=S.curFish;
  P.catches++;
  P.inv[f.n]=(P.inv[f.n]||0)+1;
  const isNew=!P.journal[f.n];
  P.journal[f.n]=(P.journal[f.n]||0)+1;
  if(f.r===2)P.foundRare++;
  if(f.r===4)P.foundLegend++;
  if(f.r===5)P.foundMythic++;
  if(f.r===6)P.foundDivine++;
  addXP(f.x);
  const rar=RARITY[f.r];
  addLog(`✅ ${f.n} (+${f.x} xp)`,rar.c);
  if(isNew)showToast(`🆕 ${f.n}!`,'gold');
  const wx=P.mode==='world'?S.bobberWorld.x:150;
  const wy=P.mode==='world'?S.bobberWorld.y:120;
  for(let i=0;i<22;i++){S.particles.push({x:wx,y:wy,vx:rnd(-70,70),vy:rnd(-90,-25),life:rnd(0.5,1.0),t:0,c:Math.random()<0.55?'#a8e4ff':'#fff',size:Math.random()<0.3?2:1})}
  if(P.mode==='world')addFloatText(wx,wy-20,`+${f.x} XP`,'#5ddc6a');
  A.catchIt();vibrate([50,30,100]);
  S.shake=6;
  setPlayerAnim(f.r>=4?'celebrate':'jump',1.5);
  checkAchievements();
  save();
  S.phase='result';S.t=0;
  updateUI();
}

function snapLine(){
  S.success=false;
  A.snap();vibrate([100,50,100,50,150]);
  addLog('💥 Леска порвалась!','#e05050');
  showToast('💥 Порвалась!','danger');
  S.phase='result';S.t=0;
  setPlayerAnim('sad',2);
  updateUI();
}

function addXP(amount){
  P.xp+=amount;
  let need=xpNeed(P.level),leveled=false;
  while(P.xp>=need){P.xp-=need;P.level++;leveled=true;need=xpNeed(P.level)}
  if(leveled){
    A.levelup();vibrate([100,50,100,50,200]);
    addLog(`⭐ УРОВЕНЬ ${P.level}!`,'#ffc94a');
    showToast(`⭐ Уровень ${P.level}!`,'gold');
    ZONES.forEach(z=>{if(z.lvl===P.level)addLog(`🗺️ Открыта: ${z.n}!`,'#4aa8ff')});
  }
}

function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!P.achievements[a.id]&&a.check(P)){
      P.achievements[a.id]=Date.now();
      showToast(`🏆 ${a.n}!`,'gold');
      addLog(`🏆 ${a.n}`,'#ffc94a');
      A.coin();
    }
  });
}

// ============ КНОПКА ============
const btn=document.getElementById('action');
function updateBtn(){
  btn.className='';
  if(S.phase==='explore'){
    if(P.mode==='classic'){
      const z=ZONES[P.zone]||ZONES[0];
      if(z.lvl>P.level){btn.textContent=`🔒 Ур.${z.lvl}`;btn.className='locked'}
      else btn.textContent=`🎣 ${z.n}`;
      return;
    }
    const nw=findNearbyWater();
    if(nw){
      const z=ZONES[nw.zone];
      if(z.lvl>P.level){btn.textContent=`🔒 Ур.${z.lvl}`;btn.className='locked'}
      else btn.textContent=`🎣 ${z.n}`;
    }else{btn.textContent='🚶 К воде';btn.className='wait'}
    return;
  }
  switch(S.phase){
    case 'charging':btn.textContent='⬆️ ОТПУСТИ!';btn.className='hot';break;
    case 'casting':btn.textContent='⏳';btn.className='wait';break;
    case 'waiting':btn.textContent='⏳ Ждём';btn.className='wait';break;
    case 'bite':btn.textContent='❗ ПОДСЕКАЙ!';btn.className='hot';break;
    case 'hooked':btn.textContent=S.holding?'🔴 ДЕРЖИ':'💪 ТЯНИ!';btn.className='pull';break;
    case 'result':btn.textContent='➡️ ДАЛЬШЕ';break;
  }
}

function press(){
  A.init();
  if(S.phase==='explore'){
    if(!startFishing())return;
  }else if(S.phase==='bite'){
    hookFish();
  }else if(S.phase==='hooked'){
    S.holding=true;
  }else if(S.phase==='result'){
    S.phase='explore';S.curFish=null;S.holding=false;S.targetWater=null;
    setPlayerAnim('idle');
    save();
  }
  updateBtn();
}
function release(){
  if(S.phase==='charging')doCast();
  else if(S.phase==='hooked')S.holding=false;
  updateBtn();
}

btn.addEventListener('pointerup',e=>{e.preventDefault();release()});

let stepSoundT=0;
function update(dt){
  S.time+=dt;S.t+=dt;S.playerAnimT+=dt;S.blinkT+=dt;
  if(S.blinkT>3.5)S.blinkT=0;

  P.dayTime+=dt/180;
  if(P.dayTime>=1){
    P.dayTime-=1;P.day++;
    if(Math.random()<0.4){
      const roll=Math.random();
      let nw='clear';
      if(roll<0.15)nw='storm';
      else if(roll<0.4)nw='rain';
      else if(roll<0.65)nw='cloudy';
      if(nw!==P.weather){P.weather=nw;addLog(`${WEATHERS[nw].icon}`,'#7a88ac')}
    }
  }
  if(P.weather==='storm'&&Math.random()<0.008){S.lightning=0.9;setTimeout(()=>{S.lightning=0},120)}
  if(S.lightning>0)S.lightning-=dt*8;
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*22);
  if(S.dartFlash>0)S.dartFlash=Math.max(0,S.dartFlash-dt*3);
  for(let i=S.particles.length-1;i>=0;i--){
    const p=S.particles[i];
    p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;
    if(p.t>=p.life)S.particles.splice(i,1);
  }

  if(S.phase==='explore'&&P.mode==='world'){
    let dx=0,dy=0;
    if(dirs.left)dx-=1;
    if(dirs.right)dx+=1;
    if(dirs.up)dy-=1;
    if(dirs.down)dy+=1;
    if(dx!==0||dy!==0){
      const len=Math.hypot(dx,dy);dx/=len;dy/=len;
      const onWater=isPlayerOnWater();
      const spd=player.speed*dt*(onWater?0.65:1);
      const nx=player.x+dx*spd,ny=player.y+dy*spd;
      if(!collides(nx,player.y))player.x=nx;
      if(!collides(player.x,ny))player.y=ny;
      if(Math.abs(dx)>Math.abs(dy))player.dir=dx<0?'left':'right';
      else player.dir=dy<0?'up':'down';
      player.moving=true;player.anim+=dt*10;
      if(S.playerAnim==='idle'||S.playerAnim==='walk')setPlayerAnim('walk');
      stepSoundT+=dt;
      if(stepSoundT>0.3){A.step();stepSoundT=0}
    }else{
      player.moving=false;
      if(S.playerAnim==='walk')setPlayerAnim('idle');
    }
  }

  switch(S.phase){
    case 'charging':
      // ⚡ Растёт до 100% и замирает
      if(S.power<1)S.power=Math.min(1,S.power+dt/1.0);
      break;
    case 'casting':
      S.castT+=dt/0.25;
      if(S.castT>=1){
        startWaiting();
        const wx=P.mode==='world'?S.bobberWorld.x:S.classicBobberX;
        const wy=P.mode==='world'?S.bobberWorld.y:S.classicBobberY;
        for(let i=0;i<8;i++){S.particles.push({x:wx,y:wy,vx:rnd(-40,40),vy:rnd(-60,-15),life:rnd(0.4,0.8),t:0,c:'#a8e4ff',size:1})}
        A.splash();updateBtn();
      }
      break;
    case 'waiting':
      if(S.t>=S.waitTime)triggerBite();
      break;
    case 'bite':
      S.biteT+=dt;
      if(S.biteT>=S.biteWin){
        S.biteT=0;S.biteWin=2.0;S.waitTime=rnd(0.5,1.2);
        A.fail();S.phase='waiting';S.t=0;
        updateBtn();
      }
      break;
    case 'hooked':{
      const f=S.curFish;
      const strength=f.str*rod().str;
      if(S.holding){
        S.progress+=25*dt;
        S.tension+=(2+S.progress*0.05)*strength*dt;
        if(Math.random()<0.15)A.reel();
      }else{
        S.progress-=3*dt;
        S.tension-=30*dt;
      }
      S.tension=clamp(S.tension,0,100);
      S.progress=clamp(S.progress,0,100);
      if(S.t>S.nextDart){
        const dartChance=1-(S.progress/100)*0.5;
        if(Math.random()<dartChance*0.7){
          S.tension+=15+Math.random()*20*strength;
          S.dartFlash=0.8;A.dart();vibrate(40);
        }
        S.nextDart=S.t+rnd(1.2,2.4);
      }
      if(S.progress>=100)catchFish();
      else if(S.tension>=100)snapLine();
      break;
    }
    case 'result':
      if(S.t>=2.4){
        S.phase='explore';S.curFish=null;S.holding=false;S.targetWater=null;
        setPlayerAnim('idle');
        updateBtn();
      }
      break;
  }
  updateCamera();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  update(dt);render();
  requestAnimationFrame(loop);
}

// ============ UI ============
let activeTab='map';
const panel=document.getElementById('panel');
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');activeTab=t.dataset.tab;renderPanel();
  });
});

function renderPanel(){
  if(document.activeElement&&document.activeElement.id==='nameInput')return;
  panel.innerHTML='';
  switch(activeTab){
    case 'map':renderMap();break;
    case 'gear':renderGear();break;
    case 'journal':renderJournal();break;
    case 'ach':renderAchievements();break;
    case 'hero':renderHero();break;
  }
}

function renderMap(){
  const info=document.createElement('div');
  info.style.cssText='color:#6a9a90;font-size:10px;padding:3px 4px;margin-bottom:3px;';
  info.textContent=P.mode==='world'?'🗺️ Подойди к воде и рыбачь!':'🎣 Выбери зону и забрось!';
  panel.appendChild(info);
  ZONES.forEach((z,i)=>{
    const visited=P.visited[i],locked=z.lvl>P.level;
    const isSelected=P.mode==='classic'&&P.zone===i;
    const div=document.createElement('div');
    div.className='item'+(locked?' locked':'')+(isSelected?' sel':'');
    div.innerHTML=`<span>${visited?'✅':'📍'} ${z.n}<span class="sub">ур.${z.lvl} · ${z.pool.length} рыб</span></span>`;
    if(P.mode==='classic'&&!locked){
      div.onclick=()=>{P.zone=i;save();updateUI();vibrate(15)};
    }else div.style.cursor='default';
    panel.appendChild(div);
  });
}

function renderGear(){
  const l1=document.createElement('div');l1.className='custom-label';l1.textContent='Удочки';panel.appendChild(l1);
  RODS.forEach((r,i)=>{
    const owned=i<=P.rod,canBuy=i===P.rod+1&&P.gold>=r.cost;
    const div=document.createElement('div');
    div.className='item'+(owned?' owned':'')+(!owned&&!canBuy?' locked':'');
    div.innerHTML=`<span>${owned?'✅':'🛒'} ${r.n}<span class="sub">зона ${Math.round(r.zone*100)}% · удача +${Math.round(r.luck*100)}%</span></span><span class="price">${owned?(i===P.rod?'✓':'куп'):r.cost.toLocaleString('ru-RU')+'🪙'}</span>`;
    if(canBuy){
      div.onclick=()=>{P.gold-=r.cost;P.rod=i;A.coin();save();updateUI();addLog(`🛒 ${r.n}`,'#ffc94a');showToast(`🛒 ${r.n}!`,'gold');vibrate(30)};
    }
    panel.appendChild(div);
  });
  const lBoat=document.createElement('div');lBoat.className='custom-label';lBoat.textContent='Лодка';panel.appendChild(lBoat);
  if(!P.boat.owned){
    const div=document.createElement('div');
    const canBuy=P.gold>=500;
    div.className='item'+(canBuy?'':' locked');
    div.innerHTML=`<span>🛶 Лодка<span class="sub">Плавать · +10% удача</span></span><span class="price">500🪙</span>`;
    if(canBuy){
      div.onclick=()=>{if(P.gold<500)return;P.gold-=500;P.boat.owned=true;A.coin();save();updateUI();addLog('🛶 Куплена лодка!','#4aa8ff');showToast('🛶 Лодка!','gold');vibrate(50);checkAchievements()};
    }
    panel.appendChild(div);
  }else{
    const div=document.createElement('div');
    div.className='item owned';
    div.innerHTML=`<span>✅ Лодка<span class="sub">Собственность</span></span><span class="price">✓</span>`;
    panel.appendChild(div);
  }
  const l2=document.createElement('div');l2.className='custom-label';l2.textContent='Приманки';panel.appendChild(l2);
  BAITS.forEach(b=>{
    const cnt=b.id==='worm'?'∞':(P.bait[b.id]||0);
    const isActive=P.activeBait===b.id;
    const div=document.createElement('div');
    div.className='item'+(isActive?' sel':'')+(cnt===0&&b.id!=='worm'?' locked':'');
    div.innerHTML=`<span>${isActive?'⭐':'🪱'} ${b.n}<span class="sub">${b.desc} · ${cnt}</span></span><span class="price">${b.cost>0?b.cost+'🪙':'—'}</span>`;
    div.onclick=()=>{if(b.id!=='worm'&&(P.bait[b.id]||0)<=0)return;P.activeBait=b.id;save();updateUI();vibrate(15)};
    panel.appendChild(div);
  });
  const l3=document.createElement('div');l3.className='custom-label';l3.textContent='Купить приманки';panel.appendChild(l3);
  BAITS.forEach(b=>{
    if(b.cost<=0)return;
    const bb=document.createElement('button');
    bb.className='shopbtn';bb.textContent=`+1 ${b.n} (${b.cost}🪙)`;
    bb.disabled=P.gold<b.cost;
    bb.onclick=()=>{if(P.gold<b.cost)return;P.gold-=b.cost;P.bait[b.id]=(P.bait[b.id]||0)+1;A.coin();save();updateUI();vibrate(20)};
    panel.appendChild(bb);
  });
}

function renderJournal(){
  const caught=Object.keys(P.journal);
  if(caught.length===0){panel.innerHTML='<div style="color:#4a5570;font-size:10px;padding:8px;text-align:center;">Пусто. Поймай рыбу!</div>';return}
  const h=document.createElement('div');
  h.style.cssText='color:#7a88ac;font-size:9px;padding:3px 6px;';
  h.textContent=`ПОЙМАНО ${caught.length} / ${Object.keys(FISH).length}`;
  panel.appendChild(h);
  Object.keys(FISH).sort((a,b)=>FISH[a].r-FISH[b].r).forEach(name=>{
    const f=FISH[name],cnt=P.journal[name]||0;
    if(cnt===0)return;
    const div=document.createElement('div');
    div.className='item rar'+f.r;div.style.cursor='default';
    div.innerHTML=`<span>${f.n}<span class="sub">${RARITY[f.r].n} · ${f.v}🪙</span></span><span class="price">×${cnt}</span>`;
    panel.appendChild(div);
  });
}

function renderAchievements(){
  const earned=Object.values(P.achievements).filter(Boolean).length;
  const h=document.createElement('div');
  h.style.cssText='color:#7a88ac;font-size:9px;padding:3px 6px;';
  h.textContent=`НАГРАДЫ ${earned} / ${ACHIEVEMENTS.length}`;
  panel.appendChild(h);
  ACHIEVEMENTS.forEach(a=>{
    const done=!!P.achievements[a.id];
    const div=document.createElement('div');
    div.className='item'+(done?' owned':'');div.style.cursor='default';
    div.innerHTML=`<span>${done?'🏆':'🔒'} ${a.n}<span class="sub">${a.desc}</span></span><span class="price">${done?'✓':'—'}</span>`;
    panel.appendChild(div);
  });
}

function renderHero(){
  if(!P.custom)P.custom={name:'Рыбак',skin:1,shirt:0,hat:1,sweater:0};
  const l0=document.createElement('div');l0.className='custom-label';l0.textContent='Имя';panel.appendChild(l0);
  const inp=document.createElement('input');
  inp.id='nameInput';inp.maxLength=14;inp.value=P.custom.name||'Рыбак';
  let t=null;
  inp.oninput=()=>{P.custom.name=(inp.value||'Рыбак').slice(0,14);document.getElementById('nameTag').textContent=P.custom.name;clearTimeout(t);t=setTimeout(save,400)};
  inp.onblur=save;
  panel.appendChild(inp);
  const l1=document.createElement('div');l1.className='custom-label';l1.textContent='Кожа';panel.appendChild(l1);
  const r1=document.createElement('div');r1.className='custom-row';
  SKINS.forEach((s,i)=>{
    const o=document.createElement('div');
    o.className='custom-opt'+(P.custom.skin===i?' active':'');
    o.innerHTML=`<span class="swatch" style="background:${s.c}"></span>${s.n}`;
    o.onclick=()=>{P.custom.skin=i;save();renderPanel()};
    r1.appendChild(o);
  });
  panel.appendChild(r1);
  const l2=document.createElement('div');l2.className='custom-label';l2.textContent='Рубашка';panel.appendChild(l2);
  const r2=document.createElement('div');r2.className='custom-row';
  SHIRTS.forEach((s,i)=>{
    const o=document.createElement('div');
    o.className='custom-opt'+(P.custom.shirt===i?' active':'');
    o.innerHTML=`<span class="swatch" style="background:${s.c}"></span>${s.n}`;
    o.onclick=()=>{P.custom.shirt=i;save();renderPanel()};
    r2.appendChild(o);
  });
  panel.appendChild(r2);
  const l3=document.createElement('div');l3.className='custom-label';l3.textContent='Головной убор';panel.appendChild(l3);
  const r3=document.createElement('div');r3.className='custom-row';
  HATS.forEach((h,i)=>{
    const o=document.createElement('div');
    o.className='custom-opt'+(P.custom.hat===i?' active':'');
    o.textContent=h.n;
    o.onclick=()=>{P.custom.hat=i;save();renderPanel()};
    r3.appendChild(o);
  });
  panel.appendChild(r3);
  const l4=document.createElement('div');l4.className='custom-label';l4.textContent='Свитер';panel.appendChild(l4);
  const r4=document.createElement('div');r4.className='custom-row';
  SWEATERS.forEach((s,i)=>{
    const o=document.createElement('div');
    o.className='custom-opt'+(P.custom.sweater===i?' active':'');
    if(s.c)o.innerHTML=`<span class="swatch" style="background:${s.c}"></span>${s.n}`;
    else o.textContent=s.n;
    o.onclick=()=>{P.custom.sweater=i;save();renderPanel()};
    r4.appendChild(o);
  });
  panel.appendChild(r4);
  const l5=document.createElement('div');l5.className='custom-label';l5.textContent='Инвентарь';panel.appendChild(l5);
  let total=0,cnt=0;
  Object.entries(P.inv).forEach(([name,c])=>{
    const f=Object.values(FISH).find(x=>x.n===name);
    if(f){total+=f.v*c;cnt+=c}
  });
  const sb=document.createElement('button');
  sb.className='shopbtn';sb.style.borderColor='#2a7a4a';sb.style.background='#0a2a1a';sb.style.color='#5ddc6a';
  sb.textContent=total>0?`💰 ПРОДАТЬ (${cnt} · ${total.toLocaleString('ru-RU')}🪙)`:'Пусто';
  sb.disabled=total<=0;
  sb.onclick=()=>{if(total<=0)return;P.gold+=total;P.inv={};A.coin();save();updateUI();addLog(`💰 +${total.toLocaleString('ru-RU')}🪙`,'#ffc94a');vibrate(30)};
  panel.appendChild(sb);
  const rb=document.createElement('button');
  rb.id='resetBtn';rb.textContent='⚠️ СБРОС';
  rb.onclick=()=>{if(confirm('Сбросить прогресс?')){try{localStorage.removeItem(KEY);for(const k of OLD_KEYS)localStorage.removeItem(k)}catch(e){}location.reload()}};
  panel.appendChild(rb);
}

function updateUI(){
  document.getElementById('lvl').textContent=P.level;
  document.getElementById('gold').textContent=P.gold.toLocaleString('ru-RU');
  document.getElementById('nameTag').textContent=(P.custom&&P.custom.name)||'Рыбак';
  const need=xpNeed(P.level),pct=Math.min(100,(P.xp/need)*100);
  document.getElementById('xpfill').style.width=pct+'%';
  document.getElementById('xptxt').textContent=`${P.xp}/${need}`;
  const w=WEATHERS[P.weather]||WEATHERS.clear;
  document.getElementById('weather').textContent=w.icon;
  document.getElementById('modeBtn').textContent=P.mode==='world'?'🌍':'🎣';
  document.getElementById('dpad').classList.toggle('hidden',P.mode!=='world');
  renderPanel();
}

load();
updateCamera();updateBtn();updateUI();
addLog('🎣 Рыбалка RPG v7.4','#4aa8ff');
if(!storageOk)addLog('⚠️ Сохранение недоступно!','#e05050');
else addLog('💾 Автосохранение включено','#5ddc6a');
addLog('⚡ Быстрая подсечка = редкая рыба!','#ffc94a');

setInterval(save,15000);
window.addEventListener('beforeunload',save);
requestAnimationFrame(loop);

}catch(err){
  const el=document.getElementById('err');
  el.style.display='block';
  el.textContent='💥 '+err.message+' | '+(err.stack||'').split('\n')[0];
  console.error(err);
}
</script>
