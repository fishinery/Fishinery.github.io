<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>🎣 Рыбалка RPG v8.0</title>
<style>
:root{--panel:#10403a;--panel2:#186158;--line:#2ea88a;--lt:#4dd8b8;--txt:#d8f8f0;--dim:#6a9a90;--gold:#ffd45e;--acc:#20b2aa;--acc2:#4dd0e1;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;}
body{background:radial-gradient(circle at 50% -10%,#144a42,#0a2622 40%,#061612);color:var(--txt);font-family:'Comic Sans MS','Comic Sans',cursive;display:flex;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:manipulation;}
.wrap{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;gap:4px;padding:4px;overflow-y:auto;}
header{display:flex;align-items:center;gap:4px;background:linear-gradient(135deg,#186158,#10403a);border:2px solid var(--line);border-radius:10px;padding:5px 7px;box-shadow:0 3px 0 #0006,0 0 15px #2ea88a33;flex-shrink:0;flex-wrap:nowrap;}
.badge{background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:bold;font-size:11px;white-space:nowrap;}
.badge b{color:var(--acc2);}
#nameTag{color:var(--gold);font-size:11px;max-width:55px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.xpwrap{flex:1;position:relative;height:14px;background:#041410;border:2px solid var(--line);border-radius:6px;overflow:hidden;min-width:30px;}
.xpfill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,#0e8a5a,#4dd8a0,#0e8a5a);background-size:200% 100%;transition:width .4s;animation:xps 2s linear infinite;}
@keyframes xps{0%{background-position:0%}100%{background-position:200%}}
.xptxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:bold;text-shadow:0 1px 2px #000;}
.gold{color:var(--gold);}
#saveBtn,#modeBtn,#musicBtn{border:2px solid var(--line);border-radius:6px;padding:1px 6px;color:#fff;font-size:10px;font-weight:bold;cursor:pointer;font-family:inherit;flex-shrink:0;background:linear-gradient(180deg,#20b2aa,#0e8a5a);}
#saveBtn{background:linear-gradient(180deg,#4dd8a0,#0e8a5a);}
#musicBtn{background:linear-gradient(180deg,#b06bff,#5a2a9a);}
#saveBtn:hover,#modeBtn:hover,#musicBtn:hover{filter:brightness(1.2);}
.stage{position:relative;width:min(100%,calc(55vh*16/9));margin:0 auto;flex-shrink:0;border:3px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 4px 0 #0006,0 0 25px #2ea88a44;background:#000;}
.stage::before{content:'';display:block;padding-top:56.25%;}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;image-rendering:pixelated;}
#viewBtn{position:absolute;top:4px;right:4px;width:38px;height:28px;background:linear-gradient(180deg,#4dd0e1,#20b2aa);border:2px solid var(--lt);border-radius:8px;color:#fff;font-size:12px;font-weight:bold;cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0;}
.dpad{position:absolute;bottom:4px;left:4px;width:96px;height:96px;pointer-events:none;z-index:10;}
.dpad.hidden{display:none;}
.dbtn{position:absolute;width:30px;height:30px;background:rgba(77,208,225,0.5);border:2px solid var(--lt);border-radius:8px;color:#fff;font-size:13px;font-weight:bold;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0;margin:0;font-family:inherit;user-select:none;}
.dbtn.pressed{background:rgba(77,208,225,0.9);transform:scale(0.9);}
.d-up{top:0;left:33px;}.d-down{top:66px;left:33px;}.d-left{top:33px;left:0;}.d-right{top:33px;left:66px;}
#action{width:100%;padding:12px;font-family:inherit;font-size:14px;font-weight:bold;color:#041410;cursor:pointer;border:none;border-radius:12px;background:linear-gradient(180deg,#4dd8a0,#0e8a5a);box-shadow:0 5px 0 #054735,0 0 20px #4dd8a066;touch-action:none;min-height:48px;flex-shrink:0;}
#action:active{transform:translateY(3px);box-shadow:0 2px 0 #054735;}
#action.wait{background:linear-gradient(180deg,#5a8888,#3a5c5c);color:#d8f8f0;box-shadow:0 5px 0 #1a2c2c;}
#action.hot{background:linear-gradient(180deg,#ffd45e,#e09a1a);box-shadow:0 5px 0 #8a5c0a,0 0 25px #ffd45e88;animation:pulseHot .35s infinite alternate;}
#action.pull{background:linear-gradient(180deg,#4dd0e1,#20b2aa);color:#041410;box-shadow:0 5px 0 #0e5a5c,0 0 20px #4dd0e188;}
#action.locked{background:linear-gradient(180deg,#5a3030,#3a2020);color:#d8a0a0;}
@keyframes pulseHot{from{filter:brightness(1);}to{filter:brightness(1.3);}}
.tabs{display:flex;gap:3px;flex-shrink:0;}
.tab{flex:1;padding:6px 2px;font-family:inherit;font-size:9px;font-weight:bold;color:var(--dim);background:linear-gradient(180deg,#186158,#10403a);border:2px solid var(--line);border-radius:8px;cursor:pointer;text-transform:uppercase;transition:.2s;}
.tab.active{background:linear-gradient(180deg,#4dd0e1,#20b2aa);color:#041410;border-color:var(--lt);box-shadow:0 0 15px #4dd0e1aa;}
.panelarea{flex:1;overflow-y:auto;min-height:60px;background:linear-gradient(180deg,#10403a,#0a2622);border:2px solid var(--line);border-radius:10px;padding:6px;}
.panelarea::-webkit-scrollbar{width:5px;}.panelarea::-webkit-scrollbar-thumb{background:var(--acc);border-radius:3px;}
.item{display:flex;justify-content:space-between;align-items:center;gap:5px;padding:6px 8px;margin-bottom:3px;border-radius:8px;font-size:11px;background:linear-gradient(135deg,#186158,#10403a);border:2px solid transparent;cursor:pointer;min-height:28px;}
.item:hover{border-color:var(--lt);}
.item.sel{border-color:var(--lt);background:linear-gradient(135deg,#20b2aa,#186158);}
.item.locked{opacity:.4;cursor:not-allowed;}
.item.owned{background:linear-gradient(135deg,#0e8a5a,#0a5a3a);border-color:#4dd8a0;cursor:default;}
.item .sub{font-size:9px;color:var(--dim);display:block;margin-top:1px;}
.item .price{color:var(--gold);font-weight:bold;font-size:10px;white-space:nowrap;}
.item.rar0{color:#9aa4b0}.item.rar1{color:#5de0a2}.item.rar2{color:#5de0d2}
.item.rar3{color:#b06bff}.item.rar4{color:#ffd45e}.item.rar5{color:#ff3b6b}.item.rar6{color:#ff0066}
.shopbtn{width:100%;padding:7px;margin-top:3px;font-family:inherit;font-size:10px;font-weight:bold;cursor:pointer;border:2px solid var(--line);border-radius:8px;background:linear-gradient(180deg,#20b2aa,#0e8a5a);color:#041410;}
.shopbtn:disabled{opacity:.35;cursor:not-allowed;}
.custom-row{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;}
.custom-opt{padding:5px 8px;background:linear-gradient(135deg,#186158,#10403a);border:2px solid var(--line);border-radius:8px;cursor:pointer;font-size:10px;font-weight:bold;color:var(--txt);display:flex;align-items:center;gap:4px;}
.custom-opt.active{background:linear-gradient(135deg,#4dd0e1,#20b2aa);color:#041410;border-color:var(--lt);}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid #0005;}
.custom-label{font-size:10px;color:var(--acc2);text-transform:uppercase;letter-spacing:1px;margin:6px 0 3px;border-bottom:1px solid var(--line);padding-bottom:2px;}
#nameInput{width:100%;padding:7px;font-family:inherit;font-size:12px;background:#041410;border:2px solid var(--line);border-radius:8px;color:var(--txt);margin-bottom:5px;}
#nameInput:focus{outline:none;border-color:var(--lt);}
#resetBtn{width:100%;padding:7px;margin-top:8px;font-family:inherit;font-size:10px;font-weight:bold;cursor:pointer;border:2px solid #8a2020;border-radius:8px;background:#3a0a0a;color:#e05050;}
#log{background:#041410;border:2px solid var(--line);border-radius:10px;padding:5px 7px;font-size:9px;height:45px;overflow-y:auto;line-height:1.5;flex-shrink:0;}
#log::-webkit-scrollbar{width:4px;}#log::-webkit-scrollbar-thumb{background:var(--acc);border-radius:2px;}
#toasts{position:fixed;top:65px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:100%;max-width:340px;padding:0 10px;}
.toast{background:linear-gradient(135deg,#20b2aa,#0e8a5a);border:2px solid var(--lt);border-radius:10px;padding:8px 12px;font-size:11px;font-weight:bold;color:#041410;box-shadow:0 4px 15px #0009;animation:ti .4s cubic-bezier(.34,1.56,.64,1),to .4s 2.4s forwards;text-align:center;}
.toast.gold{background:linear-gradient(135deg,#ffd45e,#e09a1a);color:#041410;}
.toast.success{background:linear-gradient(135deg,#4dd8a0,#0e8a5a);}
.toast.danger{background:linear-gradient(135deg,#e05050,#8a2020);color:#fff;}
.toast.mystic{background:linear-gradient(135deg,#6a4ac9,#2a1a5a);border-color:#b06bff;color:#e8d8ff;}
@keyframes ti{from{opacity:0;transform:translateY(-30px) scale(.6);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes to{to{opacity:0;transform:translateY(-15px) scale(.9);}}
.floattext{position:absolute;pointer-events:none;font-weight:bold;font-size:12px;animation:fu 1.3s ease-out forwards;text-shadow:2px 2px 0 #000,0 0 8px currentColor;transform:translate(-50%,-50%);font-family:'Comic Sans MS',cursive;}
@keyframes fu{0%{opacity:1;transform:translate(-50%,-50%) scale(.5);}30%{transform:translate(-50%,-50%) scale(1.3);}100%{opacity:0;transform:translate(-50%,-200%) scale(1);}}
#err{position:fixed;bottom:0;left:0;right:0;background:#8a2020;color:#fff;padding:8px;font-size:10px;z-index:9999;font-family:monospace;display:none;}
@media (max-height:520px){#log{height:28px;}.panelarea{min-height:40px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">Ур.<b id="lvl">1</b></div>
    <div id="nameTag">Рыбак</div>
    <div class="xpwrap"><div class="xpfill" id="xpfill"></div><div class="xptxt" id="xptxt">0/40</div></div>
    <div class="badge gold">🪙<b id="gold">0</b></div>
    <div class="badge" id="weather">☀️</div>
    <button id="musicBtn" title="Музыка">🎵</button>
    <button id="saveBtn" title="Сохранить">💾</button>
    <button id="modeBtn">🌍</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="scene"></canvas>
    <button id="viewBtn" title="Вид">👁️</button>
    <div class="dpad" id="dpad">
      <button class="dbtn d-up" data-dir="up">▲</button>
      <button class="dbtn d-left" data-dir="left">◀</button>
      <button class="dbtn d-right" data-dir="right">▶</button>
      <button class="dbtn d-down" data-dir="down">▼</button>
    </div>
  </div>
  <button id="action">🎣 Забросить</button>
  <div class="tabs">
    <button class="tab active" data-tab="map">🗺️ Мир</button>
    <button class="tab" data-tab="gear">🎣 Снасти</button>
    <button class="tab" data-tab="journal">📖 0/60</button>
    <button class="tab" data-tab="ach">🏆 Награды</button>
    <button class="tab" data-tab="hero">🎨 Герой</button>
  </div>
  <div class="panelarea" id="panel"></div>
  <div id="log"></div>
</div>
<div id="toasts"></div>
<div id="err"></div>

<script>
window.addEventListener('error', e=>{
  const el = document.getElementById('err');
  el.style.display='block';
  el.textContent='⚠️ '+e.message+' @ '+(e.filename||'').split('/').pop()+':'+e.lineno;
});

try {

/* ========== АУДИО + МУЗЫКА ========== */
const A=(()=>{let ctx=null;
  const init=()=>{if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended')ctx.resume()};
  const tone=(f,d,t='sine',v=0.1)=>{if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);const n=ctx.currentTime;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.001,n+d);o.start(n);o.stop(n+d)};
  return{init,
    splash(){if(!ctx)return;const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.35),ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=900;const g=ctx.createGain();g.gain.value=0.18;s.connect(f).connect(g).connect(ctx.destination);s.start()},
    bite(){tone(880,0.15,'square',0.18);setTimeout(()=>tone(1300,0.12,'square',0.15),80);setTimeout(()=>tone(1600,0.12,'square',0.13),160)},
    cast(){tone(180,0.18,'sine',0.12);setTimeout(()=>tone(140,0.2,'sine',0.08),90)},
    catchIt(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.13),i*70))},
    fail(){tone(220,0.25,'sawtooth',0.08)},
    coin(){tone(1200,0.07,'sine',0.09);setTimeout(()=>tone(1600,0.07,'sine',0.09),50)},
    levelup(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.28,'triangle',0.15),i*95))},
    reel(){tone(380+Math.random()*250,0.04,'sine',0.025)},
    dart(){tone(300,0.12,'sawtooth',0.08)},
    snap(){tone(200,0.3,'sawtooth',0.15);setTimeout(()=>tone(150,0.4,'sawtooth',0.12),80)},
    step(){tone(120+Math.random()*40,0.05,'sine',0.02)},
    oar(){tone(150+Math.random()*30,0.15,'sine',0.05)},
    achieve(){[659,784,1047,1319,1568].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'triangle',0.15),i*80))},
    switch(){tone(600,0.08,'triangle',0.12);setTimeout(()=>tone(900,0.1,'triangle',0.1),70)},
    save(){tone(1400,0.05,'sine',0.08);setTimeout(()=>tone(1800,0.05,'sine',0.06),60)},
  };
})();
const vibrate=p=>{if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};

/* ========== ФОНОВАЯ МУЗЫКА ========== */
const Music = (()=>{
  let ctx=null, current=null, gain=null, enabled=true;
  const SCALES={
    // Пруд — мажорная, веселая
    pond:[262,294,330,349,392,440,494,523],
    // Река — быстрая пентатоника
    river:[262,294,330,392,440,523,587,659],
    // Озеро — минор
    lake:[220,247,262,294,330,349,392,440],
    // Болото — тритоны
    swamp:[196,208,233,262,277,311,349,392],
    // Море — эпичная
    sea:[196,220,262,294,330,392,440,523],
    // Лёд — высокие
    ice:[392,440,494,523,587,659,784,880],
    // Бездна — низкая
    abyss:[110,123,131,147,165,175,196,220],
    // Вулкан — напряжённая
    volcano:[147,165,175,196,220,247,262,294],
    // Заброшенное озеро — грустное пианино, минор
    abandoned:[262,277,294,311,349,370,415,466],
  };
  const TEMPOS={pond:400,river:300,lake:500,swamp:600,sea:450,ice:400,abyss:700,volcano:350,abandoned:800};
  const styles={pond:'bright',river:'fast',lake:'calm',swamp:'dark',sea:'epic',ice:'crystal',abyss:'deep',volcano:'tense',abandoned:'sad'};
  
  function playNote(freq, dur, vol=0.04, type='triangle'){
    if(!ctx || !enabled) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    o.connect(g); g.connect(gain); g.connect(ctx.destination);
    const t=ctx.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.start(t); o.stop(t+dur);
  }
  
  function scheduleNote(zoneKey, step){
    const scale = SCALES[zoneKey];
    if(!scale) return;
    const style = styles[zoneKey];
    const idx = Math.floor(Math.random()*scale.length);
    const freq = scale[idx];
    
    if(style==='sad'){
      // Медленные длинные ноты пианино (треугольная волна ближе к пианино)
      playNote(freq, 1.6, 0.05, 'triangle');
      // Иногда аккорд
      if(Math.random()<0.3) playNote(freq*1.5, 1.2, 0.03, 'sine');
    } else if(style==='bright'){
      playNote(freq, 0.6, 0.04, 'triangle');
    } else if(style==='fast'){
      playNote(freq, 0.35, 0.03, 'square');
    } else if(style==='calm'){
      playNote(freq, 0.8, 0.04, 'sine');
    } else if(style==='dark'){
      playNote(freq*0.5, 1.0, 0.05, 'sawtooth');
    } else if(style==='epic'){
      playNote(freq, 0.5, 0.05, 'triangle');
      if(Math.random()<0.4) playNote(freq*2, 0.4, 0.02, 'sine');
    } else if(style==='crystal'){
      playNote(freq, 0.5, 0.03, 'sine');
      playNote(freq*2, 0.3, 0.02, 'sine');
    } else if(style==='deep'){
      playNote(freq, 1.2, 0.06, 'sine');
    } else if(style==='tense'){
      playNote(freq, 0.3, 0.04, 'sawtooth');
    }
  }
  
  function start(zoneKey){
    if(!ctx){
      try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
    }
    if(ctx.state==='suspended') ctx.resume();
    if(current){
      clearInterval(current.timer);
      current=null;
    }
    if(!enabled) return;
    gain = ctx.createGain();
    gain.gain.value = 0.5;
    
    const tempo = TEMPOS[zoneKey] || 500;
    let step = 0;
    const timer = setInterval(()=>{
      if(!enabled) return;
      scheduleNote(zoneKey, step);
      // Иногда добавляем бас
      if(step % 8 === 0 && zoneKey==='abandoned'){
        const scale=SCALES[zoneKey];
        playNote(scale[0]*0.5, 2.0, 0.04, 'sine');
      }
      step++;
    }, tempo);
    current = {zoneKey, timer};
  }
  
  function stop(){
    if(current){
      clearInterval(current.timer);
      current=null;
    }
  }
  
  function toggle(){
    enabled = !enabled;
    if(enabled && current){
      const zk = current.zoneKey;
      stop();
      start(zk);
    } else if(!enabled){
      stop();
    }
    return enabled;
  }
  
  function setEnabled(v){
    enabled = v;
  }
  
  function isEnabled(){ return enabled; }
  
  return { start, stop, toggle, setEnabled, isEnabled };
})();

/* ========== ДАННЫЕ ========== */
const RARITY=[{n:'Обычная',c:'#9aa4b0'},{n:'Необычная',c:'#5ddc6a'},{n:'Редкая',c:'#4aa8ff'},{n:'Эпическая',c:'#b06bff'},{n:'Легендарная',c:'#ffb020'},{n:'Мифическая',c:'#ff3b6b'},{n:'Божественная',c:'#ff0066'}];

const FISH={
  // Обычные
  plotva:{n:'Плотва',r:0,w:42,v:4,x:3,str:1,shape:'slim',time:['day'],weather:['clear','rain','cloudy'],c:{body:'#b9c4cf',belly:'#e8eef4',fin:'#7d8b9a'}},
  karas:{n:'Карась',r:0,w:36,v:7,x:5,str:1.2,shape:'round',time:['day','dawn','dusk'],weather:['any'],c:{body:'#c8a24a',belly:'#e8cd82',fin:'#96762c'}},
  boot:{n:'Старый сапог',r:0,w:9,v:1,x:1,str:0.5,shape:'boot',time:['both'],weather:['any'],trash:true,c:{body:'#5a4632',belly:'#6f5940',fin:'#3d2f21'}},
  okun:{n:'Окунь',r:1,w:20,v:16,x:11,str:1.6,shape:'normal',time:['dawn','dusk'],weather:['clear','cloudy'],c:{body:'#4e8c5a',belly:'#c9d98a',fin:'#2f5c39'}},
  lin:{n:'Линь',r:1,w:14,v:24,x:15,str:1.8,shape:'round',time:['night'],weather:['any'],c:{body:'#6b7a3a',belly:'#a3b25e',fin:'#4a5626'}},
  peskar:{n:'Пескарь',r:0,w:30,v:9,x:6,str:1,shape:'slim',time:['day'],weather:['any'],c:{body:'#a8b0b8',belly:'#d8e0e8',fin:'#6a727a'}},
  shuka:{n:'Щука',r:2,w:6,v:58,x:32,str:2.8,shape:'pike',time:['dawn'],weather:['rain','storm','cloudy'],c:{body:'#5f7a4a',belly:'#c6da9e',fin:'#3c4f2e'}},

let map=[],_seed=42;
const sRand=()=>{_seed=(_seed*1664525+1013904223)>>>0;return _seed/4294967296};
const resetSeed=()=>{_seed=42};

const isWater=t=>t===T.POND||t===T.RIVER||t===T.LAKE||t===T.SWAMP||t===T.SEA||t===T.ICE||t===T.ABYSS||t===T.LAVA||t===T.ABANDONED;
const isLethalWater=t=>t===T.LAVA||t===T.ABYSS;
const isWalkable=t=>t===T.GRASS||t===T.PATH||t===T.TALL_GRASS||t===T.FLOWER||t===T.BEACH||t===T.PATH_STONE||t===T.SWAMP_GRASS||t===T.BRIDGE;
const waterToZone=t=>({[T.ABANDONED]:0,[T.POND]:1,[T.RIVER]:2,[T.LAKE]:3,[T.SWAMP]:4,[T.SEA]:5,[T.ICE]:6,[T.ABYSS]:7,[T.LAVA]:8}[t]);

function blob(cx,cy,rx,ry,tile,noise=0.35){
  for(let y=Math.floor(cy-ry-2);y<=cy+ry+2;y++)for(let x=Math.floor(cx-rx-2);x<=cx+rx+2;x++){
    if(x<1||x>=MAP_W-1||y<1||y>=MAP_H-1)continue;
    const nx=(x-cx)/rx,ny=(y-cy)/ry,d=Math.sqrt(nx*nx+ny*ny),ang=Math.atan2(ny,nx);
    const wob=1+Math.sin(ang*3+cx*0.7)*noise+Math.sin(ang*5+cy*0.5)*noise*0.6+Math.sin(ang*7)*noise*0.3;
    if(d<wob)map[y][x]=tile;
  }
}
function river(x0,y0,x1,y1,w,tile){
  const steps=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2;
  for(let i=0;i<=steps;i++){
    const t=i/steps,px=x0+(x1-x0)*t,py=y0+(y1-y0)*t,wob=Math.sin(t*Math.PI*4)*1.8;
    const wx=px+Math.cos(Math.PI/2)*wob,wy=py+Math.sin(Math.PI/2)*wob;
    for(let dy=-w;dy<=w;dy++)for(let dx=-w;dx<=w;dx++){
      if(dx*dx+dy*dy>w*w)continue;
      const tx=Math.round(wx+dx),ty=Math.round(wy+dy);
      if(tx<1||tx>=MAP_W-1||ty<1||ty>=MAP_H-1)continue;
      map[ty][tx]=tile;
    }
  }
}

function genWorld(){
  resetSeed();
  map=[];
  for(let y=0;y<MAP_H;y++){map[y]=[];for(let x=0;x<MAP_W;x++)map[y][x]=T.GRASS}
  
  // 🌍 Заброшенное озеро (сверху-слева, доступно с 0 ур.)
  abandonedCenter={x:9,y:7};
  blob(9,7,5,4,T.ABANDONED,0.5);
  
  // Домик Дэвида рядом с озером
  davidHouse={x:4,y:12};
  // Стены дома
  for(let y=12;y<=14;y++)for(let x=4;x<=7;x++)map[y][x]=T.DAVID_HOUSE;
  // Крыша
  for(let x=4;x<=7;x++)map[12][x]=T.DAVID_ROOF;
  // Дверь
  map[14][5]=T.DAVID_DOOR;
  
  // Дэвид стоит перед домом
  davidChar={x:6,y:15};
  
  // Тропинка от спавна к заброшенному озеру
  for(let y=15;y<=17;y++)map[y][6]=T.PATH;
  for(let x=6;x<=12;x++)map[15][x]=T.PATH;
  
  // ═══ ОСТАЛЬНЫЕ ВОДОЁМЫ ═══
  blob(20,7,5,4,T.POND,0.4);           // Пруд
  blob(33,6,6,4,T.ICE,0.3);            // Лёд
  blob(46,7,7,5,T.LAKE,0.35);          // Озеро
  blob(9,36,5,4,T.SWAMP,0.6);          // Болото
  blob(46,32,7,6,T.SEA,0.25);          // Море
  blob(46,40,4,3,T.ABYSS,0.4);         // Бездна
  blob(24,35,5,4,T.LAVA,0.4);          // Вулкан
  
  // Река через весь мир
  river(2,22,54,22,1,T.RIVER);
  
  // ═══ МЕЛКОВОДЬЕ И ПЛЯЖИ ═══
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    if(!isWater(map[y][x]))continue;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const ny=y+dy,nx=x+dx;
      if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W)continue;
      if(map[ny][nx]!==T.GRASS)continue;
      if(sRand()<0.6&&(map[y][x]===T.POND||map[y][x]===T.LAKE||map[y][x]===T.SEA))map[ny][nx]=T.SHALLOW;
    }
  }
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    if(map[y][x]!==T.GRASS)continue;
    let near=false;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const ny=y+dy,nx=x+dx;
      if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W)continue;
      if(map[ny][nx]===T.SEA||map[ny][nx]===T.LAKE){near=true;break}
    }
    if(near&&sRand()<0.7)map[y][x]=T.BEACH;
  }
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    if(map[y][x]!==T.GRASS)continue;
    let near=false;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const ny=y+dy,nx=x+dx;
      if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W)continue;
      if(map[ny][nx]===T.SWAMP){near=true;break}
    }
    if(near&&sRand()<0.7)map[y][x]=T.SWAMP_GRASS;
  }
  
  // ═══ ГОРОД ═══
  const houses=[{x:16,y:15,w:3,h:2},{x:20,y:15,w:3,h:2},{x:24,y:15,w:4,h:2},{x:29,y:15,w:3,h:2},{x:16,y:25,w:3,h:2},{x:20,y:25,w:3,h:2},{x:24,y:25,w:4,h:2}];
  houses.forEach(h=>{
    for(let y=h.y;y<h.y+h.h;y++)for(let x=h.x;x<h.x+h.w;x++)map[y][x]=T.HOUSE;
    for(let x=h.x;x<h.x+h.w;x++)map[h.y][x]=T.HOUSE_ROOF;
    map[h.y+h.h-1][h.x+Math.floor(h.w/2)]=T.DOOR;
    if(h.w>=3){map[h.y+1][h.x]=T.WINDOW;map[h.y+1][h.x+h.w-1]=T.WINDOW}
  });
  for(let y=17;y<=24;y++){map[y][18]=T.PATH_STONE;map[y][22]=T.PATH_STONE}
  for(let x=14;x<=34;x++){map[18][x]=T.PATH;map[24][x]=T.PATH}
  for(let x=12;x<=36;x++)map[21][x]=T.PATH_STONE;
  map[21][24]=T.WELL;
  map[20][22]=T.BENCH;map[20][26]=T.BENCH;
  map[19][17]=T.LAMP;map[19][33]=T.LAMP;
  map[23][17]=T.LAMP;map[23][33]=T.LAMP;
  map[18][15]=T.SIGN;map[18][29]=T.MAILBOX;map[26][28]=T.CAMPFIRE;
  
  // ═══ ДОРОЖКИ ═══
  for(let y=0;y<MAP_H;y++)if(isWalkable(map[y][24]))map[y][24]=T.PATH;
  for(let x=0;x<MAP_W;x++)if(isWalkable(map[21][x]))map[21][x]=T.PATH;
  
  // Дорожки к воде
  const conns=[[24,21,9,7],[24,21,20,7],[24,21,33,6],[24,21,46,7],[24,21,9,36],[24,21,46,32],[24,21,24,35],[24,21,46,40]];
  conns.forEach(c=>{
    const[x0,y0,x1,y1]=c,steps=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2;
    for(let i=0;i<=steps;i++){
      const t=i/steps,px=Math.round(x0+(x1-x0)*t),py=Math.round(y0+(y1-y0)*t);
      if(px<0||px>=MAP_W||py<0||py>=MAP_H)continue;
      const cur=map[py][px];
      if(cur===T.GRASS||cur===T.TALL_GRASS||cur===T.FLOWER||cur===T.BUSH)map[py][px]=T.PATH;
    }
  });
  
  // Мостики через реку
  for(let x=23;x<=25;x++){map[21][x]=T.BRIDGE;map[22][x]=T.BRIDGE;map[23][x]=T.BRIDGE}
  for(let x=15;x<=17;x++){map[21][x]=T.BRIDGE;map[22][x]=T.BRIDGE;map[23][x]=T.BRIDGE}
  for(let x=32;x<=34;x++){map[21][x]=T.BRIDGE;map[22][x]=T.BRIDGE;map[23][x]=T.BRIDGE}
  
  // ═══ ДЕКОР ═══
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    if(map[y][x]!==T.GRASS)continue;
    let nW=false,nP=false,nB=false;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const ny=y+dy,nx=x+dx;
      if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W)continue;
      const t=map[ny][nx];
      if(isWater(t)||t===T.SHALLOW||t===T.BEACH)nW=true;
      if(t===T.PATH||t===T.PATH_STONE)nP=true;
      if(t===T.HOUSE||t===T.HOUSE_ROOF||t===T.DOOR||t===T.WINDOW||t===T.DAVID_HOUSE)nB=true;
    }
    if(nW||nP||nB)continue;
    const r=sRand();
    if(r<0.05)map[y][x]=T.TREE;
    else if(r<0.10)map[y][x]=T.TALL_GRASS;
    else if(r<0.15)map[y][x]=T.FLOWER;
    else if(r<0.18)map[y][x]=T.BUSH;
    else if(r<0.19)map[y][x]=T.ROCK;
    else if(r<0.205)map[y][x]=T.STUMP;
  }
  
  // Биом-декор
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    if(map[y][x]!==T.GRASS&&map[y][x]!==T.BEACH&&map[y][x]!==T.SWAMP_GRASS)continue;
    let nS=false,nI=false,nSw=false,nL=false,nP=false,nLk=false,nA=false,nAb=false;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const ny=y+dy,nx=x+dx;
      if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W)continue;
      const tt=map[ny][nx];
      if(tt===T.SEA)nS=true;else if(tt===T.ICE)nI=true;
      else if(tt===T.SWAMP)nSw=true;else if(tt===T.LAVA)nL=true;
      else if(tt===T.POND)nP=true;else if(tt===T.LAKE)nLk=true;
      else if(tt===T.ABYSS)nA=true;else if(tt===T.ABANDONED)nAb=true;
    }
    const r=sRand();
    if(nS&&r<0.22){map[y][x]=T.PALM;continue}
    if(nI&&r<0.20){map[y][x]=sRand()<0.7?T.PINE:T.SNOW_PILE;continue}
    if(nSw&&r<0.22){map[y][x]=sRand()<0.6?T.DEAD_TREE:T.MUSHROOM;continue}
    if(nL&&r<0.25){map[y][x]=T.LAVA_ROCK;continue}
    if(nP&&r<0.15){map[y][x]=sRand()<0.5?T.REED:T.LILY;continue}
    if(nLk&&r<0.12){map[y][x]=sRand()<0.5?T.REED:T.LILY;continue}
    if(nA&&r<0.15){map[y][x]=T.CRYSTAL;continue}
    if(nAb&&r<0.30){map[y][x]=sRand()<0.6?T.DEAD_TREE:T.DEAD_LOTUS;continue}
  }
  
  // Чистим спавн
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const sy=15+dy,sx=8+dx;
    if(sy>=0&&sy<MAP_H&&sx>=0&&sx<MAP_W&&isWalkable(map[sy][sx]))map[sy][sx]=T.PATH;
  }
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)map[21+dy][24+dx]=T.PATH_STONE;
}

function safeSpawn(){
  // Спавн у заброшенного озера
  for(const[x,y]of[[8,15],[8,14],[9,15],[7,15],[8,16],[6,16],[10,15],[8,17]]){
    if(x>=0&&x<MAP_W&&y>=0&&y<MAP_H&&isWalkable(map[y][x]))return{x:x*TILE+TILE/2,y:y*TILE+TILE/2};
  }
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++)if(isWalkable(map[y][x]))return{x:x*TILE+TILE/2,y:y*TILE+TILE/2};
  return{x:W/2,y:H/2};
}

      P.custom={name:String(d.custom.name||'Рыбак').slice(0,14)||'Рыбак',skin:Math.max(0,Math.min(SKINS.length-1,Number(d.custom.skin)||0)),shirt:Math.max(0,Math.min(SHIRTS.length-1,Number(d.custom.shirt)||0)),hat:Math.max(0,Math.min(HATS.length-1,Number(d.custom.hat)||0)),sweater:Math.max(0,Math.min(SWEATERS.length-1,Number(d.custom.sweater)||0))};
    }
    const px=Number(d.px),py=Number(d.py);
    if(isFinite(px)&&isFinite(py)){
      const tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);
      if(tx>=0&&tx<MAP_W&&ty>=0&&ty<MAP_H){
        const tile=map[ty][tx];
        if(isWalkable(tile)||(isWater(tile)&&P.boat.owned&&!isLethalWater(tile))){player.x=px;player.y=py}
        else{for(let r=1;r<15;r++){let found=false;for(let dy=-r;dy<=r&&!found;dy++)for(let dx=-r;dx<=r;dx++){const nx=tx+dx,ny=ty+dy;if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&isWalkable(map[ny][nx])){player.x=nx*TILE+TILE/2;player.y=ny*TILE+TILE/2;found=true;break}}if(found)break}}
      }
    }
    if(src&&src!==KEY){try{save();localStorage.removeItem(src)}catch(e){}}
  }catch(e){}
}

function pxEllipse(cx,cy,rx,ry,color){
  g.fillStyle=color;
  for(let yy=-ry;yy<=ry;yy++){const k=yy/ry,w=Math.floor(rx*Math.sqrt(Math.max(0,1-k*k)));g.fillRect(Math.round(cx-w),Math.round(cy+yy),w*2+1,1)}
}
function pixelLine(x0,y0,x1,y1,color,sag){
  g.fillStyle=color;
  const dx=x1-x0,dy=y1-y0,steps=Math.max(2,Math.ceil(Math.hypot(dx,dy)));
  for(let i=0;i<=steps;i++){const p=i/steps,s=Math.sin(p*Math.PI)*(sag||0);g.fillRect(Math.round(x0+dx*p),Math.round(y0+dy*p+s),1,1)}
}

function drawFishSprite(cx,cy,s,col,flip,shape){
  shape = shape || 'normal';
  g.save();
  g.translate(Math.round(cx),Math.round(cy));
  g.scale(flip?-s:s, s);
  switch(shape){
    case 'slim': drawSlimFish(col); break;
    case 'round': drawRoundFish(col); break;
    case 'pike': drawPikeFish(col); break;
    case 'trout': drawTroutFish(col); break;
    case 'eel': drawEelFish(col); break;
    case 'catfish': drawCatfishFish(col); break;
    case 'sturgeon': drawSturgeonFish(col); break;
    case 'flat': drawFlatFish(col); break;
    case 'sword': drawSwordFish(col); break;
    case 'angler': drawAnglerFish(col); break;
    case 'ray': drawRayFish(col); break;
    case 'whale': drawWhaleFish(col); break;
    case 'squid': drawSquidFish(col); break;
    case 'fancy': drawFancyFish(col); break;
    case 'boot': drawBootFish(col); break;
    case 'can': drawCanFish(col); break;
    case 'frog': drawFrogFish(col); break;
    case 'rod': drawRodFish(col); break;
    case 'normal':
    default: drawNormalFish(col); break;
  }
  g.restore();
}

const WEATHERS={clear:{icon:'☀️'},cloudy:{icon:'☁️'},rain:{icon:'🌧️'},storm:{icon:'⛈️'}};

function updateCamera(){
  if(P.mode==='classic'){cam.x=0;cam.y=0;return}
  cam.x=clamp(player.x-W/2,0,Math.max(0,WORLD_W-W));
  cam.y=clamp(player.y-H/2,0,Math.max(0,WORLD_H-H));
}

function collides(wx,wy){
  const hw=5,hh=4;
  for(const[cx,cy]of[[wx-hw,wy-hh],[wx+hw,wy-hh],[wx-hw,wy+hh],[wx+hw,wy+hh]]){
    const tx=Math.floor(cx/TILE),ty=Math.floor(cy/TILE);
    if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H)return true;
    const tile=map[ty][tx];
    if(isLethalWater(tile))return true;
    if(isWater(tile)){if(!P.boat.owned)return true;continue}
    if(!isWalkable(tile))return true;
  }
  return false;
}

function findNearbyWater(){
  const px=Math.floor(player.x/TILE),py=Math.floor(player.y/TILE);
  for(let r=1;r<=4;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
    const tx=px+dx,ty=py+dy;
    if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H)continue;
    if(isWater(map[ty][tx]))return{x:tx,y:ty,zone:waterToZone(map[ty][tx]),dx,dy};
  }
  return null;
}

// Расчёт расстояния до Дэвида
function checkNearDavid(){
  const dx = player.x - (davidChar.x*TILE+TILE/2);
  const dy = player.y - (davidChar.y*TILE+TILE/2);
  return Math.hypot(dx,dy) < 40;
}

function isInAbandonedZone(){
  // Проверяем: рядом с заброшенным озером?
  const px=Math.floor(player.x/TILE),py=Math.floor(player.y/TILE);
  for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){
    const tx=px+dx,ty=py+dy;
    if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H)continue;
    if(map[ty][tx]===T.ABANDONED)return true;
  }
  return false;
}

function drawTileTop(tile,sx,sy){
  const col=TILE_COLORS[tile];
  if(!col)return;
  g.fillStyle=col.a;g.fillRect(sx,sy,TILE,TILE);
  const t=S.time;
  if(tile===T.TALL_GRASS){
    g.fillStyle=col.b;for(let i=0;i<4;i++)g.fillRect(sx+3+i*3,sy+10+Math.sin(t*1.5+i)*1,1,4);
  }else if(tile===T.FLOWER){
    g.fillStyle=col.b;g.fillRect(sx+4,sy+11,1,2);g.fillRect(sx+10,sy+8,1,2);
    g.fillStyle='#ff6b9d';g.fillRect(sx+10,sy+10,2,2);
    g.fillStyle='#ffe066';g.fillRect(sx+3,sy+9,2,2);
    g.fillStyle='#fff';g.fillRect(sx+7,sy+12,1,1);
  }else if(tile===T.PATH_STONE){
    g.fillStyle=col.b;g.fillRect(sx+1,sy+1,6,6);g.fillRect(sx+9,sy+1,6,6);g.fillRect(sx+1,sy+9,6,6);g.fillRect(sx+9,sy+9,6,6);
  }else if(tile===T.PATH){
    g.fillStyle=col.b;for(let i=0;i<3;i++){const fx=((sx*5+sy*7+i*17)%12)+sx+2;g.fillRect(fx,sy+4+i*3,2,1)}
  }else if(tile===T.BEACH){
    g.fillStyle=col.b;for(let i=0;i<3;i++){const fx=((sx*7+sy*11+i*13)%12)+sx+2,fy=((sx*13+sy*3+i*7)%12)+sy+2;g.fillRect(fx,fy,1,1)}
  }else if(tile===T.SWAMP_GRASS){
    g.fillStyle=col.b;for(let i=0;i<3;i++)g.fillRect(sx+3+i*4,sy+9,1,4);
  }else if(tile===T.ABANDONED){
    // Тёмная вода заброшенного озера
    g.fillStyle='#1a2a3a';g.fillRect(sx,sy,TILE,TILE);
    const wave=Math.sin(t*1.2+sx*0.2+sy*0.2)*1.5;
    g.fillStyle='#2a3a4a';g.fillRect(sx+2+wave,sy+5,5,1);
    g.fillStyle='#0a1a2a';g.fillRect(sx+8-wave,sy+11,4,1);
    // Туман
    if(Math.random()<0.1){g.fillStyle='rgba(150,170,200,0.15)';g.fillRect(sx,sy,16,16)}
  }else if(isWater(tile)){
    const wave=Math.sin(t*2+sx*0.15+sy*0.15)*2;
    g.fillStyle=col.b;g.fillRect(sx+3+wave,sy+5,5,1);g.fillRect(sx+7-wave,sy+11,4,1);
    if(tile===T.LAVA){g.fillStyle='#ffcc00';g.fillRect(sx+4,sy+8,2,1)}
    else if(tile===T.ICE){g.fillStyle='#fff';g.globalAlpha=0.5;g.fillRect(sx+2,sy+2,3,1);g.globalAlpha=1}
  }else if(tile===T.TREE){
    g.fillStyle='rgba(0,0,0,0.25)';g.fillRect(sx+3,sy+13,10,2);
    g.fillStyle='#4a3019';g.fillRect(sx+7,sy+9,2,5);
    pxEllipse(sx+8,sy+6,7,6,'#2a5a2a');pxEllipse(sx+8,sy+4,6,5,'#3a6a3a');
  }else if(tile===T.BUSH){pxEllipse(sx+8,sy+10,6,4,'#3a7a2a');pxEllipse(sx+8,sy+8,5,3,'#4a8a3a')}

}

function drawWorld(){
  const cx0=Math.max(0,Math.floor(cam.x/TILE)),cy0=Math.max(0,Math.floor(cam.y/TILE));
  const cx1=Math.min(MAP_W-1,Math.ceil((cam.x+W)/TILE)),cy1=Math.min(MAP_H-1,Math.ceil((cam.y+H)/TILE));
  for(let ty=cy0;ty<=cy1;ty++)for(let tx=cx0;tx<=cx1;tx++){
    drawTileTop(map[ty][tx],tx*TILE-Math.round(cam.x),ty*TILE-Math.round(cam.y));
  }
}

function drawWaterHint(){
  if(S.phase!=='explore'||P.mode!=='world')return;
  const nw=findNearbyWater();if(!nw)return;
  const sx=nw.x*TILE-cam.x,sy=nw.y*TILE-cam.y;
  const pulse=Math.sin(S.time*3)*0.3+0.7;
  g.globalAlpha=pulse*0.6;g.strokeStyle='#5ddc6a';g.lineWidth=2;
  g.strokeRect(sx-1,sy-1,TILE+2,TILE+2);g.globalAlpha=1;
}

// 🎨 ДЭВИД — загорелый, соломенная шляпа, огненный свитер
function drawDavid(wx,wy){
  const sx=Math.round(wx-cam.x),sy=Math.round(wy-cam.y);
  const t=S.time;
  const bob=Math.sin(t*1.8)*0.5;
  
  // Тень
  g.fillStyle='rgba(0,0,0,0.35)';g.fillRect(sx-4,sy+6,9,3);
  
  // Ноги
  g.fillStyle='#2b2030';g.fillRect(sx-2,sy+4+bob,3,4);g.fillRect(sx+1,sy+4+bob,3,4);
  // Ботинки
  g.fillStyle='#1a1020';g.fillRect(sx-3,sy+8+bob,4,2);g.fillRect(sx+1,sy+8+bob,4,2);
  
  // 🧥 Огненный свитер
  g.fillStyle='#d86a1a';g.fillRect(sx-4,sy-1+bob,9,6);
  g.fillStyle='#ffcc4a';g.fillRect(sx-4,sy-1+bob,9,1);
  // Узор огня
  g.fillStyle='#ff8800';g.fillRect(sx-3,sy+2+bob,2,1);g.fillRect(sx+2,sy+1+bob,2,1);
  g.fillStyle='#ffcc4a';g.fillRect(sx-1,sy+3+bob,2,1);
  
  // 🖐 Загорелые руки
  g.fillStyle='#a87858';
  g.fillRect(sx-5,sy+1+bob,2,3);
  g.fillRect(sx+5,sy+1+bob,2,3);
  
  // 👤 Голова (загорелая кожа)
  g.fillStyle='#a87858';g.fillRect(sx-3,sy-6+bob,7,5);
  g.fillStyle='#885038';g.fillRect(sx-3,sy-2+bob,7,1);
  
  // Глаза
  g.fillStyle='#0a0a12';g.fillRect(sx-2,sy-4+bob,1,1);g.fillRect(sx+2,sy-4+bob,1,1);
  // Усталая улыбка
  g.fillStyle='#5a3830';g.fillRect(sx-1,sy-1+bob,3,1);
  
  // 🎩 Соломенная шляпа
  g.fillStyle='#c8a860';g.fillRect(sx-6,sy-8+bob,13,2);
  g.fillRect(sx-2,sy-10+bob,5,2);
  g.fillStyle='#a88840';g.fillRect(sx-6,sy-7+bob,13,1);
  // Лента
  g.fillStyle='#7a3a1a';g.fillRect(sx-4,sy-7+bob,9,1);
  
  // Аура загадочности (медленное свечение)
  if(checkNearDavid()){
    g.globalAlpha=0.2+Math.sin(t*2)*0.1;
    g.fillStyle='#6a4ac9';
    pxEllipse(sx,sy-3,10,10,'#6a4ac9');
    g.globalAlpha=1;
  }
  
  // Индикатор "можно поговорить"
  if(checkNearDavid()){
    g.fillStyle='#ffd45e';
    g.font='bold 10px monospace';g.textAlign='center';
    g.fillText('💬',sx,sy-16+Math.sin(t*4)*2);
  }
}

function drawBoat(sx,sy,bob,oarAngle,moving){
  g.fillStyle='rgba(0,0,0,0.3)';g.fillRect(sx-11,sy+7+bob*0.3,22,2);
  if(moving){
    const w=Math.sin(S.time*4)*1;
    g.fillStyle='rgba(200,240,255,0.55)';
    g.fillRect(sx-12+w,sy+7+bob*0.3,3,1);g.fillRect(sx+9+w,sy+7+bob*0.3,3,1);
  }
  g.fillStyle='#5a3a1a';g.fillRect(sx-11,sy-2+bob,22,8);
  g.fillStyle='#8a6a3a';g.fillRect(sx-10,sy-3+bob,20,2);
  g.fillStyle='#a8834a';g.fillRect(sx-9,sy-3+bob,18,1);
  g.fillStyle='#4a2a1a';g.fillRect(sx-12,sy-1+bob,2,6);g.fillRect(sx+10,sy-1+bob,2,6);
  g.fillStyle='#6a4a2a';g.fillRect(sx-12,sy+bob,1,4);g.fillRect(sx+11,sy+bob,1,4);
  g.fillStyle='#3a1a0a';g.fillRect(sx-10,sy+5+bob,20,1);
  const oarBaseX=sx+9,oarBaseY=sy-4+bob;
  g.fillStyle='#c8a870';
  const oarLen=8,dx=Math.cos(oarAngle)*oarLen,dy=Math.sin(oarAngle)*oarLen;
  for(let i=0;i<=oarLen;i++){const px=oarBaseX+dx*(i/oarLen),py=oarBaseY+dy*(i/oarLen);g.fillRect(Math.round(px),Math.round(py),1,1)}
  g.fillStyle='#8a6a3a';g.fillRect(Math.round(oarBaseX+dx-1),Math.round(oarBaseY+dy),2,2);
}

function drawPlayerTop(wx,wy){
  const sx=Math.round(wx-cam.x),sy=Math.round(wy-cam.y);
  const cu=P.custom||{skin:1,shirt:0,hat:1,sweater:0};
  const sk=SKINS[cu.skin]||SKINS[1];
  const sh=SHIRTS[cu.shirt]||SHIRTS[0];
  const hat=HATS[cu.hat]||HATS[0];
  const sw=SWEATERS[cu.sweater||0]||SWEATERS[0];
  const t=S.time,onWater=isPlayerOnWater();
  let bob=0;
  if(S.playerAnim==='idle')bob=Math.sin(t*2)*0.5;
  else if(S.playerAnim==='walk')bob=Math.sin(player.anim*2)*1;
  else if(S.playerAnim==='celebrate')bob=Math.abs(Math.sin(t*10))*2;
  else if(S.playerAnim==='jump')bob=-Math.abs(Math.sin(S.playerAnimT*8))*4;
  else if(S.playerAnim==='sad')bob=Math.sin(t*4)*0.7;
  else if(S.playerAnim==='cast')bob=Math.sin(t*6)*0.6;
  else if(S.playerAnim==='reel')bob=Math.sin(t*8)*1;

  if(!onWater){g.fillStyle='rgba(0,0,0,0.35)';g.fillRect(sx-4,sy+6,9,3)}

  const walkOff=player.moving&&S.playerAnim==='walk'?Math.sin(player.anim)*1.5:0;
  g.fillStyle='#2b3550';g.fillRect(sx-2,sy+4+walkOff+bob,3,4);g.fillRect(sx+1,sy+4-walkOff+bob,3,4);

  const bodyColor=sw.c||sh.c,bodyShade=sw.s||sh.s;
  g.fillStyle=bodyColor;g.fillRect(sx-4,sy-1+bob,9,6);
  g.fillStyle=bodyShade;g.fillRect(sx-4,sy-1+bob,9,1);
  if(sw.stripe){g.fillStyle=bodyShade;g.fillRect(sx-4,sy+1+bob,9,1);g.fillRect(sx-4,sy+3+bob,9,1)}
  else if(sw.pattern==='hearts'){g.fillStyle=bodyShade;g.fillRect(sx-2,sy+1+bob,1,1);g.fillRect(sx+1,sy+1+bob,1,1)}
  else if(sw.pattern==='snow'){g.fillStyle='#fff';g.fillRect(sx-1,sy+1+bob,1,1)}
  else if(sw.pattern==='fire'){g.fillStyle=bodyShade;g.fillRect(sx-3,sy+2+bob,2,1);g.fillRect(sx+2,sy+1+bob,2,1)}
  else if(sw.pattern==='night'){g.fillStyle='#fff';g.fillRect(sx-2,sy+1+bob,1,1);g.fillRect(sx+3,sy+2+bob,1,1)}

  g.fillStyle=sk.c;
  if(S.playerAnim==='cast'){const ph=Math.sin(S.playerAnimT*8);if(ph>0)g.fillRect(sx+4,sy-3+bob,3,3);else g.fillRect(sx+5,sy+bob,2,3)}
  else if(S.playerAnim==='reel'){const ph=S.playerAnimT*10;g.fillRect(sx+5+Math.cos(ph)*2,sy+1+bob+Math.sin(ph)*2,2,2)}
  else if(S.playerAnim==='celebrate'){g.fillRect(sx-6,sy-3+bob,2,4);g.fillRect(sx+5,sy-3+bob,2,4)}
  else if(S.playerAnim==='sad'){g.fillRect(sx-5,sy+3+bob,2,3);g.fillRect(sx+4,sy+3+bob,2,3)}
  else if(player.dir==='left')g.fillRect(sx-6,sy+1+bob,2,3);
  else if(player.dir==='right')g.fillRect(sx+5,sy+1+bob,2,3);
  else{g.fillRect(sx-5,sy+1+bob,2,2);g.fillRect(sx+5,sy+1+bob,2,2)}

  g.fillStyle=sk.c;g.fillRect(sx-3,sy-6+bob,7,5);
  g.fillStyle=sk.s;g.fillRect(sx-3,sy-2+bob,7,1);

  const blink=S.blinkT>0&&S.blinkT<0.15;
  if(!blink){
    g.fillStyle='#1a1f30';
    if(S.playerAnim==='celebrate'){g.fillRect(sx-2,sy-5+bob,1,1);g.fillRect(sx+2,sy-5+bob,1,1)}
    else if(S.playerAnim==='sad'){g.fillRect(sx-2,sy-3+bob,1,1);g.fillRect(sx+2,sy-3+bob,1,1)}
    else if(player.dir==='down'){g.fillRect(sx-2,sy-4+bob,1,1);g.fillRect(sx+2,sy-4+bob,1,1)}
    else if(player.dir==='left'){g.fillRect(sx-2,sy-4+bob,1,1)}
    else if(player.dir==='right'){g.fillRect(sx+2,sy-4+bob,1,1)}
  }

  if(S.playerAnim==='celebrate'){g.fillStyle='#a03030';g.fillRect(sx-1,sy-1+bob,3,1)}
  else if(S.playerAnim==='sad'){g.fillStyle='#a03030';g.fillRect(sx-1,sy-1+bob,3,1);g.fillStyle='#1a1f30';g.fillRect(sx-1,sy-2+bob,1,1);g.fillRect(sx+1,sy-2+bob,1,1)}

  if(hat.id==='cap'){g.fillStyle=hat.c;g.fillRect(sx-4,sy-8+bob,9,2);g.fillStyle=hat.s;g.fillRect(sx-4,sy-7+bob,9,1)}
  else if(hat.id==='beanie'){g.fillStyle=hat.c;g.fillRect(sx-3,sy-9+bob,7,3);g.fillStyle=hat.s;g.fillRect(sx-3,sy-8+bob,7,1);g.fillStyle='#fff';g.fillRect(sx-1,sy-10+bob,2,1)}
  else if(hat.id==='straw'){g.fillStyle=hat.c;g.fillRect(sx-6,sy-8+bob,13,2);g.fillRect(sx-2,sy-10+bob,5,2);g.fillStyle=hat.s;g.fillRect(sx-6,sy-7+bob,13,1)}
  else if(hat.id==='crown'){g.fillStyle=hat.c;g.fillRect(sx-3,sy-9+bob,7,3);g.fillRect(sx-3,sy-11+bob,1,2);g.fillRect(sx,sy-11+bob,1,2);g.fillRect(sx+3,sy-11+bob,1,2);g.fillStyle='#ff0066';g.fillRect(sx-1,sy-8+bob,1,1)}
  else if(hat.id==='phones'){g.fillStyle=hat.c;g.fillRect(sx-5,sy-6+bob,1,3);g.fillRect(sx+5,sy-6+bob,1,3);g.fillRect(sx-4,sy-7+bob,9,1);g.fillStyle=hat.s;g.fillRect(sx-5,sy-5+bob,1,1);g.fillRect(sx+5,sy-5+bob,1,1)}

  if(S.playerAnim==='celebrate'){
    for(let i=0;i<5;i++){const ang=t*3+i*Math.PI*2/5,dx=Math.cos(ang)*10,dy=Math.sin(ang)*8-8;g.fillStyle='#ffd45e';g.fillRect(sx+dx,sy+dy+bob,1,1)}
  }
  if(S.playerAnim==='jump'&&S.playerAnimT<0.5){
    g.fillStyle=`rgba(200,200,200,${1-S.playerAnimT*2})`;
    g.fillRect(sx-6,sy+8+bob,2,2);g.fillRect(sx+4,sy+8+bob,2,2);
  }
}

function drawPlayerInBoat(wx,wy){
  const sx=Math.round(wx-cam.x),sy=Math.round(wy-cam.y);
  const cu=P.custom||{skin:1,shirt:0,hat:1,sweater:0};
  const sk=SKINS[cu.skin]||SKINS[1];
  const sh=SHIRTS[cu.shirt]||SHIRTS[0];
  const hat=HATS[cu.hat]||HATS[0];
  const sw=SWEATERS[cu.sweater||0]||SWEATERS[0];
  const bob=S.boatBob;
  const oarAngle=Math.sin(S.oarT)*0.8;
  const moving=player.moving;
  drawBoat(sx,sy,bob,oarAngle,moving);

  const px=sx,py=sy-4+bob;
  const bodyColor=sw.c||sh.c,bodyShade=sw.s||sh.s;
  g.fillStyle=bodyColor;g.fillRect(px-4,py-1,9,5);
  g.fillStyle=bodyShade;g.fillRect(px-4,py-1,9,1);
  if(sw.stripe){g.fillStyle=bodyShade;g.fillRect(px-4,py+1,9,1)}
  else if(sw.pattern==='fire'){g.fillStyle=bodyShade;g.fillRect(px-3,py+2,2,1);g.fillRect(px+2,py+1,2,1)}
  else if(sw.pattern==='night'){g.fillStyle='#fff';g.fillRect(px-2,py+1,1,1)}

  g.fillStyle=sk.c;
  if(moving){
    const rx=px+6+Math.cos(oarAngle)*2,ry=py+1+Math.sin(oarAngle)*2;
    g.fillRect(Math.round(rx),Math.round(ry),2,2);
    g.fillRect(px-6,py+1,2,2);
  } else {
    g.fillRect(px-5,py+2,2,2);g.fillRect(px+4,py+2,2,2);
  }

  g.fillStyle=sk.c;g.fillRect(px-3,py-6,7,5);
  g.fillStyle=sk.s;g.fillRect(px-3,py-2,7,1);
  g.fillStyle='#1a1f30';
  if(player.dir==='down'){g.fillRect(px-2,py-4,1,1);g.fillRect(px+2,py-4,1,1)}
  else if(player.dir==='left'){g.fillRect(px-2,py-4,1,1)}
  else if(player.dir==='right'){g.fillRect(px+2,py-4,1,1)}

  if(hat.id==='cap'){g.fillStyle=hat.c;g.fillRect(px-4,py-8,9,2);g.fillStyle=hat.s;g.fillRect(px-4,py-7,9,1)}

function drawFishingLineWorld(){
  if(!S.targetWater||P.mode!=='world')return;
  const off={up:{x:0,y:-14},down:{x:8,y:8},left:{x:-14,y:-4},right:{x:14,y:-4}};
  const o=off[player.dir]||off.down;
  const tip={x:player.x+o.x,y:player.y+o.y};
  const bx=S.bobberWorld.x-cam.x,by=S.bobberWorld.y-cam.y;
  const tx=tip.x-cam.x,ty=tip.y-cam.y;
  const sag=S.phase==='hooked'?0:(S.phase==='bite'?3:6);
  g.fillStyle='#c8d8e8';
  const dx=bx-tx,dy=by-ty,steps=Math.max(2,Math.ceil(Math.hypot(dx,dy)));
  for(let i=0;i<=steps;i++){const p=i/steps,s=Math.sin(p*Math.PI)*sag;g.fillRect(Math.round(tx+dx*p),Math.round(ty+dy*p+s),1,1)}
  const bwx=Math.round(bx),bwy=Math.round(by);
  g.fillStyle='#e04040';g.fillRect(bwx-2,bwy-2,4,2);
  g.fillStyle='#fff';g.fillRect(bwx-2,bwy,4,2);
  g.fillStyle='#2a2a3a';g.fillRect(bwx-1,bwy-4,2,2);
  if(S.phase==='waiting'||S.phase==='bite'){
    const a=(Math.sin(S.time*3)+1)*0.5;
    g.globalAlpha=0.3*a;g.strokeStyle='#a8dcf0';g.lineWidth=1;
    g.beginPath();g.ellipse(bwx,bwy+2,7+Math.sin(S.time*3)*2,2.5,0,0,Math.PI*2);g.stroke();
    g.globalAlpha=1;
  }
}

function drawMinimap(){
  if(P.mode!=='world')return;
  const mmW=68,mmH=52,mmX=W-mmW-3,mmY=3;
  const sX=mmW/WORLD_W,sY=mmH/WORLD_H;
  g.fillStyle='rgba(5,10,20,0.85)';g.fillRect(mmX-1,mmY-1,mmW+2,mmH+2);
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
    const tile=map[ty][tx];let color;
    if(tile===T.ABANDONED)color='#1a2a3a';
    else if(tile===T.DAVID_HOUSE||tile===T.DAVID_ROOF||tile===T.DAVID_DOOR)color='#8a6a4a';
    else if(isWater(tile))color=TILE_COLORS[tile].a;
    else if(tile===T.TREE||tile===T.BUSH||tile===T.PINE||tile===T.PALM||tile===T.DEAD_TREE)color='#2a4a2a';
    else if(tile===T.PATH||tile===T.PATH_STONE)color='#a8a080';
    else if(tile===T.HOUSE||tile===T.HOUSE_ROOF)color='#c86a4a';
    else if(tile===T.BEACH)color='#d8c890';
    else color='#3a6a3a';
    g.fillStyle=color;
    g.fillRect(mmX+Math.floor(tx*TILE*sX),mmY+Math.floor(ty*TILE*sY),Math.max(1,Math.ceil(TILE*sX)),Math.max(1,Math.ceil(TILE*sY)));
  }
  const px=mmX+Math.floor(player.x*sX),py=mmY+Math.floor(player.y*sY);

}

function drawWorldOverlay(){
  if(S.phase==='explore'&&P.mode==='world'){
    const nw=findNearbyWater();
    if(nw&&!checkNearDavid()){
      const z=ZONES[nw.zone],locked=z.lvl>P.level;
      let label=locked?`🔒 ${z.n} (ур.${z.lvl})`:`🎣 ${z.n}`;
      if(!locked&&isPlayerOnWater())label=`🛶 ${z.n}`;
      const sx=player.x-cam.x,sy=player.y-cam.y-22;
      g.font='bold 7px monospace';g.textAlign='center';
      const tw=g.measureText(label).width;
      g.fillStyle='rgba(5,10,20,0.85)';g.fillRect(sx-tw/2-3,sy-8,tw+6,11);
      g.fillStyle=locked?'#e05050':'#5ddc6a';
      g.fillText(label,sx,sy);
    }
    // Метка Дэвида
    if(checkNearDavid()){
      const sx=player.x-cam.x,sy=player.y-cam.y-22;
      g.font='bold 8px monospace';g.textAlign='center';
      const label='💬 Дэвид';
      const tw=g.measureText(label).width;
      g.fillStyle='rgba(10,10,30,0.9)';g.fillRect(sx-tw/2-3,sy-8,tw+6,11);
      g.fillStyle='#ffd45e';
      g.fillText(label,sx,sy);
    }
  }
  if(isNight()){g.fillStyle='rgba(10,15,40,0.4)';g.fillRect(0,0,W,H)}
  // Туман в заброшенном озере
  if(isInAbandonedZone()){
    g.fillStyle='rgba(80,100,130,0.08)';
    for(let i=0;i<5;i++){
      const fy = ((S.time*8 + i*40) % (H+40)) - 20;
      g.fillRect(0, fy, W, 25);
    }
  }
  if(P.weather==='rain'||P.weather==='storm'){
    const drops=P.weather==='storm'?60:30;
    g.fillStyle='rgba(180,210,240,0.5)';
    for(let i=0;i<drops;i++){const x=(i*37+S.time*380)%W,y=(i*53+S.time*480)%H;g.fillRect(Math.round(x),Math.round(y),1,3)}
  }
  if(S.lightning>0){g.globalAlpha=S.lightning*0.7;g.fillStyle='#e0e8ff';g.fillRect(0,0,W,H);g.globalAlpha=1}
  for(const p of S.particles){
    g.globalAlpha=Math.max(0,1-p.t/p.life);
    g.fillStyle=p.c;
    if(P.mode==='world')g.fillRect(Math.round(p.x-cam.x),Math.round(p.y-cam.y),p.size||1,p.size||1);
    else g.fillRect(Math.round(p.x),Math.round(p.y),p.size||1,p.size||1);
  }
  g.globalAlpha=1;
}

function setPlayerAnim(name,duration=0){

function startFishing(){
  if(P.mode==='classic'){
    if(ZONES[P.zone].lvl>P.level&&ZONES[P.zone].lvl>0){showToast(`🔒 Нужен уровень ${ZONES[P.zone].lvl}`,'danger');return false}
    S.currentZone=P.zone;
    P.visited[P.zone]=true;
    S.classicBobberX=150;S.classicBobberY=120;
    S.targetWater={zone:P.zone};
    S.phase='charging';S.power=0;S.powerDir=1;
    return true;
  }
  const nw=findNearbyWater();
  if(!nw)return false;
  const z=ZONES[nw.zone];
  // Разрешаем нулевой уровень (заброшенное озеро)
  if(z.lvl>P.level){showToast(`🔒 Нужен уровень ${z.lvl}`,'danger');return false}
  if(Math.abs(nw.dx)>Math.abs(nw.dy))player.dir=nw.dx<0?'left':'right';
  else player.dir=nw.dy<0?'up':'down';
  S.targetWater=nw;S.currentZone=nw.zone;P.zone=nw.zone;P.visited[nw.zone]=true;
  S.bobberWorld={x:nw.x*TILE+TILE/2,y:nw.y*TILE+TILE/2};
  S.phase='charging';S.power=0;S.powerDir=1;
  setPlayerAnim('cast',1.0);
  return true;
}

function doCast(){
  if(P.activeBait!=='worm'){P.bait[P.activeBait]--;if(P.bait[P.activeBait]<=0)P.activeBait='worm'}
  S.phase='casting';S.t=0;S.castT=0;
  A.cast();updateUI();save();
}

function startWaiting(){

  const wmod=P.weather==='storm'?0.75:P.weather==='rain'?0.9:1.0;
  S.waitTime=rnd(0.6,1.8)*rod().speed*wmod;
  S.biteWin=2.5;S.biteT=0;

}

function triggerBite(){

}

function hookFish(){
  const reaction=S.biteT;
  let quality,label;
  if(reaction<0.25){quality=2.0;label='⚡ ИДЕАЛЬНАЯ подсечка!';P.perfectHooks++}
  else if(reaction<0.5){quality=1.5;label='✨ Отличная подсечка!'}
  else if(reaction<1.0){quality=1.0;label='👍 Хорошая подсечка'}
  else {quality=0.6;label='😐 Поздновато...'}
  S.hookQuality=quality;
  addLog(label,quality>=1.5?'#ffd45e':(quality>=1.0?'#5ddc6a':'#a0a0a0'));
  if(quality>=1.5)showToast(label,'gold');

  S.curFish=rollFish();
  S.success=false;
  S.tension=20;S.progress=0;S.holding=false;
  S.nextDart=rnd(1.5,2.5);S.dartFlash=0;
  S.phase='hooked';
  setPlayerAnim('reel',3);
  A.cast();updateBtn();
}

function rollFish(){
  const z=ZONES[S.currentZone]||ZONES[0];
  const baseLuck=rod().luck+(P.level-1)*0.015+S.power*0.4+(isPlayerOnWater()?0.1:0);
  const luck=baseLuck*S.hookQuality;
  const baitMult=activeBait().mult;
  const weatherMult=P.weather==='storm'?1.4:P.weather==='rain'?1.2:1.0;
  
  // 🌟 Особый шанс для заброшенной удочки (0.1% × (luck/1000))
  if(S.currentZone===0 && !P.rodSpecial){
    const rodChance = Math.min(0.05, 0.001 * (luck/1000) * S.hookQuality * 100);
    if(Math.random() < rodChance && FISH.old_rod){
      return FISH.old_rod;
    }
  }
  
  const items=z.pool.map(id=>{
    const f=FISH[id];
    if(!f) return {id,f:{w:0,r:0,time:[],weather:['any'],c:{body:'#000',belly:'#000',fin:'#000'}},w:0};
    if(f.special==='rod_1000'){
      // Особая логика для заброшенной удочки — только через спец.шанс
      return {id,f,w:0.001};
    }
    let w=f.w;
    if(f.r>0){
      w*=Math.pow(baitMult,f.r);
      w*=Math.pow(1+luck,f.r*1.5);
    }else{
      w*=Math.max(0.3,1-luck*0.5);
    }
    w *= Math.pow(f.str, S.hookQuality);
    if(f.r>=3)w*=weatherMult;
    if(f.time.includes('day')&&isNight())w*=0.15;
    if(f.time.includes('night')&&!isNight())w*=0.15;
    if(f.time.includes('dawn')&&Math.abs(P.dayTime-0.25)>0.08)w*=0.3;
    if(f.time.includes('dusk')&&Math.abs(P.dayTime-0.75)>0.08)w*=0.3;
    if(f.weather&&!f.weather.includes('any')&&!f.weather.includes(P.weather))w*=0.2;
    return{id,f,w};
  });
  let total=items.reduce((s,i)=>s+i.w,0),r=Math.random()*total;
  for(const it of items){r-=it.w;if(r<=0)return it.f}
  return items[0].f;
}

function catchFish(){
  S.success=true;
  const f=S.curFish;
  
  // 🌟 Особый случай — заброшенная удочка
  if(f.special==='rod_1000'){
    P.rodSpecial=true;
    // Даём владение последней удочкой (индекс 7)
    if(P.rod<7) P.rod=7;
    P.gold+=1000;
    addXP(1000);
    addLog('🎣✨ ЗАБРОШЕННАЯ УДОЧКА ДЭВИДА! +1000 удачи!','#ffd45e');
    showToast('🎣✨ Удочка Дэвида! +1000 удачи!','gold');
  } else {
    P.catches++;
    P.inv[f.n]=(P.inv[f.n]||0)+1;
    const isNew=!P.journal[f.n];
    P.journal[f.n]=(P.journal[f.n]||0)+1;
    if(f.r===2)P.foundRare++;
    if(f.r===4)P.foundLegend++;
    if(f.r===5)P.foundMythic++;
    if(f.r===6)P.foundDivine++;
    addXP(f.x);
    const rar=RARITY[f.r];
    addLog(`✅ ${f.n} (+${f.x} xp)`,rar.c);
    if(isNew)showToast(`🆕 ${f.n}!`,'gold');
  }
  
  const wx=P.mode==='world'?S.bobberWorld.x:150;
  const wy=P.mode==='world'?S.bobberWorld.y:120;
  for(let i=0;i<22;i++){S.particles.push({x:wx,y:wy,vx:rnd(-70,70),vy:rnd(-90,-25),life:rnd(0.5,1.0),t:0,c:Math.random()<0.55?'#a8e4ff':'#fff',size:Math.random()<0.3?2:1})}
  if(P.mode==='world')addFloatText(wx,wy-20,`+${f.x} XP`,'#5ddc6a');
  A.catchIt();vibrate([50,30,100]);
  S.shake=6;
  setPlayerAnim(f.r>=4?'celebrate':'jump',1.5);
  checkAchievements();
  save();
  S.phase='result';S.t=0;
  updateUI();
}

function snapLine(){
  S.success=false;
  A.snap();vibrate([100,50,100,50,150]);
  addLog('💥 Леска порвалась!','#e05050');
  showToast('💥 Порвалась!','danger');
  S.phase='result';S.t=0;
  setPlayerAnim('sad',2);
  updateUI();
}

function addXP(amount){
  P.xp+=amount;
  let need=xpNeed(P.level),leveled=false;
  while(P.xp>=need){P.xp-=need;P.level++;leveled=true;need=xpNeed(P.level)}
  if(leveled){
    A.levelup();vibrate([100,50,100,50,200]);
    addLog(`⭐ УРОВЕНЬ ${P.level}!`,'#ffc94a');
    showToast(`⭐ Уровень ${P.level}!`,'gold');
    ZONES.forEach(z=>{if(z.lvl===P.level)addLog(`🗺️ Открыта: ${z.n}!`,'#4aa8ff')});
  }
}

function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!P.achievements[a.id]&&a.check(P)){
      P.achievements[a.id]=Date.now();
      if(a.xp){addXP(a.xp);addLog(`🏆 ${a.n}: +${a.xp} XP`,'#ffc94a')}
      if(a.gold){P.gold+=a.gold;addLog(`🏆 ${a.n}: +${a.gold} 🪙`,'#ffc94a')}
      showToast(`🏆 ${a.n}!${a.xp?` +${a.xp}xp`:''}${a.gold?` +${a.gold}🪙`:''}`,'gold');
      A.achieve();vibrate([80,50,80,50,120]);
      updateUI();
    }
  });
}

/* ========== КНОПКА ========== */
const btn=document.getElementById('action');
function updateBtn(){
  btn.className='';
  if(S.phase==='explore'){
    // Проверка Дэвида сначала
    if(checkNearDavid()){
      btn.textContent='💬 Поговорить с Дэвидом';
      btn.className='hot';
      return;
    }
    if(P.mode==='classic'){
      const z=ZONES[P.zone]||ZONES[1];
      if(z.lvl>P.level){btn.textContent=`🔒 Ур.${z.lvl}`;btn.className='locked'}
      else btn.textContent=`🎣 ${z.n}`;
      return;
    }
    const nw=findNearbyWater();
    if(nw){
      const z=ZONES[nw.zone];
      if(z.lvl>P.level){btn.textContent=`🔒 Ур.${z.lvl}`;btn.className='locked'}
      else btn.textContent=`🎣 ${z.n}`;
    }else{btn.textContent='🚶 К воде';btn.className='wait'}
    return;
  }
  switch(S.phase){
    case 'charging':btn.textContent='⬆️ ОТПУСТИ!';btn.className='hot';break;
    case 'casting':btn.textContent='⏳';btn.className='wait';break;
    case 'waiting':btn.textContent='⏳ Ждём';btn.className='wait';break;
    case 'bite':btn.textContent='❗ ПОДСЕКАЙ!';btn.className='hot';break;
    case 'hooked':btn.textContent=S.holding?'🔴 ДЕРЖИ':'💪 ТЯНИ!';btn.className='pull';break;
    case 'result':btn.textContent='➡️ ДАЛЬШЕ';break;
  }
}

function press(){
  A.init();
  if(S.phase==='explore'){
    if(checkNearDavid()){
      talkToDavid();
      return;
    }
    if(!startFishing())return;
  }else if(S.phase==='bite'){
    hookFish();
  }else if(S.phase==='hooked'){
    S.holding=true;
  }else if(S.phase==='result'){
    S.phase='explore';S.curFish=null;S.holding=false;S.targetWater=null;
    setPlayerAnim('idle');
    save();
  }
  updateBtn();
}
function release(){
  if(S.phase==='charging')doCast();
  else if(S.phase==='hooked')S.holding=false;
  updateBtn();
}

btn.addEventListener('pointerdown',e=>{e.preventDefault();press()});
btn.addEventListener('pointerup',e=>{e.preventDefault();release()});
btn.addEventListener('pointercancel',()=>release());
btn.addEventListener('pointerleave',()=>{if(S.phase==='charging')release()});

window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)press()}
  if(e.code==='KeyW'||e.code==='ArrowUp')dirs.up=true;
  if(e.code==='KeyS'||e.code==='ArrowDown')dirs.down=true;
  if(e.code==='KeyA'||e.code==='ArrowLeft')dirs.left=true;
  if(e.code==='KeyD'||e.code==='ArrowRight')dirs.right=true;
});
window.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();release()}
  if(e.code==='KeyW'||e.code==='ArrowUp')dirs.up=false;
  if(e.code==='KeyS'||e.code==='ArrowDown')dirs.down=false;
  if(e.code==='KeyA'||e.code==='ArrowLeft')dirs.left=false;
  if(e.code==='KeyD'||e.code==='ArrowRight')dirs.right=false;
});

  b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();set(true);try{b.setPointerCapture(e.pointerId)}catch(_){}});
  b.addEventListener('pointerup',e=>{e.preventDefault();set(false)});
  b.addEventListener('pointercancel',()=>set(false));
  b.addEventListener('lostpointercapture',()=>set(false));
});

let stepSoundT=0;
let lastZoneForMusic=-1;
let davidCooldown=0;

function update(dt){
  S.time+=dt;S.t+=dt;S.playerAnimT+=dt;S.blinkT+=dt;
  if(S.blinkT>3.5)S.blinkT=0;
  
  if(davidCooldown>0) davidCooldown-=dt;
  
  const onWater=isPlayerOnWater();
  if(P.boat.owned&&onWater){
    S.boatBobT+=dt;S.boatBob=Math.sin(S.boatBobT*2.5)*1.2;
    if(player.moving){S.oarT+=dt*5;S.oarSoundT+=dt;if(S.oarSoundT>0.6){A.oar();S.oarSoundT=0}
      if(Math.random()<0.3){S.particles.push({x:player.x+rnd(-8,8),y:player.y+5,vx:rnd(-15,15),vy:rnd(-25,-10),life:0.4,t:0,c:'#a8e4ff',size:1})}
    } else {S.oarT+=dt*0.8;S.oarSoundT=0}
  }

  P.dayTime+=dt/180;
  if(P.dayTime>=1){
    P.dayTime-=1;P.day++;
    if(Math.random()<0.4){
      const roll=Math.random();
      let nw='clear';
      if(roll<0.15)nw='storm';
      else if(roll<0.4)nw='rain';
      else if(roll<0.65)nw='cloudy';
      if(nw!==P.weather){P.weather=nw;addLog(`${WEATHERS[nw].icon}`,'#7a88ac')}
    }
  }
  if(P.weather==='storm'&&Math.random()<0.008){S.lightning=0.9;setTimeout(()=>{S.lightning=0},120)}
  if(S.lightning>0)S.lightning-=dt*8;
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*22);
  if(S.dartFlash>0)S.dartFlash=Math.max(0,S.dartFlash-dt*3);
  for(let i=S.particles.length-1;i>=0;i--){
    const p=S.particles[i];
    p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;
    if(p.t>=p.life)S.particles.splice(i,1);
  }

  if(S.phase==='explore'&&P.mode==='world'){
    let dx=0,dy=0;
    if(dirs.left)dx-=1;
    if(dirs.right)dx+=1;
    if(dirs.up)dy-=1;
    if(dirs.down)dy+=1;
    if(dx!==0||dy!==0){
      const len=Math.hypot(dx,dy);dx/=len;dy/=len;
      const spd=player.speed*dt*(onWater?0.65:1);
      const nx=player.x+dx*spd,ny=player.y+dy*spd;
      if(!collides(nx,player.y))player.x=nx;
      if(!collides(player.x,ny))player.y=ny;
      if(Math.abs(dx)>Math.abs(dy))player.dir=dx<0?'left':'right';
      else player.dir=dy<0?'up':'down';
      player.moving=true;player.anim+=dt*10;
      if(S.playerAnim==='idle'||S.playerAnim==='walk')setPlayerAnim('walk');
      if(!onWater){stepSoundT+=dt;if(stepSoundT>0.3){A.step();stepSoundT=0}}
    }else{
      player.moving=false;
      if(S.playerAnim==='walk')setPlayerAnim('idle');
    }
    
    // Обновление кнопки если рядом с Дэвидом
    const wasNear = S.nearDavid;
    S.nearDavid = checkNearDavid();
    if(wasNear !== S.nearDavid) updateBtn();
    
    // Музыка зоны
    if(S.currentZone !== lastZoneForMusic){
      lastZoneForMusic = S.currentZone;
      if(Music.isEnabled() && ZONES[S.currentZone]){
        Music.start(ZONES[S.currentZone].music);
      }
    }
  }

  switch(S.phase){
    case 'charging':
      if(S.power<1)S.power=Math.min(1,S.power+dt/1.0);
      break;
    case 'casting':
      S.castT+=dt/0.25;
      if(S.castT>=1){
        startWaiting();
        const wx=P.mode==='world'?S.bobberWorld.x:S.classicBobberX;
        const wy=P.mode==='world'?S.bobberWorld.y:S.classicBobberY;
        for(let i=0;i<8;i++){S.particles.push({x:wx,y:wy,vx:rnd(-40,40),vy:rnd(-60,-15),life:rnd(0.4,0.8),t:0,c:'#a8e4ff',size:1})}
        A.splash();updateBtn();
      }
      break;
    case 'waiting':
      if(S.t>=S.waitTime)triggerBite();
      break;
    case 'bite':
      S.biteT+=dt;
      if(S.biteT>=S.biteWin){
        S.biteT=0;S.biteWin=2.0;S.waitTime=rnd(0.5,1.2);
        A.fail();S.phase='waiting';S.t=0;
        updateBtn();
      }
      break;
    case 'hooked':{
      const f=S.curFish;
      const strength=f.str*rod().str;
      if(S.holding){
        S.progress+=25*dt;
        S.tension+=(2+S.progress*0.05)*strength*dt;
        if(Math.random()<0.15)A.reel();
      }else{
        S.progress-=3*dt;
        S.tension-=30*dt;
      }
      S.tension=clamp(S.tension,0,100);
      S.progress=clamp(S.progress,0,100);
      if(S.t>S.nextDart){
        const dartChance=1-(S.progress/100)*0.5;
        if(Math.random()<dartChance*0.7){
          S.tension+=15+Math.random()*20*strength;
          S.dartFlash=0.8;A.dart();vibrate(40);
        }
        S.nextDart=S.t+rnd(1.2,2.4);
      }
      if(S.progress>=100)catchFish();
      else if(S.tension>=100)snapLine();
      break;
    }
    case 'result':
      if(S.t>=2.4){
        S.phase='explore';S.curFish=null;S.holding=false;S.targetWater=null;
        setPlayerAnim('idle');
        updateBtn();
      }
      break;
  }
  updateCamera();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  update(dt);render();
  requestAnimationFrame(loop);
}

function renderJournal(){
  const caughtNames=Object.keys(P.journal).filter(name=>(P.journal[name]||0)>0);
  if(caughtNames.length===0){
    panel.innerHTML='<div style="color:#4a5570;font-size:10px;padding:8px;text-align:center;">Пусто. Поймай рыбу!</div>';
    return;
  }
  const allFish=Object.entries(FISH).map(([key,f])=>({key,name:f.n,fish:f,count:P.journal[f.n]||0,caught:(P.journal[f.n]||0)>0}));
  allFish.sort((a,b)=>{
    if(a.caught!==b.caught)return a.caught?-1:1;
    if(a.fish.r!==b.fish.r)return b.fish.r-a.fish.r;
    return a.name.localeCompare(b.name);
  });
  const caughtCount=allFish.filter(x=>x.caught).length;
  const totalCount=allFish.length;
  const h=document.createElement('div');
  h.style.cssText='color:#7a88ac;font-size:9px;padding:3px 6px;letter-spacing:.5px;';
  h.textContent=`ПОЙМАНО ${caughtCount} / ${totalCount} ВИДОВ`;
  panel.appendChild(h);
  const bar=document.createElement('div');
  bar.style.cssText='height:6px;background:#041410;border:1px solid #1a4a3a;border-radius:4px;margin:0 6px 5px;overflow:hidden;';
  const fill=document.createElement('div');
  fill.style.cssText=`height:100%;width:${(caughtCount/totalCount)*100}%;background:linear-gradient(90deg,#0e8a5a,#4dd8a0);transition:width .3s;`;
  bar.appendChild(fill);
  panel.appendChild(bar);
  allFish.forEach(item=>{
    const f=item.fish;
    const div=document.createElement('div');
    div.className='item rar'+f.r+(item.caught?'':' locked');
    div.style.cursor='default';
    if(item.caught){
      div.innerHTML=`<span>${f.n}<span class="sub">${RARITY[f.r].n} · ${f.v}🪙 · ${f.x} XP</span></span><span class="price">×${item.count}</span>`;
    } else {
      div.innerHTML=`<span>???<span class="sub">${RARITY[f.r].n} · ${f.v}🪙</span></span><span class="price">—</span>`;
    }
    panel.appendChild(div);
  });
  if(caughtCount<totalCount){
    const toggleBtn=document.createElement('button');
    toggleBtn.className='shopbtn';
    toggleBtn.textContent='👁️ Показать непойманных';
    toggleBtn.style.cssText+='background:linear-gradient(180deg,#5a8888,#3a5c5c);color:#d8f8f0;margin-top:5px;';
    toggleBtn.onclick=()=>{
      panel.innerHTML='';
      const h2=document.createElement('div');
      h2.style.cssText='color:#7a88ac;font-size:9px;padding:3px 6px;';
      h2.textContent=`ВСЕ ВИДЫ (${totalCount})`;
      panel.appendChild(h2);
      allFish.forEach(it=>{
        const ff=it.fish;
        const d2=document.createElement('div');
        d2.className='item rar'+ff.r;
        d2.style.cursor='default';
        d2.innerHTML=`<span>${it.caught?'✅':'🔒'} ${ff.n}<span class="sub">${RARITY[ff.r].n} · ${ff.v}🪙 · ${ff.x} XP</span></span><span class="price">${it.caught?'×'+it.count:'—'}</span>`;
        panel.appendChild(d2);

setInterval(save,15000);
window.addEventListener('beforeunload',save);
requestAnimationFrame(loop);

// Запуск музыки после первого клика
document.addEventListener('click',()=>{
  if(P.musicEnabled && !Music.isEnabled()){
    Music.setEnabled(true);
  }
  if(P.musicEnabled){
    A.init();
    Music.start(ZONES[S.currentZone]?.music || 'pond');
  }
}, {once:true});

}catch(err){
  const el=document.getElementById('err');
  el.style.display='block';
  el.textContent='💥 '+err.message+' | '+(err.stack||'').split('\n')[0];
  console.error(err);
}
</script>
